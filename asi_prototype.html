/* ═══════════════════════════════════════════════════════════
   LOGIN — usuario y contraseña (PRD §1)
═══════════════════════════════════════════════════════════ */
const DEMO_CRED = {
  supervisor: { username:"supervisor", password:"supervisor123", nombre:"María González",  rol:"supervisor" },
  admin:      { username:"admin",      password:"admin123",      nombre:"Roberto Valente", rol:"admin" },
  dueno:      { username:"dueno",      password:"dueno123",      nombre:"Gerencia General",rol:"dueno" },
};

function LoginScreen() {
  const { apiStatus, apiFetch, setCurrentUser, setApiToken } = useApp();
  const [user, setUser]   = useState("");
  const [pass, setPass]   = useState("");
  const [ver,  setVer]    = useState(false);
  const [load, setLoad]   = useState(false);
  const [err,  setErr]    = useState(null);
  const [demo, setDemo]   = useState(false);
  // Ingreso biométrico DEMOSTRATIVO: simula Face ID / huella y entra con el último
  // usuario demo. Solo en modo demo — con servidor real no puede saltear la contraseña.
  const [bio, setBio]     = useState(null); // null | "leyendo" | "ok"
  const esIOS = typeof navigator !== "undefined" &&
    (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1));
  const bioNombre = esIOS ? "Face ID" : "huella";
  const bioDisponible = apiStatus !== "connected";
  const ingresarBio = () => {
    if (bio) return;
    setErr(null); setBio("abre");
    // abre → escanea → confirma → se cierra → entra (tiempos parecidos al Face ID real)
    setTimeout(() => setBio("leyendo"), 30);
    setTimeout(() => { setBio("ok"); if (navigator.vibrate) navigator.vibrate(25); }, 1450);
    setTimeout(() => setBio("cierra"), 2150);
    setTimeout(() => {
      setBio(null);
      let k = "supervisor";
      try { k = localStorage.getItem("asi_ultimo_demo") || "supervisor"; } catch {}
      const c = DEMO_CRED[k] || DEMO_CRED.supervisor;
      setCurrentUser({ id: 0, nombre: c.nombre, rol: c.rol });
    }, 2550);
  };

  const entrar = async () => {
    setErr(null);
    if (!user.trim() || !pass) { setErr("Ingresá usuario y contraseña."); return; }
    setLoad(true);

    if (apiStatus === "connected") {
      try {
        const res  = await apiFetch("/api/login", { method:"POST", body: JSON.stringify({ username:user.trim(), password:pass }) });
        const data = await res.json();
        if (data.ok) { setApiToken(data.token); setCurrentUser(data.usuario); }
        else setErr(data.mensaje || "Credenciales incorrectas.");
      } catch { setErr("No se pudo contactar al servidor."); }
      finally { setLoad(false); }
      return;
    }

    // Modo demo: valida contra las credenciales locales
    await new Promise(r => setTimeout(r, 480));
    const match = Object.values(DEMO_CRED).find(c => c.username === user.trim().toLowerCase() && c.password === pass);
    if (match) {
      try { localStorage.setItem("asi_ultimo_demo", Object.keys(DEMO_CRED).find(k => DEMO_CRED[k] === match)); } catch {}
      setCurrentUser({ id: 0, nombre: match.nombre, rol: match.rol });
    }
    else setErr("Usuario o contraseña incorrectos.");
    setLoad(false);
  };

  const ROL_DEMO = { supervisor:"Supervisor", admin:"Administración", dueno:"Dirección" };

  return (
    <div className="relative flex-1 flex flex-col overflow-hidden bg-page a-fade">
      {/* Marca de agua del emblema — 4.5% de opacidad, solo en el login */}
      <img src={EMBLEMA_ASI} alt="" aria-hidden="true"
        className="absolute pointer-events-none select-none" style={{ right:-86, bottom:-48, width:300, opacity:.045 }} />

      <div className="scroll-y relative px-6 flex flex-col">
        {/* Marca */}
        <div className="flex flex-col items-center pt-14">
          <img src={LOGO_ASI} alt="Argentina Seguridad Integral" className="w-[204px] h-auto" />
          <div className="mt-5 flex items-center gap-2.5">
            <span className="w-5 h-px bg-[#B9C2DA]" />
            <span className="font-cond text-[13px] font-semibold uppercase tracking-[.2em] text-ink-mute">Panel de supervisión</span>
            <span className="w-5 h-px bg-[#B9C2DA]" />
          </div>
        </div>

        <div className="mt-11">
          <h1 className="text-[30px] leading-[1.1] font-semibold tracking-[-0.01em] text-ink">Iniciar sesión</h1>
          <p className="mt-2 mb-5 text-[16px] text-ink-mute">Ingresá con tu usuario corporativo.</p>

          {/* Usuario y contraseña agrupados, como los ajustes de iOS */}
          <div className="bg-white border border-line rounded-[14px] overflow-hidden focus-within:outline focus-within:outline-[3px] focus-within:outline-brand-500 focus-within:outline-offset-2">
            <label className="flex items-center gap-3 min-h-[58px] pl-4 pr-2">
              <Icon name="user" size={20} className="text-ink-faint" strokeWidth={1.8} />
              <span className="w-[92px] text-[16px] font-medium text-ink shrink-0">Usuario</span>
              <input value={user} onChange={e => setUser(e.target.value)} placeholder="nombre.apellido"
                autoComplete="username" autoCapitalize="none" spellCheck="false"
                className="flex-1 min-w-0 h-14 bg-transparent outline-none text-[17px] text-ink" />
            </label>
            <div className="h-px bg-line ml-12" />
            <label className="flex items-center gap-3 min-h-[58px] pl-4 pr-1.5">
              <Icon name="lock" size={20} className="text-ink-faint" strokeWidth={1.8} />
              <span className="w-[92px] text-[16px] font-medium text-ink shrink-0">Contraseña</span>
              <input type={ver ? "text" : "password"} value={pass} onChange={e => setPass(e.target.value)}
                onKeyDown={e => e.key === "Enter" && entrar()} placeholder="Requerida" autoComplete="current-password"
                className="flex-1 min-w-0 h-14 bg-transparent outline-none text-[17px] text-ink" />
              <button type="button" onClick={() => setVer(v => !v)} className="w-12 h-12 flex items-center justify-center text-ink-mute rounded-[10px] focus-ring"
                aria-label={ver ? "Ocultar contraseña" : "Mostrar contraseña"}>
                <Icon name={ver ? "eye-off" : "eye"} size={21} strokeWidth={1.8} />
              </button>
            </label>
          </div>

          {err && (
            <div className="mt-3 bg-bad-soft rounded-[12px] px-4 py-3 flex items-start gap-2 a-dn" role="alert">
              <Icon name="alert" size={17} className="text-bad-ink mt-px" />
              <p className="text-[15px] font-semibold text-bad-ink leading-snug">{err}</p>
            </div>
          )}

          <div className="flex justify-end">
            <button type="button" className="min-h-[44px] text-[15px] font-medium text-brand-500 focus-ring rounded-[8px]"
              title="Pedí el blanqueo a Administración">¿Olvidaste tu contraseña?</button>
          </div>

          <Btn full size="lg" onClick={entrar} loading={load} className="mt-2">
            {load ? "Verificando…" : "Ingresar"}
          </Btn>

          <div className="flex items-center gap-3 my-4">
            <span className="h-px bg-line flex-1" />
            <span className="text-[13px] text-ink-faint">o</span>
            <span className="h-px bg-line flex-1" />
          </div>

          <Btn full size="lg" variant="white" icon={esIOS ? "face-id" : "fingerprint"} disabled={!bioDisponible}
            title={bioDisponible ? `Demostración de ingreso con ${bioNombre}` : "Disponible en la app nativa"} onClick={ingresarBio}>
            Ingresar con {bioNombre}
          </Btn>
        </div>

        <div className="mt-auto pt-8 pb-5 flex flex-col items-center gap-0.5">
          <button type="button" onClick={() => setDemo(true)}
            className="min-h-[44px] px-3 text-[15px] font-medium text-brand-500 focus-ring rounded-[8px]">Accesos de prueba</button>
          <div className="flex items-center gap-1.5 text-[13px] text-ink-faint">
            <Icon name="shield-ok" size={14} />
            <span>Conexión cifrada · ASI v3.0</span>
          </div>
        </div>
      </div>

      {bio && (
        <div role="status" aria-live="polite" aria-label={bio === "ok" ? "Identidad verificada" : `Verificando con ${bioNombre}`}
          className={cx("isla-fid", (bio === "leyendo" || bio === "ok") && "abierta", bio === "cierra" && "cerrando")}
          style={{ top: esCelularWeb ? 11 : 10, // la isla dinámica del iPhone está a 11px del borde
                   position: esCelularWeb ? "fixed" : "absolute" }}>
          <div className="glifo">
            {bio === "ok" || bio === "cierra" ? (
              <svg className="tilde" width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
                <circle cx="32" cy="32" r="29" stroke="#30D158" strokeWidth="3" />
                <path d="M20 33l8 8 16-17" stroke="#30D158" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            ) : (
              <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#FFFFFF" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <g className="esquinas">
                  <path d="M6 20V12a6 6 0 0 1 6-6h8" /><path d="M44 6h8a6 6 0 0 1 6 6v8" />
                  <path d="M58 44v8a6 6 0 0 1-6 6h-8" /><path d="M20 58h-8a6 6 0 0 1-6-6v-8" />
                </g>
                <g className="rasgos">
                  <path d="M22 24v5" /><path d="M42 24v5" /><path d="M32 24v12l-3 2" /><path d="M23 44c5 4 13 4 18 0" />
                </g>
              </svg>
            )}
          </div>
        </div>
      )}

      <Sheet open={demo} onClose={() => setDemo(false)} title="Accesos de prueba" sub="Solo disponibles en modo demostración.">
        <div className="bg-white border border-line rounded-[14px] overflow-hidden">
          {Object.entries(DEMO_CRED).map(([k, c], i) => (
            <button key={k} onClick={() => { setUser(c.username); setPass(c.password); setErr(null); setDemo(false); }}
              className={cx("fila-toque w-full min-h-[64px] px-4 flex items-center gap-3.5 text-left focus-ring", i > 0 && "border-t border-line")}>
              <span className="flex-1 min-w-0">
                <span className="block text-[17px] font-semibold text-ink">{ROL_DEMO[k]}</span>
                <span className="block text-[14px] text-ink-faint">{c.nombre} · {c.username}</span>
              </span>
              <Icon name="chevron-r" size={16} className="text-ink-faint" />
            </button>
          ))}
        </div>
      </Sheet>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PASO 1 — Inicio de ronda: objetivo + geocerca (PRD §2)
═══════════════════════════════════════════════════════════ */
const TIPO_ICON = { Barrios:"home", Industrias:"factory", Locales:"store" };

function Step1({ rd, setRD, onNext }) {
  const { objetivos, visitasPorObj } = useApp();
  const { coords, error: gpsErr, reintentar } = useDeviceGeolocation();
  const [just, setJust] = useState(rd.justificacion || "");
  const [busca,setBusca]= useState("");
  const [tick, setTick] = useState(new Date());
  const obj = rd.objetivo;
  const remotoRef = useRef(null);

  useEffect(() => { const t = setInterval(() => setTick(new Date()), 1000); return () => clearInterval(t); }, []);

  // Distancia real al objetivo — deriva el estado del geocerco a partir del GPS del dispositivo, no de un valor simulado
  const distancia = (coords && obj?.lat != null) ? distanciaMetros(coords.lat, coords.lng, obj.lat, obj.lng) : null;
  const gps = gpsErr ? "error" : !coords ? "searching" : !obj ? "searching" : (distancia <= obj.radio_geocerca_m ? "inside" : "outside");

  // Espeja el GPS en el acta. Si se pierde la señal, `coords` queda en null y hay que
  // borrar también la posición del acta — un acta remota no puede viajar con las
  // coordenadas de un fix anterior como si el dispositivo las hubiera confirmado.
  useEffect(() => {
    setRD(p => ({
      ...p,
      deviceCoords: coords || null,
      gpsStatus: gps,
      distanciaGeocerca: distancia != null ? Math.round(distancia) : null,
    }));
  }, [coords, gps, distancia]);

  const lista = useMemo(() => {
    const q = busca.trim().toLowerCase();
    return objetivos.filter(o => !q || o.nombre.toLowerCase().includes(q) || (o.direccion || "").toLowerCase().includes(q));
  }, [objetivos, busca]);

  const grupos = useMemo(() => {
    const g = {};
    for (const o of lista) (g[o.tipo] = g[o.tipo] || []).push(o);
    return g;
  }, [lista]);

  const elegir = (o) => setRD(p => ({ ...p, objetivo: o }));

  const puedePresencial = gps === "inside"  && obj;
  const puedeRemota     = (gps === "outside" || gps === "error") && obj && just.trim().length >= 10;

  const arrancar = (tipo) => {
    setRD(p => ({ ...p, tipo, justificacion: tipo === "remota" ? just : null, horaInicio: new Date() }));
    onNext();
  };

  const GPS_ERR_TXT = {
    denied:      "Permiso de ubicación denegado",
    unavailable: "Señal GPS no disponible",
    timeout:     "Tiempo de espera agotado",
    unsupported: "Este dispositivo no soporta GPS",
  };

  const GPS_UI = {
    searching: { tone:"warn", txt:"Buscando señal GPS…",     icon:"pin" },
    inside:    { tone:"good", txt:"Dentro del geocerco",     icon:"shield-ok" },
    outside:   { tone:"bad",  txt:"Fuera del geocerco",      icon:"alert" },
    error:     { tone:"bad",  txt: GPS_ERR_TXT[gpsErr] || "Error de GPS", icon:"alert" },
  }[gps];

  return (
    <div className="flex flex-col gap-4 px-4 py-4 a-fade">
      <SH title="Inicio de ronda" sub="Elegí el objetivo y validá tu presencia en el lugar" />

      {/* Reloj + estado GPS */}
      <Clay className="p-4">
        <div className="flex items-start justify-between gap-3">
          <div>
            <Label>Hora del dispositivo</Label>
            <p className="text-[34px] font-black text-ink tnum leading-none mt-1.5">{tick.toLocaleTimeString("es-AR")}</p>
            <p className="text-xs text-ink-mute mt-1 first-letter:uppercase">{fmtLargo(tick)}</p>
          </div>
          <div className={cx("w-14 h-14 rounded-[19px] flex items-center justify-center shrink-0",
            gps === "inside" ? "bg-good-soft text-good-ink" : (gps === "outside" || gps === "error") ? "bg-bad-soft text-bad-ink" : "bg-warn-soft text-warn-ink")}>
            <Icon name={GPS_UI.icon} size={26} />
          </div>
        </div>
        <div className="clay-inset flex items-center gap-2.5 px-3.5 py-2.5 mt-3.5">
          <Dot tone={GPS_UI.tone} pulse={gps === "searching"} />
          <span className={cx("text-xs font-bold",
            gps === "inside" ? "text-good-ink" : (gps === "outside" || gps === "error") ? "text-bad-ink" : "text-warn-ink")}>{GPS_UI.txt}</span>
        </div>
        {gps === "error" && (
          <button onClick={reintentar} className="clay-btn w-full mt-3 py-2.5 rounded-[14px] text-xs font-black flex items-center justify-center gap-1.5 bg-white text-ink-mute">
            <Icon name="refresh" size={14} /> Reintentar ubicación
          </button>
        )}
      </Clay>

      {/* Selector de objetivo */}
      <div>
        <div className="flex items-center justify-between mb-2">
          <Label>Objetivo de la ronda</Label>
          {obj && <Badge tone="brand" icon="check">Seleccionado</Badge>}
        </div>
        <div className="clay-inset flex items-center gap-2.5 px-3.5 py-2.5 mb-2.5">
          <Icon name="search" size={16} className="text-ink-faint" />
          <input value={busca} onChange={e => setBusca(e.target.value)} placeholder="Buscar objetivo o dirección…"
            className="flex-1 bg-transparent outline-none text-sm font-semibold text-ink placeholder:text-ink-faint placeholder:font-medium min-w-0" />
          {busca && <button onClick={() => setBusca("")} className="text-ink-faint p-1.5" aria-label="Limpiar"><Icon name="x" size={15} /></button>}
        </div>

        {lista.length === 0 && <Empty icon="search" title="Sin resultados" sub="Probá con otro nombre o dirección." />}

        <div className="flex flex-col gap-3">
          {Object.entries(grupos).map(([tipo, arr]) => (
            <div key={tipo}>
              <div className="flex items-center gap-1.5 mb-1.5 px-1">
                <Icon name={TIPO_ICON[tipo] || "building"} size={13} className="text-ink-faint" />
                <span className="text-[10px] font-black uppercase tracking-wider text-ink-faint">{tipo}</span>
              </div>
              <div className="flex flex-col gap-2">
                {arr.map(o => {
                  const hechas = visitasPorObj[o.id] ?? o.visitas_mes ?? 0;
                  const meta   = o.visitas_meta_mes || 0;
                  const sel    = obj?.id === o.id;
                  const cumple = meta > 0 && hechas >= meta;
                  return (
                    <button key={o.id} onClick={() => elegir(o)}
                      aria-pressed={sel}
                      className={cx("clay fila-toque text-left px-4 py-3.5 min-h-[76px] focus-ring",
                        sel && "!bg-brand-50 !border-brand-600")}>
                      <div className="flex items-start justify-between gap-2">
                        <div className="min-w-0 flex-1">
                          <p className="text-[17px] font-semibold leading-tight text-ink">{o.nombre}</p>
                          <p className="text-[14px] mt-1 truncate text-ink-faint">
                            {SUBTIPO_LABEL[o.subtipo] || o.tipo}{o.direccion ? ` · ${o.direccion}` : ""}
                          </p>
                        </div>
                        <div className="flex items-center gap-1.5 shrink-0">
                          {/* Un solo botón fusiona el estado del geocerco con la acción de continuar —
                              antes eran dos círculos chicos (estado + "seleccionado"), difíciles de tocar
                              y que no se leían como accionables. Solo se revela al elegir el objetivo:
                              mostrarlo en todas las tarjetas de entrada generaba alertas rojas sin sentido.
                              Con muchos objetivos en la lista, tocarlo evita scrollear hasta el botón del
                              fondo para arrancar la ronda. */}
                          {sel && gps === "inside" && (
                            <span role="button" tabIndex={0}
                              onClick={e => { e.stopPropagation(); arrancar("presencial"); }}
                              onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.stopPropagation(); e.preventDefault(); arrancar("presencial"); } }}
                              className="clay-press w-12 h-12 rounded-full flex items-center justify-center shrink-0 bg-good text-white focus-ring"
                              title="Iniciar checklist presencial" aria-label="Iniciar checklist presencial">
                              <Icon name="check" size={20} strokeWidth={3} />
                            </span>
                          )}
                          {sel && (gps === "outside" || gps === "error") && (
                            <span role="button" tabIndex={0}
                              onClick={e => { e.stopPropagation(); remotoRef.current?.scrollIntoView({ behavior:"smooth", block:"center" }); }}
                              onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.stopPropagation(); e.preventDefault(); remotoRef.current?.scrollIntoView({ behavior:"smooth", block:"center" }); } }}
                              className="clay-press w-12 h-12 rounded-full flex items-center justify-center shrink-0 bg-bad text-white focus-ring"
                              title="Fuera del geocerco — ir a justificar supervisión remota" aria-label="Fuera del geocerco — ir a justificar supervisión remota">
                              <Icon name="alert" size={20} strokeWidth={3} />
                            </span>
                          )}
                          {sel && gps !== "inside" && gps !== "outside" && gps !== "error"
                            ? <span className="w-7 h-7 rounded-full bg-brand-600 text-white flex items-center justify-center shrink-0"><Icon name="check" size={15} strokeWidth={3} /></span>
                            : !sel && <span className={cx("text-[15px] font-semibold tnum shrink-0", cumple ? "text-good-ink" : "text-ink")}>{hechas}/{meta}</span>}
                        </div>
                      </div>
                      {/* Cumplimiento mensual del objetivo (PRD §7) */}
                      <div className="mt-2.5">
                        <div className="w-full rounded-full overflow-hidden bg-[#E6EAF2]" style={{ height:5 }}>
                          <div className="h-full rounded-full transition-all duration-700"
                            style={{ width:`${meta ? Math.min(hechas / meta * 100, 100) : 0}%`,
                                     background: cumple ? "#047857" : "#1F327C" }} />
                        </div>
                        <p className="text-[14px] mt-1.5 text-ink-mute">
                          {hechas} de {meta} visitas este mes
                        </p>
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      </div>

      {!obj && gps !== "searching" && (
        <div className="bg-warn-soft rounded-[16px] px-4 py-3 flex items-center gap-2 a-up">
          <Icon name="info" size={15} className="text-warn-ink" />
          <p className="text-xs font-bold text-warn-ink">Seleccioná un objetivo para continuar.</p>
        </div>
      )}

      {gps === "inside" && (
        <Btn full size="xl" variant="success" icon="shield-ok" disabled={!puedePresencial}
          onClick={() => arrancar("presencial")}>
          Iniciar checklist presencial
        </Btn>
      )}

      {(gps === "outside" || gps === "error") && (
        <div ref={remotoRef} className="flex flex-col gap-3 a-up">
          <Clay className="p-4" tint="#FFF1F2">
            <div className="flex items-start gap-2.5">
              <Icon name="alert" size={18} className="text-bad-ink mt-px" />
              <div>
                <p className="text-sm font-black text-bad-ink">Modo presencial bloqueado</p>
                <p className="text-xs text-bad-ink/80 mt-1 leading-relaxed">
                  {gps === "error"
                    ? "No se pudo obtener tu ubicación real. Podés registrar una supervisión remota justificando el motivo."
                    : "Estás fuera del geocerco. Podés registrar una supervisión remota justificando el motivo."}
                </p>
              </div>
            </div>
          </Clay>
          <Textarea label="Justificación obligatoria" value={just} onChange={e => setJust(e.target.value)}
            rows={3} placeholder="Ej: Superviso por cámara desde la central a pedido del cliente…"
            hint={<p className={cx("text-[11px] font-bold mt-1.5", just.trim().length >= 10 ? "text-good-ink" : "text-ink-faint")}>
              {just.trim().length >= 10 ? `${just.trim().length} caracteres` : `Faltan ${10 - just.trim().length} caracteres`}
            </p>} />
          <Btn full size="xl" variant="warn" icon="radio" disabled={!puedeRemota} onClick={() => arrancar("remota")}>
            Iniciar supervisión remota
          </Btn>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PERFIL DEL VIGILADOR — 4 pestañas (PRD §9)
═══════════════════════════════════════════════════════════ */
const ESTADO_TONE = { activo:"good", suspendido:"bad", "baja temporal":"warn", baja:"warn" };

function PerfilVigilador({ v, historial = [], sanciones = [], incidencias = [] }) {
  const [tab, setTab] = useState("principal");
  const dCred = diasHasta(v.credencial_venc);
  const dLic  = diasHasta(v.licencia_venc);

  const alertas = [];
  if (dCred != null && dCred <= 30) alertas.push({ txt:`La credencial vence en ${dCred} días`, tone:"bad" });
  if (v.es_chofer && dLic != null && dLic <= 30) alertas.push({ txt:`El carnet de conducir vence en ${dLic} días`, tone:"warn" });

  return (
    <div className="flex flex-col gap-3.5">
      {/* Cabecera */}
      <div className="flex items-center gap-3.5">
        <Avatar nombre={v.nombre} size={60} src={v.foto_url} />
        <div className="min-w-0 flex-1">
          <p className="text-[15px] font-black text-ink leading-tight">{v.nombre}</p>
          <p className="text-xs text-ink-mute mt-0.5">{v.puesto}</p>
          <div className="flex gap-1.5 mt-1.5 flex-wrap">
            <Badge tone="brand">Legajo {v.legajo}</Badge>
            <Badge tone={ESTADO_TONE[v.estado] || "gray"} icon={v.estado === "activo" ? "check" : "alert"}>
              {v.estado?.charAt(0).toUpperCase() + v.estado?.slice(1)}
            </Badge>
          </div>
        </div>
      </div>

      {alertas.map((a, i) => (
        <div key={i} className={cx("rounded-[15px] px-3.5 py-2.5 flex items-start gap-2",
          a.tone === "bad" ? "bg-bad-soft" : "bg-warn-soft")}>
          <Icon name="alert" size={15} className={a.tone === "bad" ? "text-bad-ink" : "text-warn-ink"} />
          <p className={cx("text-[11px] font-bold leading-snug", a.tone === "bad" ? "text-bad-ink" : "text-warn-ink")}>
            {a.txt} · se notifica a RRHH automáticamente
          </p>
        </div>
      ))}

      <Segmented value={tab} onChange={setTab} options={[
        ["principal","Principales"], ["personal","Personales"], ["caract","Caract."], ["actas","Actas"],
      ]} />

      <Clay className="p-4 a-fade">
        {tab === "principal" && (
          <div>
            <Row k="Nombre completo"   v={v.nombre} />
            <Row k="Nº de legajo"      v={v.legajo} />
            <Row k="DNI"               v={v.dni || "—"} />
            <Row k="Estado"            v={v.estado} tone={ESTADO_TONE[v.estado] || "gray"} />
            <Row k="Objetivo asignado" v={v.objetivo_asignado || "Sin asignar"} last />
          </div>
        )}

        {tab === "personal" && (
          <div>
            <Row k="Teléfono"          v={v.telefono || "—"} />
            <Row k="Domicilio"         v={v.domicilio || "—"} />
            <Row k="Fecha de nac."     v={v.fecha_nacimiento ? fmtFecha(v.fecha_nacimiento) : "—"} />
            <Row k="Nacionalidad"      v={v.nacionalidad || "—"} last />
          </div>
        )}

        {tab === "caract" && (
          <div>
            <Row k="Nº credencial"     v={v.credencial_numero || "—"} />
            <Row k="Venc. credencial"
                 v={v.credencial_venc ? `${fmtFecha(v.credencial_venc)}${dCred != null ? ` · ${dCred}d` : ""}` : "—"}
                 tone={dCred != null && dCred <= 30 ? "bad" : "good"} />
            <Row k="Habilitado chofer" v={v.es_chofer ? "Sí" : "No"} tone={v.es_chofer ? "good" : "gray"} />
            {v.es_chofer && <Row k="Categoría licencia" v={v.licencia_cat || "—"} tone="brand" />}
            {v.es_chofer && <Row k="Venc. licencia"
                 v={v.licencia_venc ? `${fmtFecha(v.licencia_venc)}${dLic != null ? ` · ${dLic}d` : ""}` : "—"}
                 tone={dLic != null && dLic <= 30 ? "warn" : "good"} />}
            <Row k="Portación de arma" v={v.armado ? "Sí" : "No"} tone={v.armado ? "tang" : "gray"} />
            <Row k="Tiene radio"       v={v.tiene_radio ? "Sí" : "No"} tone={v.tiene_radio ? "good" : "gray"} />
            <Row k="Convenio"          v={v.convenio || "UPSRA"} tone="plum" last />
          </div>
        )}

        {tab === "actas" && (
          <div className="flex flex-col gap-4">
            <div>
              <Label className="mb-2">Sanciones registradas</Label>
              {sanciones.length === 0
                ? <p className="text-xs text-ink-faint py-1">Sin sanciones registradas.</p>
                : sanciones.map((s, i) => (
                  <div key={i} className={cx("flex items-start gap-2.5 py-2.5", i < sanciones.length - 1 && "border-b border-slate-100")}>
                    <Badge tone={{ activa:"bad", cumplida:"good", apelada:"warn" }[s.estado] || "gray"}>{s.estado}</Badge>
                    <div className="min-w-0">
                      <p className="text-[12px] text-ink font-semibold leading-snug">{s.descripcion}</p>
                      <p className="text-[10px] text-ink-faint mt-0.5">{fmtFecha(s.fecha)}</p>
                    </div>
                  </div>
                ))}
            </div>

            <div>
              <Label className="mb-2">Historial de actas</Label>
              {historial.length === 0
                ? <p className="text-xs text-ink-faint py-1">Sin actas previas.</p>
                : historial.map((h, i) => (
                  <div key={i} className={cx("flex items-start gap-2.5 py-2.5", i < historial.length - 1 && "border-b border-slate-100")}>
                    <Badge tone={h.tipo === "Sanción" ? "bad" : "warn"}>{h.tipo}</Badge>
                    <div className="min-w-0">
                      <p className="text-[12px] text-ink font-semibold leading-snug">{h.descripcion || h.desc}</p>
                      <p className="text-[10px] text-ink-faint mt-0.5">{fmtFecha(h.fecha)}</p>
                    </div>
                  </div>
                ))}
            </div>

            {incidencias.length > 0 && (
              <div>
                <Label className="mb-2">Incidencias asociadas</Label>
                {incidencias.map((t, i) => (
                  <div key={i} className={cx("py-2.5", i < incidencias.length - 1 && "border-b border-slate-100")}>
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-mono font-bold text-ink-mute">{t.codigo_ticket}</span>
                      <Badge tone={t.estado === "ABIERTO" ? "bad" : "good"}>{t.estado}</Badge>
                    </div>
                    <p className="text-[12px] text-ink font-semibold leading-snug mt-1">{t.descripcion}</p>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </Clay>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PASO 2 — Vigiladores a inspeccionar (múltiples · PRD §2.1)
═══════════════════════════════════════════════════════════ */
function Step2({ rd, setRD, onNext, onBack }) {
  const { vigiladores, apiStatus, apiFetch } = useApp();
  const [legajo, setLegajo] = useState("");
  const [error,  setError]  = useState(null);
  const [busy,   setBusy]   = useState(false);
  const [perfil, setPerfil] = useState(null);
  const [autoCargando, setAutoCargando] = useState(false);
  const [autoCargados, setAutoCargados] = useState(false);
  const sel = rd.vigiladores || [];

  // Trae directo a los vigiladores asignados al objetivo elegido en el Paso 1 (vigiladores.objetivo_asignado_id)
  // para no obligar a tipear cada legajo a mano — el legajo manual queda como refuerzo/reemplazo.
  useEffect(() => {
    if ((rd.vigiladores || []).length > 0 || !rd.objetivo) return;
    const asignados = vigiladores.filter(v => v.objetivo_asignado === rd.objetivo.nombre && v.estado === "activo");
    if (asignados.length === 0) return;

    let cancelado = false;
    (async () => {
      setAutoCargando(true);
      const enriquecidos = await Promise.all(asignados.map(async v => {
        if (apiStatus !== "connected") return v;
        try {
          const res  = await apiFetch(`/api/vigilador/${v.legajo}`);
          const data = await res.json();
          if (data.ok) return { ...data.vigilador, _historial: data.historial, _sanciones: data.sanciones, _incidencias: data.incidencias };
        } catch { /* cae al catálogo local */ }
        return v;
      }));
      if (cancelado) return;
      setRD(p => (p.vigiladores || []).length > 0 ? p : { ...p, vigiladores: enriquecidos });
      setAutoCargados(true);
      setAutoCargando(false);
    })();
    return () => { cancelado = true; };
  }, []);

  const agregar = async () => {
    setError(null);
    const n = legajo.trim();
    if (!n) return;
    if (sel.some(v => String(v.legajo) === n)) { setError("Ese vigilador ya está en la lista."); setLegajo(""); return; }

    setBusy(true);
    let encontrado = vigiladores.find(v => String(v.legajo) === n);

    // Con API conectada trae el perfil completo (sanciones, historial, incidencias)
    if (apiStatus === "connected") {
      try {
        const res  = await apiFetch(`/api/vigilador/${n}`);
        const data = await res.json();
        if (data.ok) encontrado = { ...data.vigilador, _historial: data.historial, _sanciones: data.sanciones, _incidencias: data.incidencias };
      } catch { /* cae al catálogo local */ }
    }
    setBusy(false);

    if (!encontrado) { setError(`No se encontró el legajo ${n}.`); return; }
    setRD(p => ({ ...p, vigiladores: [...(p.vigiladores || []), encontrado] }));
    setLegajo("");
  };

  const quitar = (id) => setRD(p => ({
    ...p,
    vigiladores: (p.vigiladores || []).filter(v => v.id !== id),
    firmas: Object.fromEntries(Object.entries(p.firmas || {}).filter(([k]) => String(k) !== String(id))),
  }));

  const datosPerfil = (v) => ({
    historial:   v._historial   || SEED_HISTORIAL[v.legajo] || [],
    sanciones:   v._sanciones   || SEED_SANCIONES[v.legajo] || [],
    incidencias: v._incidencias || [],
  });

  return (
    <div className="flex flex-col gap-4 px-4 py-4 a-fade">
      <SH title="Vigiladores" sub={autoCargados
        ? `Estos son los vigiladores asignados a ${cortar(rd.objetivo?.nombre || "el objetivo", 26)}. Sumá o quitá si hace falta.`
        : `Cargá el legajo de cada persona a inspeccionar en ${cortar(rd.objetivo?.nombre || "el objetivo", 26)}`} />

      {autoCargando && (
        <div className="bg-brand-50 rounded-[16px] px-4 py-3 flex items-center gap-2 a-up">
          <Icon name="refresh" size={15} className="text-brand-600 a-spin" />
          <p className="text-xs font-bold text-brand-700">Buscando vigiladores asignados a este objetivo…</p>
        </div>
      )}

      <Clay className="p-4">
        <Label className="mb-2">Número de legajo</Label>
        <div className="flex gap-2">
          <div className="clay-inset flex items-center gap-2.5 px-3.5 py-3 flex-1 min-w-0">
            <Icon name="badge" size={17} className="text-ink-faint" />
            <input type="number" inputMode="numeric" value={legajo}
              onChange={e => { setLegajo(e.target.value); setError(null); }}
              onKeyDown={e => e.key === "Enter" && agregar()} placeholder="1024"
              className="flex-1 bg-transparent outline-none text-xl font-black text-ink tnum placeholder:text-ink-faint placeholder:font-semibold min-w-0" />
          </div>
          <Btn onClick={agregar} loading={busy} icon="user-plus" className="px-4">Sumar</Btn>
        </div>
        {error && <p className="text-[11px] text-bad-ink font-bold mt-2 flex items-center gap-1"><Icon name="alert" size={12} />{error}</p>}
        <p className="text-[10px] text-ink-faint mt-2">Podés inspeccionar varios vigiladores en la misma ronda.</p>
      </Clay>

      {sel.length === 0 ? (
        <Empty icon="users" title="Todavía no cargaste vigiladores"
          sub="Ingresá un número de legajo para traer sus datos desde el sistema." />
      ) : (
        <div className="flex flex-col gap-2.5">
          <Label>{sel.length} vigilador{sel.length > 1 ? "es" : ""} en esta ronda</Label>
          {sel.map((v, i) => {
            const dCred = diasHasta(v.credencial_venc);
            const alerta = (dCred != null && dCred <= 30) || v.estado !== "activo";
            return (
              <Clay key={v.id} className="p-3.5 a-up" style={{ animationDelay:`${i * 60}ms` }}>
                <div className="flex items-center gap-3">
                  <Avatar nombre={v.nombre} size={46} src={v.foto_url} tone={alerta ? "warn" : "brand"} />
                  <button onClick={() => setPerfil(v)} className="flex-1 min-w-0 text-left focus-ring rounded-lg">
                    <p className="text-[13px] font-black text-ink leading-tight truncate">{v.nombre}</p>
                    <p className="text-[10px] text-ink-mute mt-0.5 truncate">{v.puesto} · Legajo {v.legajo}</p>
                    <div className="flex gap-1.5 mt-1.5 flex-wrap">
                      <Badge tone={ESTADO_TONE[v.estado] || "gray"}>{v.estado}</Badge>
                      {dCred != null && dCred <= 30 && <Badge tone="bad" icon="alert">Credencial {dCred}d</Badge>}
                      {v.es_chofer && <Badge tone="brand" icon="car">Chofer</Badge>}
                    </div>
                  </button>
                  <div className="flex flex-col gap-1.5 shrink-0">
                    <button onClick={() => setPerfil(v)} aria-label={`Ver perfil de ${v.nombre}`}
                      className="clay-sm clay-press w-9 h-9 rounded-[12px] flex items-center justify-center text-brand-600 focus-ring">
                      <Icon name="eye" size={15} />
                    </button>
                    <button onClick={() => quitar(v.id)} aria-label={`Quitar a ${v.nombre}`}
                      className="clay-sm clay-press w-9 h-9 rounded-[12px] flex items-center justify-center text-bad focus-ring">
                      <Icon name="trash" size={15} />
                    </button>
                  </div>
                </div>
              </Clay>
            );
          })}
        </div>
      )}

      <div className="flex gap-2.5 mt-1">
        <Btn variant="white" icon="arrow-l" onClick={onBack} className="px-4">Atrás</Btn>
        <Btn full size="lg" disabled={sel.length === 0} onClick={onNext} iconRight="arrow-r">
          Continuar al checklist
        </Btn>
      </div>

      <Sheet open={!!perfil} onClose={() => setPerfil(null)} title="Perfil del vigilador" sub="Datos del legajo en el sistema">
        {perfil && <PerfilVigilador v={perfil} {...datosPerfil(perfil)} />}
      </Sheet>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PASO 3 — Checklist Likert por secciones (PRD §3 y §4)
═══════════════════════════════════════════════════════════ */
function ItemChecklist({ def, resp, onEstado, onAbrirObs }) {
  const [criterio, setCriterio] = useState(false);
  const timer = useRef(null);

  // Long-press abre el criterio completo; el botón "i" hace lo mismo de forma accesible
  const press   = () => { timer.current = setTimeout(() => setCriterio(true), 480); };
  const release = () => { clearTimeout(timer.current); };
  useEffect(() => () => clearTimeout(timer.current), []);

  const estado = resp?.estado || null;
  const obs    = [...(resp?.obsPred || []), ...(resp?.obsLibre ? [resp.obsLibre] : [])];

  return (
    <div className="clay overflow-hidden">
      <div className="px-4 pt-3.5 pb-4">
        <div className="flex items-start gap-2 mb-3">
          <p className="flex-1 text-[17px] font-semibold text-ink leading-snug no-select pt-1"
            onMouseDown={press} onMouseUp={release} onMouseLeave={release}
            onTouchStart={press} onTouchEnd={release} onTouchCancel={release}>
            {def.titulo_corto}
          </p>
          <button onClick={() => setCriterio(c => !c)} aria-label="Ver criterio de evaluación"
            aria-expanded={criterio}
            className={cx("shrink-0 w-11 h-11 -mt-1.5 -mr-2 flex items-center justify-center rounded-[10px] focus-ring transition-colors", criterio ? "text-ink" : "text-ink-mute")}>
            <Icon name="info" size={22} strokeWidth={1.8} />
          </button>
        </div>

        {criterio && (
          <div className="bg-page rounded-[10px] px-3.5 py-3 mb-3 a-dn">
            <p className="text-[15px] text-ink leading-relaxed">{def.criterio_completo}</p>
            <p className="text-[14px] text-ink-mute mt-1.5">Área responsable: {def.area_responsable}</p>
          </div>
        )}

        <div className="grid grid-cols-3 gap-2">
          {["B","R","M"].map(k => {
            const v = VALOR[k], on = estado === k;
            const bg = { B:"bg-good", R:"bg-warn", M:"bg-bad" }[k];
            return (
              <button key={k} onClick={() => onEstado(k)}
                aria-pressed={on} aria-label={`${def.titulo_corto}: ${v.label}`}
                className={cx("clay-btn min-h-[52px] rounded-[12px] border flex items-center justify-center gap-1.5",
                  on ? cx(bg, "text-white border-transparent") : "bg-white text-ink border-[#D5DAE6]")}>
                {on && <Icon name={v.icon} size={16} strokeWidth={2.6} />}
                <span className="text-[16px] font-semibold">{v.label}</span>
              </button>
            );
          })}
        </div>
      </div>

      {(estado === "R" || estado === "M") && (
        <button onClick={onAbrirObs}
          className="w-full min-h-[52px] px-4 py-3 border-t border-line text-left fila-toque focus-ring">
          {obs.length === 0 ? (
            <div className="flex items-center gap-2">
              <Icon name="alert" size={14} className={estado === "M" ? "text-bad-ink" : "text-warn-ink"} />
              <span className={cx("text-[11px] font-black", estado === "M" ? "text-bad-ink" : "text-warn-ink")}>
                Registrá la observación
              </span>
              <Icon name="chevron-r" size={14} className="ml-auto text-ink-faint" />
            </div>
          ) : (
            <div>
              <div className="flex items-center gap-1.5 mb-1">
                <Icon name="ticket" size={12} className={estado === "M" ? "text-bad-ink" : "text-warn-ink"} />
                <span className={cx("text-[10px] font-black uppercase tracking-wide", estado === "M" ? "text-bad-ink" : "text-warn-ink")}>
                  Genera ticket
                </span>
                <Icon name="chevron-r" size={13} className="ml-auto text-ink-faint" />
              </div>
              <p className="text-[11px] text-ink-soft font-semibold leading-snug">{obs.join(" · ")}</p>
            </div>
          )}
        </button>
      )}
    </div>
  );
}

function Step3({ rd, setRD, onNext, onBack }) {
  const { checklistDefs, secciones, observaciones, ajustes } = useApp();
  const [abierta, setAbierta] = useState(["seguridad"]);
  const [obsItem, setObsItem] = useState(null);
  const [tmpPred, setTmpPred] = useState([]);
  const [tmpLibre,setTmpLibre]= useState("");

  const respuestas = rd.respuestas || {};

  // Checklist propio del objetivo: plantilla del tipo + sus ajustes (PRD §6)
  const items = useMemo(
    () => resolverChecklist(rd.objetivo, checklistDefs, ajustes),
    [checklistDefs, ajustes, rd.objetivo]
  );

  const porSeccion = useMemo(() => {
    const g = {};
    for (const s of secciones) g[s.clave] = items.filter(i => i.seccion_clave === s.clave).sort((a,b) => a.orden - b.orden);
    return g;
  }, [items, secciones]);

  const total     = items.length;
  const completos = items.filter(i => respuestas[i.id]?.estado).length;
  const pendientes= total - completos;

  // Un ítem R/M sin observación bloquea el avance (PRD §3.1)
  const sinObs = items.filter(i => {
    const r = respuestas[i.id];
    return (r?.estado === "R" || r?.estado === "M") && !(r.obsPred?.length || r.obsLibre?.trim());
  });

  const tickets = items.filter(i => ["R","M"].includes(respuestas[i.id]?.estado));

  const setEstado = (item, estado) => {
    setRD(p => {
      const prev = p.respuestas?.[item.id] || {};
      const next = estado === "B"
        ? { estado:"B", obsPred:[], obsLibre:"" }
        : { ...prev, estado };
      return { ...p, respuestas: { ...(p.respuestas || {}), [item.id]: next } };
    });
    if (estado !== "B") abrirObs(item, estado);
  };

  const abrirObs = (item, estadoForzado) => {
    const r = respuestas[item.id] || {};
    setTmpPred(r.obsPred || []); setTmpLibre(r.obsLibre || "");
    setObsItem({ ...item, _estado: estadoForzado || r.estado });
  };

  const guardarObs = () => {
    setRD(p => ({
      ...p,
      respuestas: {
        ...(p.respuestas || {}),
        [obsItem.id]: { ...(p.respuestas?.[obsItem.id] || {}), obsPred: tmpPred, obsLibre: tmpLibre.trim() },
      },
    }));
    setObsItem(null);
  };

  const toggleSec = (clave) => setAbierta(a => a.includes(clave) ? a.filter(x => x !== clave) : [...a, clave]);

  // Observaciones sugeridas: primero el área del ítem, luego el resto
  const obsAgrupadas = useMemo(() => {
    if (!obsItem) return [];
    const area = obsItem.area_responsable;
    const g = {};
    for (const o of observaciones) (g[o.area] = g[o.area] || []).push(o);
    return Object.entries(g).sort(([a],[b]) => (a === area ? -1 : b === area ? 1 : a.localeCompare(b)));
  }, [obsItem, observaciones]);

  return (
    <div className="flex flex-col gap-3.5 px-4 py-4 a-fade">
      <SH title="Checklist de ronda"
        sub={`${cortar(rd.objetivo?.nombre || "Objetivo", 30)} · ${SUBTIPO_LABEL[rd.objetivo?.subtipo] || ""} · ${total} ítems`} />

      {/* Progreso */}
      <Clay className="p-4">
        <div className="flex items-center justify-between mb-2.5">
          <div>
            <p className="text-[13px] font-black text-ink">{completos} de {total} ítems evaluados</p>
            <p className="text-[10px] text-ink-faint mt-0.5">
              {pendientes > 0 ? `Faltan ${pendientes}` : "Checklist completo"}
              {tickets.length > 0 && ` · ${tickets.length} incidencia${tickets.length > 1 ? "s" : ""}`}
            </p>
          </div>
          <span className="text-2xl font-black text-brand-600 tnum">{total ? Math.round(completos / total * 100) : 0}%</span>
        </div>
        <Bar value={completos} max={total} color="#1F327C" height={8} />
      </Clay>

      {/* Secciones acordeón */}
      {secciones.map(s => {
        const arr = porSeccion[s.clave] || [];
        if (!arr.length) return null;
        const th   = SECCION_THEME[s.color] || SECCION_THEME.azul;
        const done = arr.filter(i => respuestas[i.id]?.estado).length;
        const open = abierta.includes(s.clave);
        const mal  = arr.filter(i => ["R","M"].includes(respuestas[i.id]?.estado)).length;
        return (
          <div key={s.clave}>
            <button onClick={() => toggleSec(s.clave)} aria-expanded={open}
              className="clay w-full flex items-center gap-3 p-3.5 clay-press focus-ring">
              <span className="w-10 h-10 rounded-[14px] flex items-center justify-center shrink-0"
                style={{ background:th.soft, color:th.ink }}>
                <Icon name={{ seguridad:"shield", habilidades:"target", logistica:"layers", rrhh:"users" }[s.clave] || "clipboard"} size={19} />
              </span>
              <div className="flex-1 min-w-0 text-left">
                <p className="text-[13px] font-black text-ink leading-tight">{s.nombre}</p>
                <p className="text-[10px] text-ink-faint mt-0.5 tnum">
                  {done}/{arr.length} evaluados{mal > 0 ? ` · ${mal} con observación` : ""}
                </p>
              </div>
              {done === arr.length
                ? <span className="w-6 h-6 rounded-full bg-good-soft text-good-ink flex items-center justify-center shrink-0"><Icon name="check" size={13} strokeWidth={3} /></span>
                : <span className="text-[10px] font-black tnum px-2 py-1 rounded-full shrink-0" style={{ background:th.soft, color:th.ink }}>{arr.length - done}</span>}
              <Icon name="chevron" size={16} className={cx("text-ink-faint transition-transform shrink-0", open && "rotate-180")} />
            </button>

            {open && (
              <div className="flex flex-col gap-2.5 mt-2.5 pl-1">
                {arr.map((def, i) => (
                  <div key={def.id} className="a-up" style={{ animationDelay:`${i * 45}ms` }}>
                    <ItemChecklist def={def} resp={respuestas[def.id]}
                      onEstado={k => setEstado(def, k)} onAbrirObs={() => abrirObs(def)} />
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}

      {/* Tickets que se van a generar */}
      {tickets.length > 0 && (
        <Clay className="p-4 a-up" tint="#FEF3C7">
          <div className="flex items-center gap-2 mb-2">
            <Icon name="ticket" size={16} className="text-tang-ink" />
            <p className="text-[12px] font-black text-tang-ink">
              {tickets.length} ticket{tickets.length > 1 ? "s" : ""} se generará{tickets.length > 1 ? "n" : ""} al guardar
            </p>
          </div>
          <div className="flex flex-col gap-1">
            {tickets.map(t => {
              const r = respuestas[t.id];
              const area = observaciones.find(o => o.texto === r.obsPred?.[0])?.area || t.area_responsable;
              return (
                <div key={t.id} className="flex items-center gap-2">
                  <Badge tone={r.estado === "M" ? "bad" : "warn"}>{VALOR[r.estado].label}</Badge>
                  <span className="text-[11px] text-ink-soft font-semibold truncate flex-1">{t.titulo_corto}</span>
                  <span className="text-[10px] text-ink-faint font-bold shrink-0">{area}</span>
                </div>
              );
            })}
          </div>
        </Clay>
      )}

      {sinObs.length > 0 && (
        <div className="bg-warn-soft rounded-[16px] px-4 py-3 flex items-start gap-2">
          <Icon name="alert" size={15} className="text-warn-ink mt-px" />
          <p className="text-[11px] font-bold text-warn-ink leading-snug">
            {sinObs.length} ítem{sinObs.length > 1 ? "s" : ""} marcado{sinObs.length > 1 ? "s" : ""} como Regular o Malo
            sin observación. Tocá la fila para completarla.
          </p>
        </div>
      )}

      <div className="flex gap-2.5">
        <Btn variant="white" icon="arrow-l" onClick={onBack} className="px-4">Atrás</Btn>
        <Btn full size="lg" disabled={pendientes > 0 || sinObs.length > 0} onClick={onNext} iconRight="arrow-r">
          {pendientes > 0 ? `Faltan ${pendientes} ítems` : sinObs.length > 0 ? "Completá las observaciones" : "Continuar a evidencia"}
        </Btn>
      </div>

      {/* Hoja de observaciones predefinidas */}
      <Sheet open={!!obsItem} onClose={() => setObsItem(null)}
        title={obsItem?.titulo_corto} sub={`Valoración ${obsItem ? VALOR[obsItem._estado]?.label : ""} · elegí la observación que corresponda`}>
        {obsItem && (
          <div className="flex flex-col gap-4">
            <div className="clay-inset px-3.5 py-3">
              <p className="text-[11px] text-ink-soft leading-relaxed">{obsItem.criterio_completo}</p>
            </div>

            {obsAgrupadas.map(([area, arr]) => (
              <div key={area}>
                <div className="flex items-center gap-2 mb-2">
                  <Badge tone={AREA_THEME[area]?.tone || "gray"}>{area}</Badge>
                  {area === obsItem.area_responsable && <span className="text-[10px] font-bold text-ink-faint">sugerida</span>}
                </div>
                <div className="flex flex-col gap-1.5">
                  {arr.map(o => {
                    const on = tmpPred.includes(o.texto);
                    return (
                      <button key={o.texto}
                        onClick={() => setTmpPred(p => on ? p.filter(x => x !== o.texto) : [...p, o.texto])}
                        className={cx("clay-press flex items-center gap-2.5 px-3.5 py-3 rounded-[15px] text-left transition-all focus-ring",
                          on ? "bg-brand-600 text-white" : "clay-sm text-ink-soft")}>
                        <span className={cx("w-4.5 h-4.5 rounded-md flex items-center justify-center shrink-0 border-2",
                          on ? "bg-white/25 border-white/50" : "border-slate-300")} style={{ width:18, height:18 }}>
                          {on && <Icon name="check" size={11} strokeWidth={3.5} />}
                        </span>
                        <span className="text-[12px] font-semibold leading-snug">{o.texto}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}

            <Textarea label="Otra observación" value={tmpLibre} onChange={e => setTmpLibre(e.target.value)} rows={3}
              placeholder="Describí la situación si no está en el listado…" />

            <div className="flex gap-2.5 pb-1">
              <Btn variant="white" onClick={() => setObsItem(null)} className="px-5">Cancelar</Btn>
              <Btn full size="lg" icon="check" disabled={!tmpPred.length && !tmpLibre.trim()} onClick={guardarObs}>
                Guardar observación
              </Btn>
            </div>
          </div>
        )}
      </Sheet>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PASO 4 — Evidencia fotográfica con marca de agua (PRD §8.5)
═══════════════════════════════════════════════════════════ */
function Step4({ rd, setRD, onNext, onBack, supervisor }) {
  const [cargando, setCargando] = useState(false);
  const [ver, setVer] = useState(null);
  const inputRef = useRef(null);
  const fotos = rd.fotos || [];

  const tomar = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setCargando(true);
    const now = new Date();

    // GPS real al momento de la captura; si no hay señal, cae a la última posición conocida del dispositivo (paso 1)
    let lat = rd.deviceCoords?.lat, lng = rd.deviceCoords?.lng;
    if (navigator.geolocation) {
      try {
        const pos = await new Promise((res, rej) =>
          navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 8000, maximumAge: 4000 }));
        lat = pos.coords.latitude; lng = pos.coords.longitude;
      } catch { /* se mantiene el fallback */ }
    }

    for (const file of files) {
      const dataUrl = await new Promise(res => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.readAsDataURL(file);
      });
      const estampada = await estamparFoto(dataUrl, {
        l1: `${fmtFecha(now)} · ${now.toLocaleTimeString("es-AR")}`,
        l2: lat != null ? `GPS ${lat.toFixed(5)}, ${lng.toFixed(5)}` : "GPS no disponible",
        l3: `${supervisor} · ${rd.objetivo?.nombre || ""}`,
      });
      setRD(p => ({ ...p, fotos: [...(p.fotos || []), { dataUrl: estampada, lat, lng, ts: now.toISOString() }] }));
    }
    setCargando(false);
    e.target.value = "";
  };

  const quitar = (i) => setRD(p => ({ ...p, fotos: (p.fotos || []).filter((_, k) => k !== i) }));

  return (
    <div className="flex flex-col gap-4 px-4 py-4 a-fade">
      <SH title="Evidencia fotográfica" sub="Opcional · cada foto se sella con fecha, hora, GPS y supervisor" />

      <input ref={inputRef} type="file" accept="image/*" capture="environment" multiple onChange={tomar} className="hidden" />

      <button onClick={() => inputRef.current?.click()} disabled={cargando}
        className="clay-btn w-full py-8 rounded-clay2 bg-white flex flex-col items-center gap-2.5 focus-ring">
        <span className="w-16 h-16 rounded-full bg-brand-50 flex items-center justify-center text-brand-600">
          <Icon name={cargando ? "refresh" : "camera"} size={28} className={cargando ? "a-spin" : ""} />
        </span>
        <div className="text-center">
          <p className="text-sm font-black text-ink">{cargando ? "Procesando…" : "Capturar evidencia"}</p>
          <p className="text-[11px] text-ink-faint mt-0.5">Cámara o galería · se puede sumar más de una</p>
        </div>
      </button>

      {fotos.length > 0 && (
        <div>
          <Label className="mb-2">{fotos.length} foto{fotos.length > 1 ? "s" : ""} adjunta{fotos.length > 1 ? "s" : ""}</Label>
          <div className="grid grid-cols-2 gap-2.5">
            {fotos.map((f, i) => (
              <div key={i} className="clay p-1.5 a-pop relative overflow-hidden" style={{ animationDelay:`${i * 60}ms` }}>
                <button onClick={() => setVer(f)} className="block w-full focus-ring rounded-[16px] overflow-hidden">
                  <img src={f.dataUrl} alt={`Evidencia ${i + 1}`} className="w-full h-28 object-cover rounded-[16px]" loading="lazy" />
                </button>
                <button onClick={() => quitar(i)} aria-label="Quitar foto"
                  className="absolute top-3 right-3 w-7 h-7 rounded-full bg-white/95 text-bad flex items-center justify-center shadow-md">
                  <Icon name="x" size={14} strokeWidth={2.6} />
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      <Clay className="p-3.5 flex items-start gap-2.5" tint="#EEF1F8">
        <Icon name="stamp" size={16} className="text-brand-700 mt-px" />
        <p className="text-[11px] text-brand-800 leading-relaxed font-medium">
          La marca de agua se aplica al momento de la captura y no puede modificarse después.
        </p>
      </Clay>

      <div className="flex gap-2.5">
        <Btn variant="white" icon="arrow-l" onClick={onBack} className="px-4">Atrás</Btn>
        <Btn full size="lg" onClick={onNext} iconRight="arrow-r">
          {fotos.length ? "Continuar a firmas" : "Omitir y firmar"}
        </Btn>
      </div>

      <Sheet open={!!ver} onClose={() => setVer(null)} title="Evidencia" sub="Marca de agua no editable">
        {ver && <img src={ver.dataUrl} alt="Evidencia ampliada" className="w-full rounded-[18px]" />}
      </Sheet>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PASO 5 — Firma individual por vigilador (PRD §5.2)
═══════════════════════════════════════════════════════════ */
function CanvasFirma({ onChange, disabled }) {
  const ref     = useRef(null);
  const dibuja  = useRef(false);
  const trazado = useRef(false); // ref, no estado: `stop` corre en el mismo tick que el último `move`
  const ultimo  = useRef(null);
  const [hay, setHay] = useState(false);

  const pos = (e, cv) => {
    const r = cv.getBoundingClientRect();
    const sx = cv.width / r.width, sy = cv.height / r.height;
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * sx, y: (p.clientY - r.top) * sy };
  };

  const start = e => { if (disabled) return; dibuja.current = true; ultimo.current = pos(e, ref.current); };
  const move  = e => {
    if (!dibuja.current || disabled) return;
    e.preventDefault();
    const cv = ref.current, ctx = cv.getContext("2d"), p = pos(e, cv);
    ctx.beginPath();
    ctx.strokeStyle = "#1d4ed8"; ctx.lineWidth = 2.8; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.moveTo(ultimo.current.x, ultimo.current.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ultimo.current = p;
    if (!trazado.current) { trazado.current = true; setHay(true); }
  };
  const stop = () => {
    if (!dibuja.current) return;
    dibuja.current = false;
    if (trazado.current) onChange(ref.current.toDataURL("image/png"));
  };
  const limpiar = () => {
    const cv = ref.current;
    cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
    trazado.current = false; setHay(false); onChange(null);
  };

  useEffect(() => { if (disabled) limpiar(); }, [disabled]);

  return (
    <div>
      <div className={cx("clay-inset overflow-hidden transition-all", disabled && "opacity-40")}>
        <canvas ref={ref} width={340} height={140} className="w-full sig-canvas"
          onMouseDown={start} onMouseMove={move} onMouseUp={stop} onMouseLeave={stop}
          onTouchStart={start} onTouchMove={move} onTouchEnd={stop} />
      </div>
      <div className="flex items-center justify-between mt-2">
        <p className="text-[10px] text-ink-faint font-medium">
          {disabled ? "Negativa registrada" : hay ? "Firma capturada" : "Firmá con el dedo o el cursor"}
        </p>
        {hay && !disabled && (
          <button onClick={limpiar} className="text-[10px] font-black text-brand-600 flex items-center gap-1 focus-ring rounded px-1">
            <Icon name="refresh" size={12} /> Rehacer
          </button>
        )}
      </div>
    </div>
  );
}

function Step5({ rd, setRD, onGuardar, onBack, guardando }) {
  const { offline, apiStatus } = useApp();
  const vigs   = rd.vigiladores || [];
  const firmas = rd.firmas || {};
  const [activo, setActivo] = useState(vigs[0]?.id);

  const setFirma = (id, dataUrl) => setRD(p => ({
    ...p, firmas: { ...(p.firmas || {}), [id]: { ...(p.firmas?.[id] || {}), dataUrl } },
  }));
  const setNego = (id) => setRD(p => {
    const prev = p.firmas?.[id] || {};
    return { ...p, firmas: { ...(p.firmas || {}), [id]: { dataUrl: prev.nego ? prev.dataUrl : null, nego: !prev.nego } } };
  });

  const firmados = vigs.filter(v => firmas[v.id]?.dataUrl || firmas[v.id]?.nego).length;
  const puede    = firmados > 0 && firmados === vigs.length;
  const negativas= vigs.filter(v => firmas[v.id]?.nego);

  const items = Object.entries(rd.respuestas || {});
  const inc   = items.filter(([, r]) => r.estado === "R" || r.estado === "M").length;

  return (
    <div className="flex flex-col gap-4 px-4 py-4 a-fade">
      <SH title="Firma y cierre" sub="Cada vigilador inspeccionado debe firmar el acta" />

      {/* Resumen del acta */}
      <Clay className="p-4">
        <Label className="mb-2.5">Resumen de la ronda</Label>
        <Row k="Objetivo"    v={rd.objetivo?.nombre || "—"} />
        <Row k="Modalidad"   v={rd.tipo === "remota" ? "Remota" : "Presencial"} tone={rd.tipo === "remota" ? "warn" : "good"} />
        <Row k="Geocerca"    v={rd.gpsStatus === "inside" ? "Dentro" : "Fuera"} tone={rd.gpsStatus === "inside" ? "good" : "bad"} />
        <Row k="Vigiladores" v={vigs.length} />
        <Row k="Ítems evaluados" v={items.length} />
        <Row k="Incidencias" v={inc} tone={inc > 0 ? "bad" : "good"} />
        <Row k="Evidencia"   v={`${(rd.fotos || []).length} fotos`} last />
      </Clay>

      {/* Progreso de firmas */}
      <Clay className="p-3.5">
        <div className="flex items-center justify-between mb-2">
          <p className="text-[12px] font-black text-ink">{firmados} de {vigs.length} firmas registradas</p>
          {puede && <Badge tone="good" icon="check">Completo</Badge>}
        </div>
        <Bar value={firmados} max={vigs.length} color="#1F327C" height={8} />
      </Clay>

      {/* Selector de vigilador */}
      {vigs.length > 1 && (
        <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
          {vigs.map(v => {
            const f = firmas[v.id];
            const ok = f?.dataUrl || f?.nego;
            return (
              <button key={v.id} onClick={() => setActivo(v.id)}
                className={cx("clay-btn shrink-0 px-3.5 py-2.5 rounded-[15px] flex items-center gap-2 text-[11px] font-black transition-all",
                  activo === v.id ? "bg-brand-600 text-white" : "bg-white text-ink-mute")}>
                {ok && <Icon name={f.nego ? "x-circle" : "check-circle"} size={13} />}
                {cortar(v.nombre.split(" ")[0] + " " + (v.nombre.split(" ").slice(-1)[0] || ""), 16)}
              </button>
            );
          })}
        </div>
      )}

      {/* Panel de firma del vigilador activo */}
      {vigs.filter(v => v.id === activo).map(v => {
        const f = firmas[v.id] || {};
        return (
          <Clay key={v.id} className="p-4 a-fade">
            <div className="flex items-center gap-3 mb-3.5">
              <Avatar nombre={v.nombre} size={44} src={v.foto_url} />
              <div className="min-w-0">
                <p className="text-[13px] font-black text-ink leading-tight truncate">{v.nombre}</p>
                <p className="text-[10px] text-ink-mute">Legajo {v.legajo} · DNI {v.dni || "—"}</p>
              </div>
            </div>

            {f.nego ? (
              <div className="clay-inset py-9 flex flex-col items-center gap-2">
                <Icon name="x-circle" size={30} className="text-bad" />
                <p className="text-[12px] font-black text-bad-ink">Negativa a firmar registrada</p>
              </div>
            ) : (
              <CanvasFirma onChange={d => setFirma(v.id, d)} disabled={false} />
            )}

            <button onClick={() => setNego(v.id)}
              className={cx("clay-btn w-full mt-3 py-3 rounded-[15px] text-[11px] font-black flex items-center justify-center gap-2",
                f.nego ? "bg-bad text-white" : "bg-white text-bad")}>
              <Icon name={f.nego ? "refresh" : "x-circle"} size={15} />
              {f.nego ? "Deshacer negativa" : "Registrar negativa a firmar"}
            </button>
          </Clay>
        );
      })}

      {negativas.length > 0 && (
        <div className="bg-bad-soft rounded-[16px] px-4 py-3 flex items-start gap-2 a-up">
          <Icon name="alert" size={15} className="text-bad-ink mt-px" />
          <p className="text-[11px] font-bold text-bad-ink leading-snug">
            {negativas.length} negativa{negativas.length > 1 ? "s" : ""} a firmar · se generará un ticket a RRHH por cada una.
          </p>
        </div>
      )}

      {offline && (
        <div className="bg-warn-soft rounded-[16px] px-4 py-3 flex items-start gap-2">
          <Icon name="cloud-off" size={15} className="text-warn-ink mt-px" />
          <p className="text-[11px] font-bold text-warn-ink leading-snug">
            Sin conexión: el acta se guarda en el dispositivo y se sincroniza automáticamente al recuperar señal.
          </p>
        </div>
      )}

      <div className="flex gap-2.5">
        <Btn variant="white" icon="arrow-l" onClick={onBack} className="px-4">Atrás</Btn>
        <Btn full size="xl" variant={offline ? "warn" : "success"} icon={offline ? "cloud-off" : "save"}
          disabled={!puede} loading={guardando} onClick={onGuardar}>
          {guardando ? "Guardando…" : !puede ? `Faltan ${vigs.length - firmados} firmas` : offline ? "Guardar en cola" : "Guardar acta"}
        </Btn>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PASO 6 — Acta de supervisión generada (PRD §5.1)
═══════════════════════════════════════════════════════════ */
function ActaGenerada({ rd, resultado, supervisor, onNueva }) {
  const { checklistDefs } = useApp();
  const { acta, estado, servidor, aviso } = resultado;
  const encolada = estado === "encolada";
  const fin = acta.generadaEn || new Date();

  const respuestas = Object.entries(rd.respuestas || {}).map(([id, r]) => ({

                : "Sellada digitalmente. Los paneles se actualizaron al instante."}

            <p className="text-[10px] text-ink-faint mt-1 font-mono">

          <div className="h-px bg-slate-100" />

                <div key={i} className={cx("flex items-center gap-2 py-2", i < respuestas.length - 1 && "border-b border-slate-100")}>
                  <span className={cx("w-5 h-5 rounded-md flex items-center justify-center shrink-0 text-white",
                    r.estado === "B" ? "bg-good" : r.estado === "R" ? "bg-warn" : "bg-bad")}>
                    <Icon name={VALOR[r.estado].icon} size={11} strokeWidth={3} />
                  </span>
                  <span className="text-[11px] text-ink-soft font-semibold flex-1 leading-snug">{def.titulo_corto}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Observaciones e incidencias */}
          {conObs.length > 0 && (
            <>
              <div className="h-px bg-slate-100" />
              <div>
                <Label className="mb-2">Observaciones e incidencias</Label>
                <div className="flex flex-col gap-2">
                  {conObs.map(({ def, r }, i) => {
                    const tk = acta.tickets.find(t => t.item === def.titulo_corto);
                    return (
                      <div key={i} className={cx("rounded-[14px] p-3", r.estado === "M" ? "bg-bad-soft" : "bg-warn-soft")}>
                        <div className="flex items-center gap-2 mb-1">
                          <Badge tone={r.estado === "M" ? "bad" : "warn"}>{VALOR[r.estado].label}</Badge>
                          {tk && <span className="text-[10px] font-mono font-black text-ink-mute">{tk.id}</span>}
                        </div>
                        <p className="text-[11px] font-black text-ink">{def.titulo_corto}</p>
                        <p className="text-[11px] text-ink-soft mt-0.5 leading-snug">

                        </p>
                        {tk && <p className="text-[10px] text-ink-faint mt-1 font-bold">Área responsable: {tk.area}</p>}
                      </div>
                    );
                  })}
                </div>
              </div>
            </>
          )}

          {/* Evidencia */}
          {(rd.fotos || []).length > 0 && (
            <>
              <div className="h-px bg-slate-100" />
              <div>
                <Label className="mb-2">Evidencia fotográfica</Label>
                <div className="grid grid-cols-3 gap-2">
                  {rd.fotos.map((f, i) => (
                    <img key={i} src={f.dataUrl} alt={`Evidencia ${i + 1}`} className="w-full h-20 object-cover rounded-[12px]" loading="lazy" />
                  ))}
                </div>
              </div>
            </>
          )}

          {/* Sello */}
          <div className="clay-inset px-3.5 py-3 stripe-bg">
            <div className="flex items-start gap-2">
              <Icon name="stamp" size={16} className="text-brand-700 mt-px" />
              <div>
                <p className="text-[10px] font-black text-brand-800 uppercase tracking-wide">Sello digital · no modificable</p>
                <p className="text-[10px] text-ink-mute mt-1 font-mono leading-relaxed">
                  {fmtFecha(fin)} {fin.toLocaleTimeString("es-AR")}<br />
                  {rd.deviceCoords?.lat != null ? `GPS ${rd.deviceCoords.lat.toFixed(5)}, ${rd.deviceCoords.lng.toFixed(5)}` : "GPS no disponible"}<br />
                  {supervisor}
                </p>
              </div>
            </div>
          </div>
        </div>
      </Clay>

      {/* Tickets emitidos */}
      {acta.tickets.length > 0 && (
        <Clay className="p-4">
          <div className="flex items-center gap-2 mb-2.5">
            <Icon name="send" size={16} className="text-brand-600" />
            <p className="text-[12px] font-black text-ink">
              {acta.tickets.length} ticket{acta.tickets.length > 1 ? "s" : ""} {encolada ? "pendiente de envío" : "enviado a las áreas"}
            </p>
          </div>
          <div className="flex flex-col gap-2">
            {acta.tickets.map(t => (
              <div key={t.id} className="clay-inset px-3 py-2.5 flex items-center gap-2">

                <span className="text-[11px] text-ink-soft font-semibold truncate flex-1">{t.item}</span>

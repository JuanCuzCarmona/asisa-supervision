}

/* ═══════════════════════════════════════════════════════════
   PANEL SUPERVISOR — wizard de 5 pasos + acta
═══════════════════════════════════════════════════════════ */
const PASOS = ["Inicio", "Vigiladores", "Checklist", "Evidencia", "Firmas"];

function SupervisorPanel() {
  const { currentUser, guardarRonda } = useApp();
  const [paso, setPaso] = useState(0);
  const [rd,   setRD]   = useState({});
  const [res,  setRes]  = useState(null);
  const [busy, setBusy] = useState(false);
  const scrollRef = useRef(null);
  const guardandoRef = useRef(false); // guard sincrónico: setBusy/disabled tardan un render en aplicarse

  const supervisor = currentUser?.nombre || "Supervisor";

  const ir = (n) => { setPaso(n); scrollRef.current?.scrollTo({ top:0, behavior:"smooth" }); };
  const reiniciar = () => { setRD({}); setRes(null); ir(0); };

  const guardar = async () => {
    if (guardandoRef.current) return;
    guardandoRef.current = true;
    setBusy(true);
    try {
      const r = await guardarRonda(rd, supervisor);
      setRes(r);
    } finally {
      setBusy(false);
      guardandoRef.current = false;
      scrollRef.current?.scrollTo({ top:0, behavior:"smooth" });
    }
  };

  const pantallas = [
    <Step1 rd={rd} setRD={setRD} onNext={() => ir(1)} />,
    <Step2 rd={rd} setRD={setRD} onNext={() => ir(2)} onBack={() => ir(0)} />,
    <Step3 rd={rd} setRD={setRD} onNext={() => ir(3)} onBack={() => ir(1)} />,
    <Step4 rd={rd} setRD={setRD} onNext={() => ir(4)} onBack={() => ir(2)} supervisor={supervisor} />,
    <Step5 rd={rd} setRD={setRD} onGuardar={guardar} onBack={() => ir(3)} guardando={busy} />,
  ];

  return (
    <div className="flex flex-col h-full">
      <PanelHeader rol="Supervisión de campo" nombre={supervisor} />
      <ConnBar />
      <SyncToast />
      {!res && <Stepper steps={PASOS} current={paso} />}
      <div ref={scrollRef} className="scroll-y flex-1">
        {res
          ? <ActaGenerada rd={rd} resultado={res} supervisor={supervisor} onNueva={reiniciar} />
          : pantallas[paso]}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PANEL ADMINISTRATIVO — gestión de incidencias
═══════════════════════════════════════════════════════════ */
function AdminPanel() {
  const { ticketsActivos, cerrarTicket, apiStatus, apiFetch, currentUser } = useApp();
  const [apiTickets, setApiTickets] = useState(null);
  const [cargando,   setCargando]   = useState(false);
  const [filtro,     setFiltro]     = useState("activo");
  const [area,       setArea]       = useState("todas");
  const [sel,        setSel]        = useState(null);
  const [resol,      setResol]      = useState("");
  const [cerrando,   setCerrando]   = useState(false);

  const conApi  = apiStatus === "connected" && apiTickets !== null;
  const tickets = conApi ? apiTickets : ticketsActivos;

  useEffect(() => {
    if (apiStatus !== "connected") { setApiTickets(null); return; }
    setCargando(true);
    apiFetch("/api/tickets?limite=100").then(r => r.json()).then(d => {
      if (!d.ok) return;
      setApiTickets(d.tickets.map(t => ({
        id: t.codigo_ticket, _dbId: t.id, obj: t.objetivo, sup: t.supervisor,
        val: t.valoracion || "R", area: t.area_responsable, item: t.item_titulo,
        vig: t.vigilador, estado: t.estado === "ABIERTO" ? "Activo" : "Cerrado",
        desc: t.descripcion, resolucion: t.resolucion,
        fecha: new Date(t.fecha_creacion).toLocaleString("es-AR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }),
        isNew: false,
      })));
    }).catch(e => console.warn("[tickets]", e.message)).finally(() => setCargando(false));
  }, [apiStatus]);

  const stats = {
    crit: tickets.filter(t => t.val === "M" && t.estado === "Activo").length,
    act:  tickets.filter(t => t.estado === "Activo").length,
    cer:  tickets.filter(t => t.estado === "Cerrado").length,
  };

  const areas = useMemo(() => {
    const s = {};
    for (const t of tickets) if (t.estado === "Activo") s[t.area] = (s[t.area] || 0) + 1;
    return s;
  }, [tickets]);

  const lista = tickets.filter(t =>
    (filtro === "todas" || (filtro === "activo" ? t.estado === "Activo" : t.estado === "Cerrado")) &&
    (area === "todas" || t.area === area)
  );

  const actual = sel ? tickets.find(t => t.id === sel.id) || sel : null;

  const confirmarCierre = async () => {
    setCerrando(true);
    if (conApi && actual?._dbId) {
      try { await apiFetch(`/api/tickets/${actual._dbId}/resolver`, { method:"PATCH", body: JSON.stringify({ resolucion: resol }) }); }
      catch (e) { console.warn("[cerrar]", e.message); }
      setApiTickets(ts => ts.map(t => t.id === actual.id ? { ...t, estado:"Cerrado", resolucion: resol } : t));
    } else {
      cerrarTicket(actual.id, resol);
    }
    setCerrando(false); setSel(null); setResol("");
  };

  return (
    <div className="flex flex-col h-full">
      <PanelHeader rol="Gestión de incidencias" nombre={currentUser?.nombre || "Administración"} />
      <ConnBar />
      <SyncToast />

      {/* Contadores */}
      <div className="flex gap-2 md:gap-3 px-4 md:px-6 pb-2.5 md:pb-4 shrink-0">
        {[["Críticas", stats.crit, "bad"], ["Activas", stats.act, "warn"], ["Cerradas", stats.cer, "good"]].map(([l, v, tone]) => (
          <Clay key={l} className="flex-1 p-3 md:p-5 text-center">
            <p className={cx("text-2xl md:text-3xl font-black tnum leading-none",
              tone === "bad" ? "text-bad" : tone === "warn" ? "text-warn" : "text-good")}>{v}</p>
            <p className="text-[10px] md:text-xs font-bold text-ink-mute mt-1">{l}</p>
          </Clay>
        ))}
      </div>

      {/* En mobile el segmentado y el filtro por área van apilados; en
          tablet/desktop pasan a la misma fila (side-by-side). */}
      <div className="md:flex md:items-center md:gap-4 md:px-6 shrink-0">
        <div className="px-4 md:px-0 pb-2 md:pb-2.5 shrink-0 md:w-72">
          <Segmented tone="plum" value={filtro} onChange={setFiltro}
            options={[["activo","Activas",stats.act],["cerrado","Cerradas",stats.cer],["todas","Todas",tickets.length]]} />
        </div>

        {/* Filtro por área */}
        {Object.keys(areas).length > 0 && (
          <div className="flex gap-2 overflow-x-auto px-4 md:px-0 pb-2.5 shrink-0 md:flex-1">
            <button onClick={() => setArea("todas")}
              className={cx("clay-btn shrink-0 px-3 py-2 rounded-full text-[10px] font-black",
                area === "todas" ? "bg-plum text-white" : "bg-white text-ink-mute")}>Todas</button>
            {Object.entries(areas).map(([a, n]) => (
              <button key={a} onClick={() => setArea(a)}
                className={cx("clay-btn shrink-0 px-3 py-2 rounded-full text-[10px] font-black whitespace-nowrap",
                  area === a ? "bg-plum text-white" : "bg-white text-ink-mute")}>
                {a} <span className="tnum opacity-70">{n}</span>
              </button>
            ))}
          </div>
        )}
      </div>

      {/* Lista de tickets: una columna en el teléfono, grilla tipo tabla
          de 2 columnas en tablet y 3 en desktop — más incidencias visibles
          de un vistazo sin dejar de ser tarjetas Clay. */}
      <div className="scroll-y flex-1 px-4 md:px-6 pb-5 flex flex-col gap-2.5 md:grid md:grid-cols-2 md:items-start md:gap-3 lg:grid-cols-3">
        {cargando && [0,1,2].map(i => <Skeleton key={i} h={112} />)}

        {!cargando && lista.length === 0 && (
          <div className="md:col-span-full">
            <Empty icon="check-circle" title="Sin incidencias acá" sub="No hay tickets que coincidan con este filtro." />
          </div>
        )}

        {!cargando && lista.map((t, i) => (
          <button key={t.id} onClick={() => { setSel(t); setResol(""); }}
            className="clay clay-press w-full text-left p-4 md:p-5 a-up focus-ring" style={{ animationDelay:`${i * 45}ms` }}>
            <div className="flex items-center justify-between gap-2 mb-2">
              <div className="flex items-center gap-2 min-w-0">
                <span className="text-[10px] font-mono font-black text-ink-mute">{t.id}</span>
                {t.isNew && <Badge tone="brand">Nuevo</Badge>}
              </div>
              <Badge tone={t.estado === "Activo" ? (t.val === "M" ? "bad" : "warn") : "gray"}>
                {t.estado}
              </Badge>
            </div>
            <p className="text-[13px] font-black text-ink leading-tight">{t.obj}</p>
            <p className="text-[11px] text-ink-mute mt-1 leading-snug">{t.desc}</p>
            {t.item && (
              <div className="flex items-center gap-1.5 mt-2">
                <Icon name="clipboard" size={12} className="text-ink-faint" />
                <span className="text-[10px] text-ink-faint font-semibold">{t.item}</span>
                <Badge tone={t.val === "M" ? "bad" : "warn"} className="ml-auto">{VALOR[t.val]?.label || t.val}</Badge>
              </div>
            )}
            <div className="flex items-center gap-1.5 mt-2.5 flex-wrap">
              <Badge tone={AREA_THEME[t.area]?.tone || "gray"}>{t.area}</Badge>
              <span className="text-[10px] text-ink-faint ml-auto">{t.sup} · {t.fecha}</span>
            </div>
          </button>
        ))}
      </div>

      {/* Detalle y resolución */}
      <Sheet open={!!sel} onClose={() => setSel(null)} title={actual?.obj} sub={actual?.id}>
        {actual && (
          <div className="flex flex-col gap-3.5">
            <div className="flex gap-1.5 flex-wrap">
              <Badge tone={AREA_THEME[actual.area]?.tone || "gray"}>{actual.area}</Badge>
              <Badge tone={actual.val === "M" ? "bad" : "warn"}>{VALOR[actual.val]?.label || actual.val}</Badge>
              <Badge tone={actual.estado === "Activo" ? "warn" : "good"}>{actual.estado}</Badge>
            </div>

            <Clay className="p-4">
              <Label className="mb-1.5">Descripción</Label>
              <p className="text-[13px] text-ink-soft leading-relaxed">{actual.desc}</p>
            </Clay>

            <Clay className="p-4">
              {actual.item && <Row k="Ítem del checklist" v={actual.item} />}
              {actual.vig  && <Row k="Vigilador" v={actual.vig} />}
              <Row k="Supervisor" v={actual.sup} />
              <Row k="Registrado" v={actual.fecha} last />
            </Clay>

            {actual.estado === "Activo" ? (
              <>
                <Textarea label="Resolución técnica" value={resol} onChange={e => setResol(e.target.value)} rows={4}
                  placeholder="Describí la acción concreta que resolvió esta incidencia…"
                  hint={<p className="text-[10px] text-ink-faint mt-1.5">Mínimo 5 caracteres.</p>} />
                <Btn full size="lg" variant="success" icon="check-circle" loading={cerrando}
                  disabled={resol.trim().length < 5} onClick={confirmarCierre}>
                  Cerrar incidencia
                </Btn>
              </>
            ) : (
              <div className="bg-good-soft rounded-[16px] px-4 py-3.5">
                <div className="flex items-center gap-2 mb-1">
                  <Icon name="check-circle" size={16} className="text-good-ink" />
                  <p className="text-[12px] font-black text-good-ink">Incidencia resuelta</p>
                </div>
                {actual.resolucion && <p className="text-[11px] text-good-ink/80 leading-relaxed mt-1">{actual.resolucion}</p>}
              </div>
            )}
          </div>
        )}
      </Sheet>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PANEL DUEÑO — dashboard ejecutivo
═══════════════════════════════════════════════════════════ */
function OwnerPanel() {
  const { kpis: kpisLocal, liveFeed, apiStatus, apiFetch, currentUser, objetivos } = useApp();
  const [apiKpis, setApiKpis] = useState(null);
  const [apiFeed, setApiFeed] = useState(null);
  const [tab, setTab] = useState("tipo");

  useEffect(() => {
    if (apiStatus !== "connected") { setApiKpis(null); setApiFeed(null); return; }
    apiFetch("/api/kpis").then(r => r.json()).then(d => {
      if (!d.ok) return;
      const k = d.kpis;
      const porObjetivo = (k.cumplimiento_objetivos || []).map(o => ({
        ...o, realizadas: o.rondas_realizadas, visitas_meta_mes: o.visitas_meta_mes,
      }));
      const porTipo = {};
      for (const o of porObjetivo) {
        porTipo[o.tipo] = porTipo[o.tipo] || { completadas:0, total:0 };
        porTipo[o.tipo].completadas += o.realizadas;
        porTipo[o.tipo].total       += o.visitas_meta_mes || 0;
      }
      setApiKpis({
        visitas:     porObjetivo.reduce((a, o) => a + o.realizadas, 0),
        metaVisitas: porObjetivo.reduce((a, o) => a + (o.visitas_meta_mes || 0), 0) || 1,
        criticas:    k.tickets.criticos, activas: k.tickets.abiertos, cerradas: k.tickets.cerrados,
        porArea:     k.tickets.por_area, diasProm: k.tickets.dias_promedio_resolucion,
        rondas:      k.rondas, porTipo, porObjetivo,
      });
    }).catch(e => console.warn("[kpis]", e.message));

    apiFetch("/api/actividad?limite=8").then(r => r.json()).then(d => {
      if (!d.ok) return;
      setApiFeed(d.actividad.map(a => ({
        hora: fmtHora(a.fecha_hora),
        sup:  a.supervisor.split(" ")[0][0] + ". " + a.supervisor.split(" ").slice(-1)[0],
        obj:  cortar(a.objetivo, 20),
        tipo: a.tipo === "remota" ? "Remota" : "Presencial",
        ok:   a.tickets === 0, isNew: false,
      })));
    }).catch(() => {});
  }, [apiStatus]);

  const k    = apiKpis || kpisLocal;
  const feed = apiFeed || liveFeed;
  const pct  = Math.round(k.visitas / k.metaVisitas * 100);

  const TIPO_COLOR = { Barrios:"#1F327C", Industrias:"#1F327C", Locales:"#1F327C" };

  return (
    <div className="flex flex-col h-full">
      <PanelHeader rol="Dashboard ejecutivo" nombre={currentUser?.nombre || "Gerencia"} />
      <ConnBar />
      <SyncToast />

      <div className="scroll-y flex-1 px-4 md:px-6 pb-5 flex flex-col gap-3.5">
        <div className="flex items-center justify-between">
          <div>
            <h2 className="text-[28px] md:text-[32px] font-semibold text-ink leading-[1.1] tracking-[-0.01em] first-letter:uppercase">
              {new Date().toLocaleDateString("es-AR", { month:"long", year:"numeric" })}
            </h2>
            <p className="text-[11px] text-ink-mute">Ciclo mensual de cumplimiento</p>
          </div>
          <div className="clay flex items-center gap-1.5 px-3 py-1.5">
            <Dot tone="bad" pulse />
            <span className="text-[10px] font-black text-ink-mute uppercase tracking-wide">En vivo</span>
          </div>
        </div>

        {/* En el teléfono, todo baja en una sola columna en este mismo
            orden. En tablet/desktop se reparte en dos columnas lado a
            lado: cobertura/incidencias/tiempo de resolución a la
            izquierda, cumplimiento/áreas/actividad a la derecha. */}
        <div className="flex flex-col gap-3.5 md:grid md:grid-cols-2 md:gap-4 md:items-start">
          <div className="flex flex-col gap-3.5">
            {/* Cobertura de visitas */}
            <Clay className="p-4 md:p-5">
              <Label className="mb-3">Cobertura de visitas mensuales</Label>
              <div className="flex items-center gap-4">
                <Ring value={k.visitas} max={k.metaVisitas} color="#1F327C" size={118} label={`${k.visitas} de ${k.metaVisitas}`} />
                <div className="flex-1 min-w-0">
                  <p className="text-[42px] font-black text-ink tnum leading-none">{pct}<span className="text-xl text-brand-500">%</span></p>
                  <p className="text-xs text-ink-mute mt-1 leading-snug">{k.visitas} visitas realizadas<br />sobre {k.metaVisitas} planificadas</p>
                  {k.rondas && (
                    <div className="flex gap-1.5 mt-2.5">
                      <Badge tone="good">{k.rondas.presenciales} presenciales</Badge>
                      <Badge tone="warn">{k.rondas.remotas} remotas</Badge>
                    </div>
                  )}
                </div>
              </div>
            </Clay>

            {/* Incidencias */}
            <div className="flex gap-2.5">
              <Clay className="flex-1 p-4" tint={k.criticas > 0 ? "#FFF1F2" : "#ECFDF5"}>
                <Label className={k.criticas > 0 ? "text-bad-ink" : "text-good-ink"}>Críticas</Label>
                <p className={cx("text-[40px] font-black tnum leading-none mt-1", k.criticas > 0 ? "text-bad" : "text-good")}>{k.criticas}</p>
                <p className={cx("text-[10px] font-bold mt-1", k.criticas > 0 ? "text-bad-ink" : "text-good-ink")}>
                  {k.criticas > 0 ? "requieren atención" : "todo en orden"}
                </p>
              </Clay>
              <div className="flex-1 flex flex-col gap-2.5">
                <Clay className="p-3.5">
                  <p className="text-2xl font-black text-warn tnum leading-none">{k.activas}</p>
                  <p className="text-[10px] font-bold text-ink-mute mt-1">Tickets activos</p>
                </Clay>
                <Clay className="p-3.5">
                  <p className="text-2xl font-black text-good tnum leading-none">{k.cerradas}</p>
                  <p className="text-[10px] font-bold text-ink-mute mt-1">Resueltos</p>
                </Clay>
              </div>
            </div>

            {k.diasProm > 0 && (
              <Clay className="p-3.5 flex items-center gap-3">
                <span className="w-10 h-10 rounded-[14px] bg-brand-50 text-brand-600 flex items-center justify-center shrink-0">
                  <Icon name="clock" size={19} />
                </span>
                <div>
                  <p className="text-[13px] font-black text-ink tnum">{k.diasProm} días</p>
                  <p className="text-[10px] text-ink-mute">Tiempo promedio de resolución</p>
                </div>
              </Clay>
            )}
          </div>

          <div className="flex flex-col gap-3.5">
            {/* Cumplimiento */}
            <Clay className="p-4 md:p-5">
              <div className="flex items-center justify-between mb-3">
                <Label>Cumplimiento</Label>
                <div className="clay-inset flex gap-1 p-1">
                  {[["tipo","Por tipo"],["obj","Por objetivo"]].map(([kk, l]) => (
                    <button key={kk} onClick={() => setTab(kk)}
                      className={cx("px-2.5 py-1 rounded-[10px] text-[10px] font-black transition-all",
                        tab === kk ? "bg-brand-600 text-white" : "text-ink-mute")}>{l}</button>
                  ))}
                </div>
              </div>

              {tab === "tipo" ? (
                <div className="flex flex-col gap-3.5">
                  {Object.entries(k.porTipo || {}).map(([tipo, d]) => {
                    const p = d.total ? Math.round(d.completadas / d.total * 100) : 0;
                    return (
                      <div key={tipo}>
                        <div className="flex justify-between items-center mb-1.5">
                          <span className="text-[12px] font-bold text-ink-soft">{tipo}</span>
                          <span className="text-[11px] text-ink-mute tnum">
                            {d.completadas}/{d.total} · <span className="font-black text-ink">{p}%</span>
                          </span>
                        </div>
                        <Bar value={d.completadas} max={d.total || 1} color={TIPO_COLOR[tipo] || "#1F327C"} height={8} />
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div className="flex flex-col gap-3">
                  {(k.porObjetivo || []).map(o => {
                    const meta = o.visitas_meta_mes || 0;
                    const p = meta ? Math.round(o.realizadas / meta * 100) : 0;
                    return (
                      <div key={o.id}>
                        <div className="flex justify-between items-center gap-2 mb-1.5">
                          <span className="text-[11px] font-bold text-ink-soft truncate flex-1">{o.nombre}</span>
                          <span className="text-[10px] text-ink-mute tnum shrink-0">{o.realizadas}/{meta}</span>
                        </div>
                        <Bar value={o.realizadas} max={meta || 1} color={p >= 100 ? "#047857" : "#1F327C"} height={8} />
                      </div>
                    );
                  })}
                </div>
              )}
            </Clay>

            {/* Tickets por área */}
            {k.porArea?.length > 0 && (
              <Clay className="p-4">
                <Label className="mb-3">Tickets abiertos por área</Label>
                <div className="flex flex-col gap-2">
                  {k.porArea.map(a => (
                    <div key={a.area_responsable} className="flex items-center gap-2.5">
                      <Badge tone={AREA_THEME[a.area_responsable]?.tone || "gray"}>{a.area_responsable}</Badge>
                      <div className="flex-1"><Bar value={parseInt(a.cantidad)} max={Math.max(...k.porArea.map(x => parseInt(x.cantidad)))} color="#1F327C" height={8} /></div>
                      <span className="text-[11px] font-black text-ink tnum w-4 text-right">{a.cantidad}</span>
                    </div>
                  ))}
                </div>
              </Clay>
            )}

            {/* Feed en vivo */}
            <Clay className="p-4">
              <div className="flex items-center justify-between mb-3">
                <Label>Actividad en tiempo real</Label>
                <div className="flex items-center gap-1.5"><Dot tone="good" pulse /><span className="text-[10px] font-black text-good-ink">Live</span></div>
              </div>
              {feed.length === 0
                ? <Empty icon="activity" title="Sin actividad" sub="Las rondas aparecerán acá al guardarse." />
                : feed.map((a, i) => (
                  <div key={i} className={cx("flex items-center gap-2.5 py-2.5", i < feed.length - 1 && "border-b border-slate-100")}>
                    <span className="text-[10px] text-ink-faint w-[74px] shrink-0 tnum whitespace-nowrap">{a.hora}</span>
                    <Dot tone={a.tipo === "Presencial" ? "good" : "warn"} />
                    <div className="flex-1 min-w-0">
                      <p className="text-[11px] font-bold text-ink truncate">
                        {a.isNew && <span className="text-brand-600">● </span>}{a.sup} → {a.obj}
                      </p>
                      <p className="text-[10px] text-ink-faint">{a.isNew ? "Recién · " : ""}{a.tipo}{!a.ok ? " · con incidencia" : ""}</p>
                    </div>
                    <Icon name={a.ok ? "check-circle" : "alert"} size={15} className={a.ok ? "text-good" : "text-warn"} />
                  </div>
                ))}
            </Clay>
          </div>
        </div>

        <p className="text-center text-[10px] text-ink-faint pb-1">ASI · Sistema de Supervisión v3.0</p>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   MARCO DE TELÉFONO
═══════════════════════════════════════════════════════════ */
const isNativeApp = typeof window !== "undefined" &&
  !!window.Capacitor && (window.Capacitor.isNativePlatform ? window.Capacitor.isNativePlatform() : true);

/* En un celular real (navegador o "Agregar a inicio" en iPhone) el marco de teléfono
   falso sobra: la app ocupa la pantalla entera y respeta la isla dinámica y la barra
   de inicio con env(safe-area-inset-*). La barra de servidor solo aparece con ?servidor. */
const esCelularWeb = typeof window !== "undefined" && !isNativeApp &&
  (window.matchMedia("(max-width: 600px) and (pointer: coarse)").matches ||
   new URLSearchParams(window.location.search).has("celular"));
const simularIphone = typeof window !== "undefined" && new URLSearchParams(window.location.search).has("simular-iphone");
const mostrarServidor = typeof window !== "undefined" && new URLSearchParams(window.location.search).has("servidor");

function PhoneFrame({ children, wide = false }) {
  const { offline } = useApp();
  const [t, setT] = useState(new Date());
  useEffect(() => { const i = setInterval(() => setT(new Date()), 20000); return () => clearInterval(i); }, []);

  // En la app nativa (Android/Capacitor) el dispositivo real ya tiene su propia barra de
  // estado — el marco de teléfono es solo para la preview de escritorio en el navegador.
  if (esCelularWeb) {
    return (
      <div className="flex flex-col" style={{ height:"100dvh", background:"#F4F6FA",
        // ?simular-iphone imita la barra de inicio (34px) en una vista previa sin áreas seguras reales
        paddingBottom: simularIphone ? "34px" : "env(safe-area-inset-bottom)",
        paddingLeft:"env(safe-area-inset-left)", paddingRight:"env(safe-area-inset-right)" }}>
        {/* Franja de la isla dinámica: blanca en admin/dirección para continuar su cabecera blanca.
            ?simular-iphone la fija en 59px para la vista previa. */}
        <div className="shrink-0" style={{ height: simularIphone ? "59px" : "env(safe-area-inset-top)", background: wide ? "#FFFFFF" : "#F4F6FA" }} />
        {mostrarServidor && <div className="px-3 pt-2"><ApiConfigBar /></div>}
        <div className="flex-1 overflow-hidden flex flex-col relative">{children}</div>
      </div>
    );
  }

  if (isNativeApp) {
    return (
      <div className="min-h-screen flex flex-col" style={{ background:"#F4F6FA" }}>
        <ApiConfigBar />
        <div className="flex-1 overflow-hidden flex flex-col">{children}</div>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-4 pt-3"
      style={{ background:"#E9ECF3" }}>
      <ApiConfigBar />
      <div className={cx("device-wrap", wide && "device-wrap--wide")}>
        <div className={cx("device-shell", wide && "device-shell--wide")}>
          {/* Barra de estado — solo marco de teléfono; se oculta en desktop cuando wide */}
          <div className="phone-chrome flex justify-between items-center px-6 pt-3 pb-1.5 shrink-0 relative">
            <span className="text-[12px] font-black text-ink tnum">{fmtHora(t)}</span>
            <div className="absolute left-1/2 -translate-x-1/2 top-2.5 w-[86px] h-[26px] rounded-full bg-ink" />
            <div className="flex items-center gap-1.5 text-ink-soft">
              <Icon name={offline ? "wifi-off" : "wifi"} size={14} className={offline ? "text-bad" : ""} />
              <svg width="24" height="12" viewBox="0 0 24 12" aria-hidden="true">
                <rect x="0.5" y="0.5" width="19" height="11" rx="3.5" fill="none" stroke="currentColor" strokeWidth="1.2" opacity=".5" />
                <rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor" />
                <rect x="21" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5" />
              </svg>
            </div>
          </div>

          <div className="device-body flex-1 overflow-hidden flex flex-col">{children}</div>

          <div className="phone-chrome flex justify-center py-2.5 shrink-0">
            <div className="w-32 h-1.5 rounded-full bg-ink/25" />
          </div>
        </div>
      </div>
      <p className="text-[10px] text-ink-faint font-semibold mt-3">Argentina Seguridad Integral · Prototipo del Panel de Supervisión</p>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   RAÍZ
═══════════════════════════════════════════════════════════ */
function AppInner() {
  const { currentUser } = useApp();
  // Admin y Dueño trabajan "mixto" (celular para un vistazo, pantalla grande
  // para el análisis serio — ver PRODUCT.md § Users): ganan el layout ancho
  // de escritorio/tablet. Supervisor y Login son mobile-first por diseño y
  // se quedan siempre en el marco de teléfono, sin importar el viewport.
  const wide = currentUser?.rol === "admin" || currentUser?.rol === "dueno";
  return (
    <PhoneFrame wide={wide}>
      {!currentUser                     && <LoginScreen />}
      {currentUser?.rol === "supervisor"&& <SupervisorPanel />}
      {currentUser?.rol === "admin"     && <AdminPanel />}
      {currentUser?.rol === "dueno"     && <OwnerPanel />}
    </PhoneFrame>
  );
}

function App() {
  return <AppProvider><AppInner /></AppProvider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

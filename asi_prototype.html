/* ═══════════════════════════════════════════════════════════
   ADMINISTRACIÓN — CHECKLIST
═══════════════════════════════════════════════════════════ */
function ChecklistAdmin() {
  const { apiFetch } = useApp();
  const [objetivos, setObjetivos] = useState([]);
  const [objId, setObjId] = useState("");
  const [datos, setDatos] = useState(null);
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState(null);
  const [msgOk, setMsgOk] = useState(null);

  useEffect(() => {
    apiFetch("/api/admin/objetivos").then(r => r.json()).then(d => {
      if (d.ok && d.objetivos?.length) {
        const acts = d.objetivos.filter(o => o.activo);
        setObjetivos(acts);
        if (acts[0]) setObjId(String(acts[0].id));
      }
    }).catch(() => {});
  }, [apiFetch]);

  const cargarChecklist = useCallback(() => {
    if (!objId) return;
    setCargando(true);
    setError(null);
    apiFetch(`/api/admin/checklist/${objId}`).then(r => r.json()).then(d => {
      if (d.ok) setDatos(d);
      else setError(d.mensaje || "Error al cargar el checklist.");
    }).catch(() => setError("Error de conexión.")).finally(() => setCargando(false));
  }, [apiFetch, objId]);

  useEffect(() => { cargarChecklist(); }, [cargarChecklist]);

  const toggleItem = async (it) => {
    const nuevoEstado = !it.activo_en_objetivo;
    try {
      const res = await apiFetch(`/api/admin/checklist/${objId}`, {
        method: "POST",
        body: JSON.stringify({ item_id: it.id, activo: nuevoEstado })
      });
      const d = await res.json();
      if (d.ok) {
        setDatos(p => ({
          ...p,
          items: p.items.map(x => x.id === it.id ? { ...x, activo_en_objetivo: nuevoEstado } : x)
        }));
      } else {
        alert(d.mensaje || "Error al actualizar ítem.");
      }
    } catch {
      alert("Error de conexión.");
    }
  };

  const restablecerPlantilla = async () => {
    if (!confirm("¿Restablecer el checklist a la plantilla predeterminada del subtipo? Se borrarán las personalizaciones de este objetivo.")) return;
    try {
      const res = await apiFetch(`/api/admin/checklist/${objId}`, { method: "DELETE" });
      const d = await res.json();
      if (d.ok) {
        setMsgOk("Checklist restablecido a la plantilla base.");
        setTimeout(() => setMsgOk(null), 3000);
        cargarChecklist();
      } else {
        alert(d.mensaje || "Error al restablecer.");
      }
    } catch {
      alert("Error de conexión.");
    }
  };

  const porSeccion = useMemo(() => {
    if (!datos?.items) return [];
    const g = {};
    for (const it of datos.items) {
      const secKey = `${it.seccion_orden}_${it.seccion_titulo}`;
      (g[secKey] ||= { titulo: it.seccion_titulo, orden: it.seccion_orden, items: [] }).items.push(it);
    }
    return Object.values(g).sort((a,b) => a.orden - b.orden);
  }, [datos]);

  const activosCount = datos?.items?.filter(x => x.activo_en_objetivo).length || 0;
  const totalCount = datos?.items?.length || 0;

  return (
    <div className="flex flex-col gap-3">
      {msgOk && <div className="p-3 bg-good-soft text-good-ink rounded-clay text-sm font-semibold">{msgOk}</div>}
      {error && <div className="p-3 bg-bad-soft text-bad-ink rounded-clay text-sm font-semibold">{error}</div>}

      <div className="clay p-4 flex flex-wrap items-center justify-between gap-3">
        <div className="flex-1 min-w-[200px]">
          <Label className="mb-1">Seleccionar objetivo</Label>
          <select value={objId} onChange={e => setObjId(e.target.value)}
            className="w-full bg-white text-ink text-base font-semibold outline-none py-1">
            {objetivos.map(o => <option key={o.id} value={o.id}>{o.nombre} ({SUBTIPO_LABEL[o.subtipo] || o.tipo})</option>)}
          </select>
        </div>
        {datos && (
          <div className="flex items-center gap-2">
            <span className="text-xs font-semibold text-ink-mute">
              Plantilla base: <strong className="text-ink">{SUBTIPO_LABEL[datos.template_subtipo] || datos.template_subtipo}</strong>
            </span>
            <Btn size="sm" variant="secondary" onClick={restablecerPlantilla}>Restablecer plantilla</Btn>
          </div>
        )}
      </div>

      {cargando ? <SkeletonRows count={4} /> : !datos ? null : (
        <div className="flex flex-col gap-3">
          <div className="flex items-center justify-between px-1">
            <span className="text-sm font-semibold text-ink-mute">
              Ítems activos para este objetivo: <strong className="text-ink">{activosCount}</strong> de {totalCount}
            </span>
          </div>

          {porSeccion.map(sec => (
            <div key={sec.titulo} className="flex flex-col gap-1.5">
              <Label className="px-1">{sec.titulo}</Label>
              <div className="clay overflow-hidden divide-y divide-line">
                {sec.items.map(it => {
                  const on = it.activo_en_objetivo;
                  return (
                    <div key={it.id} className={cx("p-3.5 flex items-center justify-between gap-3 fila-toque", !on && "opacity-50 bg-[#F7F8FC]")}>
                      <div className="min-w-0 flex-1">
                        <p className="text-[16px] font-semibold text-ink leading-tight">{it.titulo_corto}</p>
                        <p className="text-[13px] text-ink-soft mt-0.5">{it.criterio_evaluacion}</p>
                        <div className="flex items-center gap-2 mt-1">
                          <Badge tone="gray">Área: {it.area_responsable}</Badge>
                          {it.requiere_foto && <Badge tone="brand">Foto obligatoria</Badge>}
                        </div>
                      </div>
                      <button onClick={() => toggleItem(it)}
                        className={cx("clay-btn px-4 py-2 rounded-xl text-xs font-bold shrink-0",
                          on ? "bg-good-soft text-good-ink border border-good/30" : "bg-brand-50 text-ink-mute border border-line")}>
                        {on ? "Activo" : "Inactivo"}
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   ADMINISTRACIÓN — OBSERVACIONES
═══════════════════════════════════════════════════════════ */
function ObservacionesAdmin() {
  const { apiFetch } = useApp();
  const [lista, setLista] = useState([]);
  const [cargando, setCargando] = useState(false);
  const [busqueda, setBusqueda] = useState("");
  const [filtroArea, setFiltroArea] = useState("todas");
  const [filtroActivo, setFiltroActivo] = useState("activos");
  const [error, setError] = useState(null);
  const [msgOk, setMsgOk] = useState(null);

  // Formulario
  const [modalForm, setModalForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [fCodigo, setFCodigo] = useState("");
  const [fArea, setFArea] = useState("Supervisión");
  const [fTexto, setFTexto] = useState("");
  const [guardando, setGuardando] = useState(false);

  const cargar = useCallback(() => {
    setCargando(true);
    apiFetch("/api/admin/observaciones").then(r => r.json()).then(d => {
      if (d.ok) setLista(d.observaciones || []);
    }).catch(() => setError("Error al cargar observaciones.")).finally(() => setCargando(false));
  }, [apiFetch]);

  useEffect(() => { cargar(); }, [cargar]);

  const abrirNuevo = () => {
    setEditId(null);
    setFCodigo("");
    setFArea("Supervisión");
    setFTexto("");
    setModalForm(true);
  };

  const abrirEditar = (o) => {
    setEditId(o.id);
    setFCodigo(o.codigo);
    setFArea(o.area);
    setFTexto(o.texto);
    setModalForm(true);
  };

  const guardar = async (e) => {
    e.preventDefault();
    if (!fCodigo.trim() || !fTexto.trim()) return;
    setGuardando(true);
    const body = { codigo: fCodigo.trim().toUpperCase(), area: fArea, texto: fTexto.trim() };
    try {
      const url = editId ? `/api/admin/observaciones/${editId}` : "/api/admin/observaciones";
      const method = editId ? "PATCH" : "POST";
      const res = await apiFetch(url, { method, body: JSON.stringify(body) });
      const data = await res.json();
      if (data.ok) {
        setMsgOk(editId ? "Observación actualizada." : "Observación creada.");
        setModalForm(false);
        setTimeout(() => setMsgOk(null), 3000);
        cargar();
      } else {
        alert(data.mensaje || "Error al guardar observación.");
      }
    } catch {
      alert("Error de conexión.");
    } finally {
      setGuardando(false);
    }
  };

  const toggleBaja = async (o) => {
    const acc = o.activo ? "baja" : "reactivar";
    if (!confirm(`¿Confirmás dar de ${acc} la observación "${o.codigo}"?`)) return;
    try {
      const res = await apiFetch(`/api/admin/observaciones/${o.id}/${acc}`, { method: "PATCH" });
      const data = await res.json();
      if (data.ok) {
        setMsgOk(`Observación ${acc === "baja" ? "dada de baja" : "reactivada"}.`);
        setTimeout(() => setMsgOk(null), 3000);
        cargar();
      } else {
        alert(data.mensaje || "Error al cambiar estado.");
      }
    } catch {
      alert("Error de conexión.");
    }
  };

  const filtrados = lista.filter(o => {
    if (filtroActivo === "activos" && !o.activo) return false;
    if (filtroActivo === "bajas" && o.activo) return false;
    if (filtroArea !== "todas" && o.area !== filtroArea) return false;
    if (busqueda.trim() && !o.codigo.toLowerCase().includes(busqueda.toLowerCase()) &&
        !o.texto.toLowerCase().includes(busqueda.toLowerCase())) return false;
    return true;
  });

  const AREAS = ["Logística", "Supervisión", "Operaciones", "RRHH", "Mantenimiento"];

  return (
    <div className="flex flex-col gap-3">
      {msgOk && <div className="p-3 bg-good-soft text-good-ink rounded-clay text-sm font-semibold">{msgOk}</div>}
      {error && <div className="p-3 bg-bad-soft text-bad-ink rounded-clay text-sm font-semibold">{error}</div>}

      <div className="flex flex-wrap items-center justify-between gap-2.5">
        <div className="flex-1 min-w-[200px]">
          <input value={busqueda} onChange={e => setBusqueda(e.target.value)}
            placeholder="Buscar por código o descripción…"
            className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink outline-none" />
        </div>
        <div className="flex items-center gap-2">
          <select value={filtroArea} onChange={e => setFiltroArea(e.target.value)}
            className="clay-inset rounded-xl px-2.5 py-2 text-xs font-semibold text-ink">
            <option value="todas">Todas las áreas</option>
            {AREAS.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
          <select value={filtroActivo} onChange={e => setFiltroActivo(e.target.value)}
            className="clay-inset rounded-xl px-2.5 py-2 text-xs font-semibold text-ink">
            <option value="activos">Solo activas</option>
            <option value="bajas">Dadas de baja</option>
            <option value="todos">Todas</option>
          </select>
          <Btn size="sm" icon="plus" onClick={abrirNuevo}>Nueva observación</Btn>
        </div>
      </div>

      {cargando ? <SkeletonRows count={4} /> : filtrados.length === 0 ? (
        <Empty icon="clipboard" title="Sin observaciones" sub="No se encontraron observaciones en el catálogo." />
      ) : (
        <div className="clay divide-y divide-line overflow-hidden">
          {filtrados.map(o => (
            <div key={o.id} className={cx("p-3.5 flex items-center justify-between gap-3 fila-toque", !o.activo && "opacity-50")}>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2">
                  <span className="font-mono text-xs font-bold text-ink">[{o.codigo}]</span>
                  <Badge tone={AREA_THEME[o.area]?.tone || "gray"}>{o.area}</Badge>
                  <Badge tone={o.activo ? "good" : "bad"}>{o.activo ? "Activa" : "Baja"}</Badge>
                </div>
                <p className="text-[15px] font-medium text-ink-soft mt-1 leading-snug">{o.texto}</p>
              </div>
              <div className="flex items-center gap-2">
                <Btn size="sm" variant="secondary" icon="pen" onClick={() => abrirEditar(o)}>Editar</Btn>
                <Btn size="sm" variant={o.activo ? "white" : "secondary"} onClick={() => toggleBaja(o)}>
                  {o.activo ? "Baja" : "Reactivar"}
                </Btn>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Modal Formulario */}
      <Sheet open={modalForm} onClose={() => setModalForm(false)}
        title={editId ? "Editar observación" : "Nueva observación"} sub="Catálogo de incidencias tipificadas">
        <form onSubmit={guardar} className="flex flex-col gap-3.5">
          <div className="grid grid-cols-2 gap-3">
            <Input label="Código único" value={fCodigo} onChange={e => setFCodigo(e.target.value)} required placeholder="Ej.: SUP-08" />
            <div>
              <Label className="mb-1">Área responsable</Label>
              <select value={fArea} onChange={e => setFArea(e.target.value)}
                className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink font-semibold">
                {AREAS.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
            </div>
          </div>
          <Textarea label="Texto descriptivo de la observación" value={fTexto} onChange={e => setFTexto(e.target.value)} required rows={3} placeholder="Describí la observación típica que verá el supervisor al elegir Regular o Malo…" />
          <Btn full size="lg" icon="check" loading={guardando} type="submit">
            {editId ? "Guardar cambios" : "Crear observación"}
          </Btn>
        </form>
      </Sheet>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   ADMINISTRACIÓN — USUARIOS
═══════════════════════════════════════════════════════════ */
function UsuariosAdmin() {
  const { apiFetch, currentUser } = useApp();
  const [lista, setLista] = useState([]);
  const [cargando, setCargando] = useState(false);
  const [busqueda, setBusqueda] = useState("");
  const [error, setError] = useState(null);
  const [msgOk, setMsgOk] = useState(null);

  // Modales
  const [modalCrear, setModalCrear] = useState(false);
  const [modalEditar, setModalEditar] = useState(false);
  const [modalBlanqueo, setModalBlanqueo] = useState(false);
  const [guardando, setGuardando] = useState(false);

  // Estados formulario
  const [uId, setUId] = useState(null);
  const [uUsername, setUUsername] = useState("");
  const [uPassword, setUPassword] = useState("");
  const [uNombre, setUNombre] = useState("");
  const [uRol, setURol] = useState("supervisor");
  const [uTelefono, setUTelefono] = useState("");
  const [nuevaClave, setNuevaClave] = useState("");

  const cargar = useCallback(() => {
    setCargando(true);
    apiFetch("/api/admin/usuarios").then(r => r.json()).then(d => {
      if (d.ok) setLista(d.usuarios || []);
    }).catch(() => setError("Error al cargar usuarios.")).finally(() => setCargando(false));
  }, [apiFetch]);

  useEffect(() => { cargar(); }, [cargar]);

  const abrirCrear = () => {
    setUUsername("");
    setUPassword("");
    setUNombre("");
    setURol("supervisor");
    setUTelefono("");
    setModalCrear(true);
  };

  const abrirEditar = (u) => {
    setUId(u.id);
    setUNombre(u.nombre);
    setUTelefono(u.telefono || "");
    setModalEditar(true);
  };

  const abrirBlanqueo = (u) => {
    setUId(u.id);
    setUNombre(u.nombre);
    setNuevaClave("");
    setModalBlanqueo(true);
  };

  const crearUsuario = async (e) => {
    e.preventDefault();
    if (!uUsername.trim() || !uPassword.trim() || !uNombre.trim()) return;
    setGuardando(true);
    try {
      const res = await apiFetch("/api/admin/usuarios", {
        method: "POST",
        body: JSON.stringify({
          username: uUsername.trim(),
          password: uPassword,
          nombre: uNombre.trim(),
          rol: uRol,
          telefono: uTelefono.trim() || null,
        })
      });
      const d = await res.json();
      if (d.ok) {
        setMsgOk(d.mensaje || "Usuario creado. Quedó pendiente de aprobación por el Dueño.");
        setModalCrear(false);
        setTimeout(() => setMsgOk(null), 4000);
        cargar();
      } else {
        alert(d.mensaje || "Error al crear usuario.");
      }
    } catch {
      alert("Error de conexión.");
    } finally {
      setGuardando(false);
    }
  };

  const editarUsuario = async (e) => {
    e.preventDefault();
    if (!uNombre.trim()) return;
    setGuardando(true);
    try {
      const res = await apiFetch(`/api/admin/usuarios/${uId}`, {
        method: "PATCH",
        body: JSON.stringify({ nombre: uNombre.trim(), telefono: uTelefono.trim() || null })
      });
      const d = await res.json();
      if (d.ok) {
        setMsgOk("Usuario actualizado.");
        setModalEditar(false);
        setTimeout(() => setMsgOk(null), 3000);
        cargar();
      } else {
        alert(d.mensaje || "Error al editar usuario.");
      }
    } catch {
      alert("Error de conexión.");
    } finally {
      setGuardando(false);
    }
  };

  const solicitarBlanqueo = async (e) => {
    e.preventDefault();
    if (!nuevaClave.trim()) return;
    setGuardando(true);
    try {
      const res = await apiFetch(`/api/admin/usuarios/${uId}/blanqueo`, {
        method: "POST",
        body: JSON.stringify({ clave_nueva: nuevaClave })
      });
      const d = await res.json();
      if (d.ok) {
        setMsgOk(d.mensaje || "Solicitud de blanqueo enviada a Dirección para su aprobación.");
        setModalBlanqueo(false);
        setTimeout(() => setMsgOk(null), 4000);
      } else {
        alert(d.mensaje || "Error al solicitar blanqueo.");
      }
    } catch {
      alert("Error de conexión.");
    } finally {
      setGuardando(false);
    }
  };

  const toggleBaja = async (u) => {
    const acc = u.activo ? "baja" : "reactivar";
    if (!confirm(`¿Confirmás dar de ${acc} al usuario "${u.nombre}" (${u.username})?`)) return;
    try {
      const res = await apiFetch(`/api/admin/usuarios/${u.id}/${acc}`, { method: "PATCH" });
      const d = await res.json();
      if (d.ok) {
        setMsgOk(`Usuario ${acc === "baja" ? "deshabilitado" : "reactivado"}.`);
        setTimeout(() => setMsgOk(null), 3000);
        cargar();
      } else {
        alert(d.mensaje || "No se pudo cambiar el estado.");
      }
    } catch {
      alert("Error de conexión.");
    }
  };

  const filtrados = lista.filter(u => {
    if (busqueda.trim() && !u.nombre.toLowerCase().includes(busqueda.toLowerCase()) &&
        !u.username.toLowerCase().includes(busqueda.toLowerCase())) return false;
    return true;
  });

  const ROL_LABEL = { supervisor: "Supervisor", admin: "Administración", dueno: "Dirección" };

  return (
    <div className="flex flex-col gap-3">
      {msgOk && <div className="p-3 bg-good-soft text-good-ink rounded-clay text-sm font-semibold">{msgOk}</div>}
      {error && <div className="p-3 bg-bad-soft text-bad-ink rounded-clay text-sm font-semibold">{error}</div>}

      <div className="p-3 bg-brand-50 text-ink rounded-clay text-xs leading-relaxed">
        <strong>Circuito de seguridad:</strong> Los nuevos usuarios y las solicitudes de blanqueo de contraseña creados por Administración requieren aprobación del Dueño (Dirección) para hacerse efectivos.
      </div>

      <div className="flex flex-wrap items-center justify-between gap-2.5">
        <div className="flex-1 min-w-[200px]">
          <input value={busqueda} onChange={e => setBusqueda(e.target.value)}
            placeholder="Buscar usuario por nombre o username…"
            className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink outline-none" />
        </div>
        <Btn size="sm" icon="plus" onClick={abrirCrear}>Nuevo usuario</Btn>
      </div>

      {cargando ? <SkeletonRows count={4} /> : filtrados.length === 0 ? (
        <Empty icon="users" title="Sin usuarios" sub="No se encontraron usuarios." />
      ) : (
        <div className="clay divide-y divide-line overflow-hidden">
          {filtrados.map(u => {
            const esPropio = u.id === currentUser?.id;
            const esDueno = u.rol === "dueno";
            return (
              <div key={u.id} className={cx("p-3.5 flex flex-wrap items-center justify-between gap-3 fila-toque", !u.activo && "opacity-50")}>
                <div className="min-w-0 flex-1 flex items-center gap-3">
                  <Avatar nombre={u.nombre} size={42} />
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2">
                      <p className="text-[16px] font-semibold text-ink leading-tight truncate">{u.nombre}</p>
                      <Badge tone={u.rol === "dueno" ? "brand" : u.rol === "admin" ? "plum" : "gray"}>
                        {ROL_LABEL[u.rol] || u.rol}
                      </Badge>
                      {u.pendiente_aprobacion && <Badge tone="warn">Por aprobar</Badge>}
                      {!u.activo && <Badge tone="bad">Inactivo</Badge>}
                    </div>
                    <p className="text-[13px] text-ink-mute mt-0.5 truncate">
                      Usuario: <span className="font-semibold text-ink">{u.username}</span>
                      {u.telefono ? ` · Tel: ${u.telefono}` : ""}
                      {u.creado_por_nombre ? ` · Creado por ${u.creado_por_nombre}` : ""}
                    </p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <Btn size="sm" variant="secondary" icon="pen" onClick={() => abrirEditar(u)}>Editar</Btn>
                  <Btn size="sm" variant="secondary" icon="lock" onClick={() => abrirBlanqueo(u)}>Blanquear clave</Btn>
                  {!esPropio && !esDueno && (
                    <Btn size="sm" variant={u.activo ? "white" : "secondary"} onClick={() => toggleBaja(u)}>
                      {u.activo ? "Baja" : "Reactivar"}
                    </Btn>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Modal Crear Usuario */}
      <Sheet open={modalCrear} onClose={() => setModalCrear(false)}
        title="Nuevo usuario" sub="Crear cuenta para el sistema">
        <form onSubmit={crearUsuario} className="flex flex-col gap-3.5">
          <Input label="Nombre y apellido" value={uNombre} onChange={e => setUNombre(e.target.value)} required placeholder="Ej.: Marcos González" />
          <div className="grid grid-cols-2 gap-3">
            <Input label="Usuario (login)" value={uUsername} onChange={e => setUUsername(e.target.value)} required placeholder="mgonzalez" />
            <div>
              <Label className="mb-1">Rol en el sistema</Label>
              <select value={uRol} onChange={e => setURol(e.target.value)}
                className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink font-semibold">
                <option value="supervisor">Supervisor de campo</option>
                <option value="admin">Administración</option>
              </select>
            </div>
          </div>
          <Input label="Contraseña inicial" type="password" value={uPassword} onChange={e => setUPassword(e.target.value)} required placeholder="Mínimo 6 caracteres" />
          <Input label="Teléfono de contacto" value={uTelefono} onChange={e => setUTelefono(e.target.value)} placeholder="Ej.: 11 4444-5555" />
          <p className="text-xs text-ink-mute">El usuario se creará en estado pendiente de aprobación y requerirá confirmación del Dueño.</p>
          <Btn full size="lg" icon="check" loading={guardando} type="submit">Crear usuario</Btn>
        </form>
      </Sheet>

      {/* Modal Editar Usuario */}
      <Sheet open={modalEditar} onClose={() => setModalEditar(false)}
        title="Editar usuario" sub={uNombre}>
        <form onSubmit={editarUsuario} className="flex flex-col gap-3.5">
          <Input label="Nombre y apellido" value={uNombre} onChange={e => setUNombre(e.target.value)} required />
          <Input label="Teléfono de contacto" value={uTelefono} onChange={e => setUTelefono(e.target.value)} placeholder="Ej.: 11 4444-5555" />
          <Btn full size="lg" icon="check" loading={guardando} type="submit">Guardar cambios</Btn>
        </form>
      </Sheet>

      {/* Modal Blanqueo de Contraseña */}
      <Sheet open={modalBlanqueo} onClose={() => setModalBlanqueo(false)}
        title="Blanquear contraseña" sub={`Para ${uNombre}`}>
        <form onSubmit={solicitarBlanqueo} className="flex flex-col gap-3.5">
          <p className="text-sm text-ink-mute">
            Ingresá la nueva contraseña provisoria. La solicitud pasará a la bandeja de aprobación del Dueño antes de ser activada.
          </p>
          <Input label="Nueva contraseña provisoria" type="password" value={nuevaClave} onChange={e => setNuevaClave(e.target.value)} required placeholder="Mínimo 6 caracteres" />
          <Btn full size="lg" icon="lock" loading={guardando} type="submit">Enviar solicitud de blanqueo</Btn>
        </form>
      </Sheet>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PANEL DUEÑO — dashboard ejecutivo
═══════════════════════════════════════════════════════════ */
const KPIS_VACIOS = {
  visitas:0, metaVisitas:1, criticas:0, activas:0, cerradas:0, porArea:[], diasProm:0,
  ticketsViejos:0, rondas:{ presenciales:0, remotas:0 }, porTipo:{}, porObjetivo:[],
};

function OwnerPanel() {
  const { apiStatus, apiFetch, currentUser, objetivos } = useApp();
  const [apiKpis, setApiKpis] = useState(null);
  const [apiFeed, setApiFeed] = useState(null);
  const [historico, setHistorico] = useState([]);
  const [remotas, setRemotas] = useState([]);
  const [ticketsObjetivo, setTicketsObjetivo] = useState(null);
  const [objetivoAbierto, setObjetivoAbierto] = useState(null);
  const [actaCodigo, setActaCodigo] = useState(null);
  const [tab, setTab] = useState("tipo");

  useEffect(() => {
    // Si se corta la conexión se siguen mostrando los últimos datos cargados.
    if (apiStatus !== "connected") return;
    apiFetch("/api/kpis").then(r => r.json()).then(d => {
      if (!d.ok) return;
      const k = d.kpis;
      const porObjetivo = (k.cumplimiento_objetivos || []).map(o => ({
        ...o, realizadas: o.rondas_realizadas, visitas_meta_mes: o.visitas_meta_mes,
      }));
      const porTipo = {};
      for (const o of porObjetivo) {
        porTipo[o.tipo] = porTipo[o.tipo] || { completadas:0, total:0 };
        porTipo[o.tipo].completadas += o.realizadas;
        porTipo[o.tipo].total       += o.visitas_meta_mes || 0;
      }
      setApiKpis({
        visitas:     porObjetivo.reduce((a, o) => a + o.realizadas, 0),
        metaVisitas: porObjetivo.reduce((a, o) => a + (o.visitas_meta_mes || 0), 0) || 1,
        criticas:    k.tickets.criticos, activas: k.tickets.abiertos, cerradas: k.tickets.cerrados,
        porArea:     k.tickets.por_area, diasProm: k.tickets.dias_promedio_resolucion,
        ticketsViejos: k.tickets.anteriores_48h,
        rondas:      k.rondas, porTipo, porObjetivo,
      });
    }).catch(e => console.warn("[kpis]", e.message));

    apiFetch("/api/actividad?limite=8").then(r => r.json()).then(d => {
      if (!d.ok) return;
      setApiFeed(d.actividad.map(a => ({
        hora: fmtHora(a.fecha_hora),
        sup:  a.supervisor.split(" ")[0][0] + ". " + a.supervisor.split(" ").slice(-1)[0],
        obj:  cortar(a.objetivo, 20),
        tipo: a.tipo === "remota" ? "Remota" : "Presencial",
        ok:   a.tickets === 0, isNew: false, codigoActa:a.codigo_acta,
      })));
    }).catch(() => {});
    apiFetch("/api/kpis/historico?meses=6").then(r => r.json()).then(d => { if (d.ok) setHistorico(d.historico); }).catch(() => {});
    apiFetch("/api/actividad?tipo=remota&limite=20").then(r => r.json()).then(d => { if (d.ok) setRemotas(d.actividad); }).catch(() => {});
    cargarTicketsApi(apiFetch).then(setTicketsObjetivo).catch(() => {});
  }, [apiStatus]);

  // Hasta que llegan los KPIs del servidor, el tablero muestra ceros (no datos inventados).
  const k    = apiKpis || KPIS_VACIOS;
  const feed = apiFeed || [];
  const pct  = Math.round(k.visitas / k.metaVisitas * 100);
  const rondasMes = k.rondas;
  const ticketsViejos = k.ticketsViejos;
  const remotasVisibles = remotas;

  const TIPO_COLOR = { Barrios:"#1F327C", Industrias:"#1F327C", Locales:"#1F327C" };

  return (
    <div className="flex flex-col h-full">
      <PanelHeader rol="Dashboard ejecutivo" nombre={currentUser?.nombre || "Gerencia"} />
      <ConnBar />
      <SyncToast />

      <div className="scroll-y flex-1 px-4 md:px-6 pb-5 flex flex-col gap-3.5">
        <div className="flex items-center justify-between">
          <div>
            <h2 className="text-[28px] md:text-[32px] font-semibold text-ink leading-[1.1] tracking-[-0.01em] first-letter:uppercase">
              {new Date().toLocaleDateString("es-AR", { month:"long", year:"numeric" })}
            </h2>
            <p className="text-[11px] text-ink-mute">Ciclo mensual de cumplimiento</p>
          </div>
          <div className="clay flex items-center gap-1.5 px-3 py-1.5">
            <Dot tone="bad" pulse />
            <span className="text-[10px] font-black text-ink-mute uppercase tracking-wide">En vivo</span>
          </div>
        </div>

        <PedidosClave />
        <UsuariosPendientesAprobacion />

        {/* En el teléfono, todo baja en una sola columna en este mismo
            orden. En tablet/desktop se reparte en dos columnas lado a
            lado: cobertura/incidencias/tiempo de resolución a la
            izquierda, cumplimiento/áreas/actividad a la derecha. */}
        <div className="flex flex-col gap-3.5 md:grid md:grid-cols-2 md:gap-4 md:items-start">
          <div className="flex flex-col gap-3.5">
            {/* Cobertura de visitas */}
            <Clay className="p-4 md:p-5">
              <Label className="mb-3">Cobertura de visitas mensuales</Label>
              <div className="flex items-center gap-4">
                <Ring value={k.visitas} max={k.metaVisitas} color="#1F327C" size={118} label={`${k.visitas} de ${k.metaVisitas}`} />
                <div className="flex-1 min-w-0">
                  <p className="text-[42px] font-black text-ink tnum leading-none">{pct}<span className="text-xl text-brand-500">%</span></p>
                  <p className="text-xs text-ink-mute mt-1 leading-snug">{k.visitas} visitas realizadas<br />sobre {k.metaVisitas} planificadas</p>
                  {rondasMes && (
                    <div className="flex gap-1.5 mt-2.5">
                      <Badge tone="good">{rondasMes.presenciales} presenciales</Badge>
                      <Badge tone="warn">{rondasMes.remotas} remotas</Badge>
                    </div>
                  )}
                </div>
              </div>
            </Clay>

            <Clay className="p-4 md:p-5">
              <Label className="mb-2">Seguimiento de incidencias</Label>
              <div className="flex justify-between items-center gap-2">
                <div><p className="text-2xl font-black text-bad tnum">{ticketsViejos}</p><p className="text-[10px] text-ink-mute">Abiertas hace más de 48 h</p></div>
                <div className="text-right"><p className="text-2xl font-black text-ink tnum">{k.diasProm || 0} d</p><p className="text-[10px] text-ink-mute">Resolución promedio</p></div>
              </div>
            </Clay>

            {historico.length > 0 && <Clay className="p-4 md:p-5">
              <Label className="mb-3">Evolución de los últimos 6 meses</Label>
              <div className="flex items-end gap-2 h-28">{historico.map(h => <div key={h.mes} className="flex-1 flex flex-col items-center justify-end h-full">
                <span className="text-[10px] font-bold text-ink tnum">{h.rondas}</span>
                <div className="w-full rounded-t-lg bg-brand-600" style={{ height:`${Math.max(4, (h.rondas / Math.max(...historico.map(x => x.rondas),1)) * 76)}px` }} />
                <span className="text-[9px] text-ink-mute mt-1">{h.mes.slice(5)}</span>
              </div>)}</div><p className="text-[10px] text-ink-mute mt-2">Rondas mensuales · azul institucional</p>
            </Clay>}

            {/* Incidencias */}
            <div className="flex gap-2.5">
              <Clay className="flex-1 p-4" tint={k.criticas > 0 ? "#FFF1F2" : "#ECFDF5"}>
                <Label className={k.criticas > 0 ? "text-bad-ink" : "text-good-ink"}>Críticas</Label>
                <p className={cx("text-[40px] font-black tnum leading-none mt-1", k.criticas > 0 ? "text-bad" : "text-good")}>{k.criticas}</p>
                <p className={cx("text-[10px] font-bold mt-1", k.criticas > 0 ? "text-bad-ink" : "text-good-ink")}>
                  {k.criticas > 0 ? "requieren atención" : "todo en orden"}
                </p>
              </Clay>
              <div className="flex-1 flex flex-col gap-2.5">
                <Clay className="p-3.5">
                  <p className="text-2xl font-black text-warn tnum leading-none">{k.activas}</p>
                  <p className="text-[10px] font-bold text-ink-mute mt-1">Tickets activos</p>
                </Clay>
                <Clay className="p-3.5">
                  <p className="text-2xl font-black text-good tnum leading-none">{k.cerradas}</p>
                  <p className="text-[10px] font-bold text-ink-mute mt-1">Resueltos</p>
                </Clay>
              </div>
            </div>

            {k.diasProm > 0 && (
              <Clay className="p-3.5 flex items-center gap-3">
                <span className="w-10 h-10 rounded-[14px] bg-brand-50 text-brand-600 flex items-center justify-center shrink-0">
                  <Icon name="clock" size={19} />
                </span>
                <div>
                  <p className="text-[13px] font-black text-ink tnum">{k.diasProm} días</p>
                  <p className="text-[10px] text-ink-mute">Tiempo promedio de resolución</p>
                </div>
              </Clay>
            )}
          </div>

          <div className="flex flex-col gap-3.5">
            {/* Cumplimiento */}
            <Clay className="p-4 md:p-5">
              <div className="flex items-center justify-between mb-3">
                <Label>Cumplimiento</Label>
                <div className="clay-inset flex gap-1 p-1">
                  {[["tipo","Por tipo"],["obj","Por objetivo"]].map(([kk, l]) => (
                    <button key={kk} onClick={() => setTab(kk)}
                      className={cx("px-2.5 py-1 rounded-[10px] text-[10px] font-black transition-all",
                        tab === kk ? "bg-brand-600 text-white" : "text-ink-mute")}>{l}</button>
                  ))}
                </div>
              </div>

              {tab === "tipo" ? (
                <div className="flex flex-col gap-3.5">
                  {Object.entries(k.porTipo || {}).map(([tipo, d]) => {
                    const p = d.total ? Math.round(d.completadas / d.total * 100) : 0;
                    return (
                      <div key={tipo}>
                        <div className="flex justify-between items-center mb-1.5">
                          <span className="text-[12px] font-bold text-ink-soft">{tipo}</span>
                          <span className="text-[11px] text-ink-mute tnum">
                            {d.completadas}/{d.total} · <span className="font-black text-ink">{p}%</span>
                          </span>
                        </div>
                        <Bar value={d.completadas} max={d.total || 1} color={TIPO_COLOR[tipo] || "#1F327C"} height={8} />
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div className="flex flex-col gap-3">
                  {(k.porObjetivo || []).map(o => {
                    const meta = o.visitas_meta_mes || 0;
                    const p = meta ? Math.round(o.realizadas / meta * 100) : 0;
                    return (
                      <div key={o.id}>
                        <button onClick={() => setObjetivoAbierto(objetivoAbierto === o.id ? null : o.id)} className="w-full flex justify-between items-center gap-2 mb-1.5 text-left">
                          <span className="text-[11px] font-bold text-ink-soft truncate flex-1">{o.nombre}</span>
                          <span className="text-[10px] text-ink-mute tnum shrink-0">{o.realizadas}/{meta} · {objetivoAbierto === o.id ? "−" : "+"}</span>
                        </button>
                        <Bar value={o.realizadas} max={meta || 1} color={p >= 100 ? "#047857" : "#1F327C"} height={8} />
                        {objetivoAbierto === o.id && <div className="bg-brand-50 rounded-xl p-3 mt-2 text-[11px] text-ink-soft">
                          <p>{p}% de la meta mensual · faltan {Math.max(meta - o.realizadas, 0)} visitas</p>
                          <p className="mt-1">Incidencias abiertas: {ticketsObjetivo ?
                            ticketsObjetivo.filter(t => t.objetivo === o.nombre && t.estado === "ABIERTO").length : "—"}</p>
                        </div>}
                      </div>
                    );
                  })}
                </div>
              )}
            </Clay>

            {/* Tickets por área */}
            {k.porArea?.length > 0 && (
              <Clay className="p-4">
                <Label className="mb-3">Tickets abiertos por área</Label>
                <div className="flex flex-col gap-2">
                  {k.porArea.map(a => (
                    <div key={a.area_responsable} className="flex items-center gap-2.5">
                      <Badge tone={AREA_THEME[a.area_responsable]?.tone || "gray"}>{a.area_responsable}</Badge>
                      <div className="flex-1"><Bar value={parseInt(a.cantidad)} max={Math.max(...k.porArea.map(x => parseInt(x.cantidad)))} color="#1F327C" height={8} /></div>
                      <span className="text-[11px] font-black text-ink tnum w-4 text-right">{a.cantidad}</span>
                    </div>
                  ))}
                </div>
              </Clay>
            )}

            <Clay className="p-4">
              <Label className="mb-3">Supervisiones remotas</Label>
              {remotasVisibles.length === 0 ? <p className="text-xs text-ink-mute">Sin rondas remotas registradas.</p> :
                remotasVisibles.slice(0,5).map(r => <button key={r.codigo_acta} onClick={() => setActaCodigo(r.codigo_acta)} className="w-full text-left py-2 border-b border-line last:border-0">
                  <p className="text-xs font-bold text-ink">{r.objetivo}</p>
                  <p className="text-[10px] text-ink-mute">{r.supervisor} · {new Date(r.fecha_hora).toLocaleDateString("es-AR")} · {r.tickets} incidencias</p>
                  {r.justificacion_fuera && <p className="text-[10px] text-ink-soft mt-1 line-clamp-2">{r.justificacion_fuera}</p>}
                </button>)}
            </Clay>

            {/* Feed en vivo */}
            <Clay className="p-4">
              <div className="flex items-center justify-between mb-3">
                <Label>Actividad en tiempo real</Label>
                <div className="flex items-center gap-1.5"><Dot tone="good" pulse /><span className="text-[10px] font-black text-good-ink">Live</span></div>
              </div>
              {feed.length === 0
                ? <Empty icon="activity" title="Sin actividad" sub="Las rondas aparecerán acá al guardarse." />
                : feed.map((a, i) => (
                  <button key={i} onClick={() => a.codigoActa && setActaCodigo(a.codigoActa)} disabled={!a.codigoActa} className={cx("w-full text-left flex items-center gap-2.5 py-2.5", i < feed.length - 1 && "border-b border-slate-100")}>
                    <span className="text-[10px] text-ink-faint w-[74px] shrink-0 tnum whitespace-nowrap">{a.hora}</span>
                    <Dot tone={a.tipo === "Presencial" ? "good" : "warn"} />
                    <div className="flex-1 min-w-0">
                      <p className="text-[11px] font-bold text-ink truncate">
                        {a.isNew && <span className="text-brand-600">● </span>}{a.sup} → {a.obj}
                      </p>
                      <p className="text-[10px] text-ink-faint">{a.isNew ? "Recién · " : ""}{a.tipo}{!a.ok ? " · con incidencia" : ""}</p>
                    </div>
                    <Icon name={a.ok ? "check-circle" : "alert"} size={15} className={a.ok ? "text-good" : "text-warn"} />
                  </button>
                ))}
            </Clay>
          </div>
        </div>

        <p className="text-center text-[10px] text-ink-faint pb-1">ASI · Sistema de Supervisión v3.0</p>
      </div>
      <AuditSheet codigo={actaCodigo} onClose={() => setActaCodigo(null)} />
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   MARCO DE TELÉFONO
═══════════════════════════════════════════════════════════ */
const isNativeApp = typeof window !== "undefined" &&
  !!window.Capacitor && (window.Capacitor.isNativePlatform ? window.Capacitor.isNativePlatform() : true);

/* En un celular real (navegador o "Agregar a inicio" en iPhone) el marco de teléfono
   falso sobra: la app ocupa la pantalla entera y respeta la isla dinámica y la barra
   de inicio con env(safe-area-inset-*). La barra de servidor solo aparece con ?servidor. */
const esCelularWeb = typeof window !== "undefined" && !isNativeApp &&
  (window.matchMedia("(max-width: 600px) and (pointer: coarse)").matches ||
   new URLSearchParams(window.location.search).has("celular"));
const simularIphone = typeof window !== "undefined" && new URLSearchParams(window.location.search).has("simular-iphone");

function PhoneFrame({ children, wide = false }) {
  const { offline } = useApp();
  const [t, setT] = useState(new Date());
  useEffect(() => { const i = setInterval(() => setT(new Date()), 20000); return () => clearInterval(i); }, []);

  // En la app nativa (Android/Capacitor) el dispositivo real ya tiene su propia barra de
  // estado — el marco de teléfono es solo para la preview de escritorio en el navegador.
  if (esCelularWeb) {
    return (
      <div className="flex flex-col" style={{ height:"100dvh", background:"#F4F6FA",
        // ?simular-iphone imita la barra de inicio (34px) en una vista previa sin áreas seguras reales
        paddingBottom: simularIphone ? "34px" : "env(safe-area-inset-bottom)",
        paddingLeft:"env(safe-area-inset-left)", paddingRight:"env(safe-area-inset-right)" }}>
        {/* Franja de la isla dinámica: blanca en admin/dirección para continuar su cabecera blanca.
            ?simular-iphone la fija en 59px para la vista previa. */}
        <div className="shrink-0" style={{ height: simularIphone ? "59px" : "env(safe-area-inset-top)", background: wide ? "#FFFFFF" : "#F4F6FA" }} />
        <div className="flex-1 overflow-hidden flex flex-col relative">{children}</div>
      </div>
    );
  }

  if (isNativeApp) {
    return (
      <div className="min-h-screen flex flex-col" style={{ background:"#F4F6FA" }}>
        <div className="flex-1 overflow-hidden flex flex-col">{children}</div>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-4 pt-3"
      style={{ background:"#E9ECF3" }}>
      <div className={cx("device-wrap", wide && "device-wrap--wide")}>
        <div className={cx("device-shell", wide && "device-shell--wide")}>
          {/* Barra de estado — solo marco de teléfono; se oculta en desktop cuando wide */}
          <div className="phone-chrome flex justify-between items-center px-6 pt-3 pb-1.5 shrink-0 relative">
            <span className="text-[12px] font-black text-ink tnum">{fmtHora(t)}</span>
            <div className="absolute left-1/2 -translate-x-1/2 top-2.5 w-[86px] h-[26px] rounded-full bg-ink" />
            <div className="flex items-center gap-1.5 text-ink-soft">
              <Icon name={offline ? "wifi-off" : "wifi"} size={14} className={offline ? "text-bad" : ""} />
              <svg width="24" height="12" viewBox="0 0 24 12" aria-hidden="true">
                <rect x="0.5" y="0.5" width="19" height="11" rx="3.5" fill="none" stroke="currentColor" strokeWidth="1.2" opacity=".5" />
                <rect x="2" y="2" width="15" height="8" rx="2" fill="currentColor" />
                <rect x="21" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5" />
              </svg>
            </div>
          </div>

          <div className="device-body flex-1 overflow-hidden flex flex-col">{children}</div>

          <div className="phone-chrome flex justify-center py-2.5 shrink-0">
            <div className="w-32 h-1.5 rounded-full bg-ink/25" />
          </div>
        </div>
      </div>
      <p className="text-[10px] text-ink-faint font-semibold mt-3">Argentina Seguridad Integral · Panel de Supervisión</p>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   RAÍZ
═══════════════════════════════════════════════════════════ */
function AppInner() {
  const { currentUser } = useApp();
  // Admin y Dueño trabajan "mixto" (celular para un vistazo, pantalla grande
  // para el análisis serio — ver PRODUCT.md § Users): ganan el layout ancho
  // de escritorio/tablet. Supervisor y Login son mobile-first por diseño y
  // se quedan siempre en el marco de teléfono, sin importar el viewport.
  const wide = currentUser?.rol === "admin" || currentUser?.rol === "dueno";
  return (
    <PhoneFrame wide={wide}>
      {!currentUser                     && <LoginScreen />}
      {currentUser?.rol === "supervisor"&& <SupervisorPanel />}
      {currentUser?.rol === "admin"     && <AdminPanel />}
      {currentUser?.rol === "dueno"     && <OwnerPanel />}
    </PhoneFrame>
  );
}

function App() {
  return <AppProvider><AppInner /></AppProvider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

          {/* Sello */}
          <div className="clay-inset px-3.5 py-3 stripe-bg">
            <div className="flex items-start gap-2">
              <Icon name="stamp" size={16} className="text-brand-700 mt-px" />
              <div>
                <p className="text-[10px] font-black text-brand-800 uppercase tracking-wide">Sello digital · no modificable</p>
                <p className="text-[10px] text-ink-mute mt-1 font-mono leading-relaxed">
                  {fmtFecha(fin)} {fin.toLocaleTimeString("es-AR")}<br />
                  {rd.deviceCoords?.lat != null ? `GPS ${rd.deviceCoords.lat.toFixed(5)}, ${rd.deviceCoords.lng.toFixed(5)}` : "GPS no disponible"}<br />
                  {supervisor}
                </p>
              </div>
            </div>
          </div>
        </div>
      </Clay>

      {/* Tickets emitidos */}
      {acta.tickets.length > 0 && (
        <Clay className="p-4">
          <div className="flex items-center gap-2 mb-2.5">
            <Icon name="send" size={16} className="text-brand-600" />
            <p className="text-[12px] font-black text-ink">
              {acta.tickets.length} ticket{acta.tickets.length > 1 ? "s" : ""} {encolada ? "pendiente de envío" : "enviado a las áreas"}
            </p>
          </div>
          <div className="flex flex-col gap-2">
            {acta.tickets.map(t => (
              <div key={t.id} className="clay-inset px-3 py-2.5 flex items-center gap-2">
                <Badge tone={AREA_THEME[t.area]?.tone || "gray"}>{t.area}</Badge>
                <span className="text-[11px] text-ink-soft font-semibold truncate flex-1">{t.item}</span>
                <span className="text-[9px] font-mono font-black text-ink-faint shrink-0">{t.id}</span>
              </div>
            ))}
          </div>
        </Clay>
      )}

      <Btn full size="lg" variant="white" icon="clipboard" onClick={exportarPdf}>Exportar acta a PDF</Btn>
      <Btn full size="xl" icon="refresh" onClick={onNueva}>Iniciar nueva ronda</Btn>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PANEL SUPERVISOR — wizard de 5 pasos + acta
═══════════════════════════════════════════════════════════ */
const PASOS = ["Inicio", "Vigiladores", "Checklist", "Evidencia", "Firmas"];

function SupervisorPanel() {
  const { currentUser, guardarRonda } = useApp();
  const [paso, setPaso] = useState(0);
  const [rd,   setRD]   = useState({});
  const [res,  setRes]  = useState(null);
  const [busy, setBusy] = useState(false);
  const [rechazo, setRechazo] = useState(null); // mensaje del servidor si no aceptó el acta
  const scrollRef = useRef(null);
  const guardandoRef = useRef(false); // guard sincrónico: setBusy/disabled tardan un render en aplicarse

  const supervisor = currentUser?.nombre || "Supervisor";

  const ir = (n) => { setPaso(n); scrollRef.current?.scrollTo({ top:0, behavior:"smooth" }); };
  const reiniciar = () => { setRD({}); setRes(null); setRechazo(null); ir(0); };

  const guardar = async () => {
    if (guardandoRef.current) return;
    guardandoRef.current = true;
    setBusy(true);
    try {
      setRechazo(null);
      const r = await guardarRonda(rd, supervisor);
      if (r.estado === "rechazada") setRechazo(r.mensaje);
      else setRes(r);
    } finally {
      setBusy(false);
      guardandoRef.current = false;
      scrollRef.current?.scrollTo({ top:0, behavior:"smooth" });
    }
  };

  const pantallas = [
    <Step1 rd={rd} setRD={setRD} onNext={() => ir(1)} />,
    <Step2 rd={rd} setRD={setRD} onNext={() => ir(2)} onBack={() => ir(0)} />,
    <Step3 rd={rd} setRD={setRD} onNext={() => ir(3)} onBack={() => ir(1)} />,
    <Step4 rd={rd} setRD={setRD} onNext={() => ir(4)} onBack={() => ir(2)} supervisor={supervisor} />,
    <Step5 rd={rd} setRD={setRD} onGuardar={guardar} onBack={() => ir(3)} guardando={busy} />,
  ];

  return (
    <div className="flex flex-col h-full">
      <PanelHeader rol="Supervisión de campo" nombre={supervisor} />
      <ConnBar />
      <SyncToast />
      {!res && <Stepper steps={PASOS} current={paso} />}
      {rechazo && !res && (
        <div className="shrink-0 mx-4 mb-2 rounded-[14px] bg-bad-soft text-bad-ink px-4 py-3 flex gap-2.5 a-dn" role="alert">
          <Icon name="alert" size={18} className="mt-px" />
          <div className="min-w-0">
            <p className="text-[16px] font-semibold leading-snug">El servidor no aceptó el acta</p>
            <p className="text-[15px] leading-snug mt-0.5">{rechazo}</p>
          </div>
        </div>
      )}
      {!res && paso === 0 && rd.objetivo && <div className={cx("shrink-0 mx-4 mb-2 px-3 py-2 rounded-xl flex items-center gap-2 text-xs font-bold",
        rd.gpsStatus === "inside" ? "bg-good-soft text-good-ink" : rd.gpsStatus === "outside" || rd.gpsStatus === "error" ? "bg-bad-soft text-bad-ink" : "bg-warn-soft text-warn-ink")}>
        <Icon name={rd.gpsStatus === "inside" ? "shield-ok" : "pin"} size={15} />
        <span className="flex-1">{rd.gpsStatus === "inside" ? "Dentro del geocerco · podés iniciar la ronda" :
          rd.gpsStatus === "outside" ? "Fuera del geocerco · supervisión remota" : rd.gpsStatus === "error" ? "GPS no disponible · supervisión remota" : "Comprobando ubicación…"}</span>
      </div>}
      <div ref={scrollRef} className="scroll-y flex-1">
        {res
          ? <ActaGenerada rd={rd} resultado={res} supervisor={supervisor} onNueva={reiniciar} />
          : pantallas[paso]}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   MAPA LEAFLET — selector geográfico interactivo
═══════════════════════════════════════════════════════════ */
function MapPicker({ lat, lng, radio = 150, onChange, height = 260 }) {
  const containerRef = useRef(null);
  const mapRef = useRef(null);
  const markerRef = useRef(null);
  const circleRef = useRef(null);

  useEffect(() => {
    if (!containerRef.current || typeof L === "undefined") return;
    const initLat = (lat != null && !isNaN(lat)) ? Number(lat) : -34.6037;
    const initLng = (lng != null && !isNaN(lng)) ? Number(lng) : -58.3816;

    const map = L.map(containerRef.current, { zoomControl: true }).setView([initLat, initLng], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap",
    }).addTo(map);

    const marker = L.marker([initLat, initLng], { draggable: true }).addTo(map);
    const circle = L.circle([initLat, initLng], {
      radius: Math.max(30, Number(radio) || 150),
      color: "#1F327C",
      fillColor: "#2152A1",
      fillOpacity: 0.15,
      weight: 2,
    }).addTo(map);

    marker.on("dragend", (e) => {
      const pos = e.target.getLatLng();
      circle.setLatLng(pos);
      onChange(Number(pos.lat.toFixed(6)), Number(pos.lng.toFixed(6)));
    });

    map.on("click", (e) => {
      marker.setLatLng(e.latlng);
      circle.setLatLng(e.latlng);
      onChange(Number(e.latlng.lat.toFixed(6)), Number(e.latlng.lng.toFixed(6)));
    });

    mapRef.current = map;
    markerRef.current = marker;
    circleRef.current = circle;

    const t = setTimeout(() => { if (mapRef.current) mapRef.current.invalidateSize(); }, 300);
    return () => {
      clearTimeout(t);
      map.remove();
      mapRef.current = null;
    };
  }, []);

  useEffect(() => {
    if (!mapRef.current || !markerRef.current || !circleRef.current) return;
    if (lat != null && lng != null && !isNaN(lat) && !isNaN(lng)) {
      const cur = markerRef.current.getLatLng();
      if (Math.abs(cur.lat - lat) > 0.00005 || Math.abs(cur.lng - lng) > 0.00005) {
        markerRef.current.setLatLng([lat, lng]);
        circleRef.current.setLatLng([lat, lng]);
        mapRef.current.panTo([lat, lng]);
      }
    }
    if (radio != null && !isNaN(radio)) {
      circleRef.current.setRadius(Math.max(30, Number(radio)));
    }
  }, [lat, lng, radio]);

  return (
    <div className="relative rounded-[14px] overflow-hidden border border-line" style={{ height }}>
      <div ref={containerRef} style={{ width: "100%", height: "100%", zIndex: 1 }} />
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   ADMINISTRACIÓN — INCIDENCIAS
═══════════════════════════════════════════════════════════ */
function IncidenciasAdmin() {
  const { apiStatus, apiFetch } = useApp();
  const [apiTickets, setApiTickets] = useState(null);
  const [cargando,   setCargando]   = useState(false);
  const [filtro,     setFiltro]     = useState("activo");
  const [area,       setArea]       = useState("todas");
  const [busqueda,   setBusqueda]   = useState("");
  const [prioridad,  setPrioridad]  = useState("todas");
  const [periodo,    setPeriodo]    = useState("todos");
  const [objetivo,   setObjetivo]   = useState("todos");
  const [supervisor, setSupervisor] = useState("todos");
  const [actaCodigo, setActaCodigo] = useState(null);
  const [error,      setError]      = useState("");
  const [sel,        setSel]        = useState(null);
  const [resol,      setResol]      = useState("");
  const [cerrando,   setCerrando]   = useState(false);

  const tickets = apiTickets || [];

  useEffect(() => {
    if (apiStatus !== "connected") return;
    setCargando(true);
    cargarTicketsApi(apiFetch).then(ts => {
      setApiTickets(ts.map(t => ({
        id: t.codigo_ticket, _dbId: t.id, obj: t.objetivo, sup: t.supervisor,
        val: t.valoracion || "R", area: t.area_responsable, item: t.item_titulo,
        vig: t.vigilador, estado: t.estado === "ABIERTO" ? "Activo" : "Cerrado",
        desc: t.descripcion, resolucion: t.resolucion,
        codigoActa: t.codigo_acta, fechaIso: t.fecha_creacion,
        fecha: new Date(t.fecha_creacion).toLocaleString("es-AR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }),
        isNew: false,
      })));
    }).catch(e => { console.warn("[tickets]", e.message); setError("No se pudieron cargar las incidencias."); }).finally(() => setCargando(false));
  }, [apiStatus]);

  const stats = {
    crit: tickets.filter(t => t.val === "M" && t.estado === "Activo").length,
    act:  tickets.filter(t => t.estado === "Activo").length,
    cer:  tickets.filter(t => t.estado === "Cerrado").length,
  };

  const areas = useMemo(() => {
    const s = {};
    for (const t of tickets) if (t.estado === "Activo") s[t.area] = (s[t.area] || 0) + 1;
    return s;
  }, [tickets]);

  const opcionesObjetivo = [...new Set(tickets.map(t => t.obj).filter(Boolean))].sort();
  const opcionesSupervisor = [...new Set(tickets.map(t => t.sup).filter(Boolean))].sort();
  const antiguedadHoras = t => t.fechaIso ? (Date.now() - new Date(t.fechaIso).getTime()) / 3600000 : null;
  const lista = tickets.filter(t =>
    (filtro === "todas" || (filtro === "activo" ? t.estado === "Activo" : t.estado === "Cerrado")) &&
    (area === "todas" || t.area === area) &&
    (objetivo === "todos" || t.obj === objetivo) &&
    (supervisor === "todos" || t.sup === supervisor) &&
    (prioridad !== "criticas" || (t.val === "M" && t.estado === "Activo")) &&
    (prioridad !== "antiguas" || (t.estado === "Activo" && antiguedadHoras(t) >= 48)) &&
    (periodo === "todos" || (antiguedadHoras(t) != null && antiguedadHoras(t) <= (periodo === "hoy" ? 24 : 168))) &&
    (!busqueda.trim() || [t.id,t.obj,t.sup,t.desc,t.vig,t.item].some(v => String(v || "").toLocaleLowerCase("es").includes(busqueda.trim().toLocaleLowerCase("es"))))
  ).sort((a,b) => (Number(b.val === "M" && b.estado === "Activo") - Number(a.val === "M" && a.estado === "Activo")) ||
    (new Date(a.fechaIso || 0).getTime() - new Date(b.fechaIso || 0).getTime()));

  const actual = sel ? tickets.find(t => t.id === sel.id) || sel : null;

  const confirmarCierre = async () => {
    setCerrando(true);
    try {
      const response = await apiFetch(`/api/tickets/${actual._dbId}/resolver`, { method:"PATCH", body: JSON.stringify({ resolucion: resol }) });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.mensaje || "No se pudo cerrar la incidencia.");
    } catch (e) {
      setError(e.message === "Failed to fetch" ? "Sin conexión: no se pudo cerrar la incidencia." : e.message);
      setCerrando(false); return;
    }
    setApiTickets(ts => ts.map(t => t.id === actual.id ? { ...t, estado:"Cerrado", resolucion: resol } : t));
    setCerrando(false); setSel(null); setResol("");
  };

  return (
    <div className="flex flex-col gap-3">
      {error && <p className="px-4 text-xs text-bad-ink">{error}</p>}

      {/* Contadores */}
      <div className="flex gap-2 md:gap-3 pb-2 shrink-0">
        {[["Críticas", stats.crit, "bad"], ["Activas", stats.act, "warn"], ["Cerradas", stats.cer, "good"]].map(([l, v, tone]) => (
          <Clay key={l} className="flex-1 p-3 md:p-5 text-center">
            <p className={cx("text-2xl md:text-3xl font-black tnum leading-none",
              tone === "bad" ? "text-bad" : tone === "warn" ? "text-warn" : "text-good")}>{v}</p>
            <p className="text-[10px] md:text-xs font-bold text-ink-mute mt-1">{l}</p>
          </Clay>
        ))}
      </div>

      <div className="flex flex-col gap-2 shrink-0">
        <input value={busqueda} onChange={e => setBusqueda(e.target.value)} placeholder="Buscar ticket, objetivo, supervisor o vigilador"
          aria-label="Buscar incidencias" className="clay-inset w-full rounded-xl px-3 py-2.5 text-sm text-ink outline-none" />
        <div className="grid grid-cols-2 gap-2">
          <select aria-label="Prioridad" value={prioridad} onChange={e => setPrioridad(e.target.value)} className="clay-inset rounded-xl px-2 py-2 text-xs text-ink">
            <option value="todas">Toda prioridad</option><option value="criticas">Críticas abiertas</option><option value="antiguas">Abiertas +48 h</option></select>
          <select aria-label="Período" value={periodo} onChange={e => setPeriodo(e.target.value)} className="clay-inset rounded-xl px-2 py-2 text-xs text-ink">
            <option value="todos">Cualquier fecha</option><option value="hoy">Últimas 24 h</option><option value="semana">Últimos 7 días</option></select>
        </div>
        <details className="text-xs text-brand-700"><summary className="cursor-pointer font-semibold py-1">Filtrar por objetivo y supervisor</summary>
          <div className="grid grid-cols-2 gap-2 pt-2">
            <select aria-label="Objetivo" value={objetivo} onChange={e => setObjetivo(e.target.value)} className="clay-inset rounded-xl px-2 py-2 text-xs text-ink">
              <option value="todos">Todos los objetivos</option>{opcionesObjetivo.map(x => <option key={x} value={x}>{x}</option>)}</select>
            <select aria-label="Supervisor" value={supervisor} onChange={e => setSupervisor(e.target.value)} className="clay-inset rounded-xl px-2 py-2 text-xs text-ink">
              <option value="todos">Todos los supervisores</option>{opcionesSupervisor.map(x => <option key={x} value={x}>{x}</option>)}</select>
          </div>
        </details>
        <p className="text-[10px] text-ink-mute font-semibold">{lista.length} incidencias encontradas</p>
      </div>

      <div className="md:flex md:items-center md:gap-4 shrink-0">
        <div className="pb-2 md:pb-0 shrink-0 md:w-72">
          <Segmented tone="plum" value={filtro} onChange={setFiltro}
            options={[["activo","Activas",stats.act],["cerrado","Cerradas",stats.cer],["todas","Todas",tickets.length]]} />
        </div>

        {Object.keys(areas).length > 0 && (
          <div className="flex gap-2 overflow-x-auto pb-2 md:pb-0 shrink-0 md:flex-1">
            <button onClick={() => setArea("todas")}
              className={cx("clay-btn shrink-0 px-3 py-2 rounded-full text-[10px] font-black",
                area === "todas" ? "bg-plum text-white" : "bg-white text-ink-mute")}>Todas</button>
            {Object.entries(areas).map(([a, n]) => (
              <button key={a} onClick={() => setArea(a)}
                className={cx("clay-btn shrink-0 px-3 py-2 rounded-full text-[10px] font-black flex items-center gap-1",
                  area === a ? "bg-plum text-white" : "bg-white text-ink-mute")}>
                <span>{a}</span><span className="opacity-75 tnum">{n}</span>
              </button>
            ))}
          </div>
        )}
      </div>

      {cargando && !tickets.length && <SkeletonRows count={4} />}
      {!cargando && lista.length === 0 && (
        <Empty icon="inbox" title="Sin incidencias"
          sub={filtro === "activo" ? "No hay incidencias activas con este filtro." : "No se encontraron incidencias."} />
      )}

      {/* Lista */}
      <div className="flex flex-col gap-2">
        {lista.map(t => (
          <button key={t.id} onClick={() => { setSel(t); setResol(""); }}
            className="clay fila-toque text-left p-3.5 flex flex-col gap-2 focus-ring">
            <div className="flex items-start justify-between gap-2">
              <div className="min-w-0">
                <p className="text-[15px] font-semibold text-ink leading-tight truncate">{t.obj}</p>
                <p className="text-[13px] text-ink-mute mt-0.5 truncate">{t.item || t.id}</p>
              </div>
              <div className="flex gap-1.5 shrink-0 items-center">
                <Badge tone={AREA_THEME[t.area]?.tone || "gray"}>{t.area}</Badge>
                <Badge tone={t.val === "M" ? "bad" : "warn"}>{VALOR[t.val]?.label || t.val}</Badge>
              </div>
            </div>
            <p className="text-[13px] text-ink-soft line-clamp-2 leading-relaxed">{t.desc}</p>
            <div className="flex items-center justify-between text-[11px] text-ink-faint pt-1 border-t border-line">
              <span className="truncate">{t.sup} {t.vig ? `· ${t.vig}` : ""}</span>
              <span className="shrink-0 tnum">{t.fecha}</span>
            </div>
          </button>
        ))}
      </div>

      {/* Detalle y resolución */}
      <Sheet open={!!sel} onClose={() => setSel(null)} title={actual?.obj} sub={actual?.id}>
        {actual && (
          <div className="flex flex-col gap-3.5">
            <div className="flex gap-1.5 flex-wrap">
              <Badge tone={AREA_THEME[actual.area]?.tone || "gray"}>{actual.area}</Badge>
              <Badge tone={actual.val === "M" ? "bad" : "warn"}>{VALOR[actual.val]?.label || actual.val}</Badge>
              <Badge tone={actual.estado === "Activo" ? "warn" : "good"}>{actual.estado}</Badge>
            </div>

            <Clay className="p-4">
              <Label className="mb-1.5">Descripción</Label>
              <p className="text-[13px] text-ink-soft leading-relaxed">{actual.desc}</p>
            </Clay>

            <Clay className="p-4">
              {actual.item && <Row k="Ítem del checklist" v={actual.item} />}
              {actual.vig  && <Row k="Vigilador" v={actual.vig} />}
              <Row k="Supervisor" v={actual.sup} />
              <Row k="Registrado" v={actual.fecha} last />
            </Clay>
            {actual.codigoActa && <Btn full variant="secondary" icon="clipboard" onClick={() => { setSel(null); setActaCodigo(actual.codigoActa); }}>Ver acta y evidencias</Btn>}

            {actual.estado === "Activo" ? (
              <>
                <Textarea label="Resolución técnica" value={resol} onChange={e => setResol(e.target.value)} rows={4}
                  placeholder="Describí la acción concreta que resolvió esta incidencia…"
                  hint={<p className="text-[10px] text-ink-faint mt-1.5">Mínimo 5 caracteres.</p>} />
                <Btn full size="lg" variant="success" icon="check-circle" loading={cerrando}
                  disabled={resol.trim().length < 5} onClick={confirmarCierre}>
                  Cerrar incidencia
                </Btn>
              </>
            ) : (
              <div className="bg-good-soft rounded-[16px] px-4 py-3.5">
                <div className="flex items-center gap-2 mb-1">
                  <Icon name="check-circle" size={16} className="text-good-ink" />
                  <p className="text-[12px] font-black text-good-ink">Incidencia resuelta</p>
                </div>
                {actual.resolucion && <p className="text-[11px] text-good-ink/80 leading-relaxed mt-1">{actual.resolucion}</p>}
              </div>
            )}
          </div>
        )}
      </Sheet>
      <AuditSheet codigo={actaCodigo} onClose={() => setActaCodigo(null)} />
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   ADMINISTRACIÓN — RUTAS MENSUALES
═══════════════════════════════════════════════════════════ */
function RutasAdmin() {
  const { apiFetch } = useApp();
  const hoyMes = new Date().toISOString().slice(0, 7);
  const [mes, setMes] = useState(hoyMes);
  const [supervisores, setSupervisores] = useState([]);
  const [supId, setSupId] = useState("todos");
  const [objetivos, setObjetivos] = useState([]);
  const [visitas, setVisitas] = useState([]);
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState(null);
  const [msgOk, setMsgOk] = useState(null);

  // Modales
  const [modalAuto, setModalAuto] = useState(false);
  const [modalNueva, setModalNueva] = useState(false);
  const [supAuto, setSupAuto] = useState("");
  const [objsAutoSel, setObjsAutoSel] = useState([]);
  const [creandoAuto, setCreandoAuto] = useState(false);

  // Formulario manual
  const [fSup, setFSup] = useState("");
  const [fObj, setFObj] = useState("");
  const [fFecha, setFFecha] = useState(new Date().toISOString().slice(0, 10));
  const [fOrden, setFOrden] = useState("1");
  const [fNota, setFNota] = useState("");
  const [guardandoManual, setGuardandoManual] = useState(false);

  useEffect(() => {
    apiFetch("/api/admin/usuarios").then(r => r.json()).then(d => {
      if (d.ok) setSupervisores(d.usuarios.filter(u => u.rol === "supervisor" && u.activo));
    }).catch(() => {});
    apiFetch("/api/admin/objetivos").then(r => r.json()).then(d => {
      if (d.ok) setObjetivos(d.objetivos.filter(o => o.activo));
    }).catch(() => {});
  }, [apiFetch]);

  const cargarRutas = useCallback(() => {
    setCargando(true);
    setError(null);
    let url = `/api/admin/rutas?mes=${mes}`;
    if (supId !== "todos") url += `&supervisor_id=${supId}`;
    apiFetch(url).then(r => r.json()).then(d => {
      if (d.ok) setVisitas(d.visitas || d.rutas || []);
      else setError(d.mensaje || "No se pudieron cargar las rutas.");
    }).catch(() => setError("Error al conectar con el servidor.")).finally(() => setCargando(false));
  }, [apiFetch, mes, supId]);

  useEffect(() => { cargarRutas(); }, [cargarRutas]);

  const cambiarMes = (delta) => {
    const [y, m] = mes.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    setMes(d.toISOString().slice(0, 7));
  };

  const borrarVisita = async (id) => {
    if (!confirm("¿Eliminar esta visita programada?")) return;
    try {
      const r = await apiFetch(`/api/admin/rutas/${id}`, { method: "DELETE" }).then(res => res.json());
      if (r.ok) {
        setMsgOk("Visita eliminada.");
        setTimeout(() => setMsgOk(null), 3000);
        cargarRutas();
      } else {
        alert(r.mensaje || "No se pudo eliminar la visita.");
      }
    } catch {
      alert("Error al contactar con el servidor.");
    }
  };

  const abrirAuto = () => {
    setSupAuto(supervisores[0]?.id ? String(supervisores[0].id) : "");
    setObjsAutoSel(objetivos.map(o => o.id));
    setModalAuto(true);
  };

  const ejecutarGenerarAuto = async () => {
    if (!supAuto || !objsAutoSel.length) return;
    setCreandoAuto(true);
    try {
      const r = await apiFetch("/api/admin/rutas/generar", {
        method: "POST",
        body: JSON.stringify({ mes, supervisor_id: Number(supAuto), objetivo_ids: objsAutoSel })
      }).then(res => res.json());
      if (r.ok) {
        setMsgOk(r.mensaje || `Se generaron ${r.creadas} visitas.`);
        setModalAuto(false);
        setTimeout(() => setMsgOk(null), 4000);
        cargarRutas();
      } else {
        alert(r.mensaje || "Error al generar la ruta.");
      }
    } catch {
      alert("Error de conexión al generar la ruta.");
    } finally {
      setCreandoAuto(false);
    }
  };

  const guardarNuevaVisita = async (e) => {
    e.preventDefault();
    if (!fSup || !fObj || !fFecha) return;
    setGuardandoManual(true);
    try {
      const r = await apiFetch("/api/admin/rutas", {
        method: "POST",
        body: JSON.stringify({
          supervisor_id: Number(fSup),
          objetivo_id: Number(fObj),
          fecha: fFecha,
          orden: Number(fOrden) || 1,
          nota: fNota.trim() || null,
        })
      }).then(res => res.json());
      if (r.ok) {
        setMsgOk("Visita programada agregada con éxito.");
        setModalNueva(false);
        setFNota("");
        setTimeout(() => setMsgOk(null), 3000);
        cargarRutas();
      } else {
        alert(r.mensaje || "No se pudo crear la visita.");
      }
    } catch {
      alert("Error al contactar con el servidor.");
    } finally {
      setGuardandoManual(false);
    }
  };

  const porFecha = useMemo(() => {
    const g = {};
    for (const v of visitas) {
      const fStr = typeof v.fecha === "string" ? v.fecha.slice(0, 10) : new Date(v.fecha).toISOString().slice(0, 10);
      (g[fStr] ||= []).push(v);
    }
    return Object.entries(g).sort((a,b) => a[0].localeCompare(b[0]));
  }, [visitas]);

  const totalHechas = visitas.filter(v => v.ronda_id != null).length;

  return (
    <div className="flex flex-col gap-3">
      {msgOk && <div className="p-3 bg-good-soft text-good-ink rounded-clay text-sm font-semibold">{msgOk}</div>}
      {error && <div className="p-3 bg-bad-soft text-bad-ink rounded-clay text-sm font-semibold">{error}</div>}

      <div className="flex flex-wrap items-center justify-between gap-2.5">
        <div className="flex items-center gap-2">
          <Btn size="sm" variant="secondary" onClick={() => cambiarMes(-1)}>‹ Anterior</Btn>
          <span className="text-[17px] font-semibold text-ink px-1 capitalize">
            {new Date(mes + "-15").toLocaleDateString("es-AR", { month:"long", year:"numeric" })}
          </span>
          <Btn size="sm" variant="secondary" onClick={() => cambiarMes(1)}>Siguiente ›</Btn>
        </div>
        <div className="flex items-center gap-2">
          <Btn size="sm" variant="secondary" icon="plus" onClick={() => {
            setFSup(supervisores[0]?.id ? String(supervisores[0].id) : "");
            setFObj(objetivos[0]?.id ? String(objetivos[0].id) : "");
            setModalNueva(true);
          }}>Nueva visita</Btn>
          <Btn size="sm" variant="primary" icon="refresh" onClick={abrirAuto}>Generar ruta auto</Btn>
        </div>
      </div>

      <div className="grid grid-cols-1 md:grid-cols-3 gap-2.5">
        <div className="clay p-3 flex flex-col justify-center">
          <Label className="mb-1">Supervisor</Label>
          <select value={supId} onChange={e => setSupId(e.target.value)}
            className="w-full bg-white text-ink text-sm font-semibold outline-none py-1">
            <option value="todos">Todos los supervisores</option>
            {supervisores.map(s => <option key={s.id} value={s.id}>{s.nombre} ({s.username})</option>)}
          </select>
        </div>
        <Clay className="p-3 text-center">
          <p className="text-2xl font-black text-ink tnum">{visitas.length}</p>
          <p className="text-[11px] font-semibold text-ink-mute">Visitas planificadas</p>
        </Clay>
        <Clay className="p-3 text-center">
          <p className="text-2xl font-black text-good tnum">{totalHechas}</p>
          <p className="text-[11px] font-semibold text-ink-mute">Realizadas en el mes</p>
        </Clay>
      </div>

      {cargando ? <SkeletonRows count={4} /> : porFecha.length === 0 ? (
        <Empty icon="calendar" title="Sin rutas programadas" sub="Usá 'Generar ruta auto' o 'Nueva visita' para armar el mes." />
      ) : (
        <div className="flex flex-col gap-3">
          {porFecha.map(([fStr, vList]) => {
            const dateObj = new Date(fStr + "T00:00:00");
            const esHoy = fStr === new Date().toISOString().slice(0,10);
            return (
              <div key={fStr} className="flex flex-col gap-1.5">
                <div className="flex items-center justify-between px-1">
                  <span className={cx("text-[13px] font-semibold uppercase tracking-wider", esHoy ? "text-brand-600" : "text-ink-mute")}>
                    {fmtFecha(dateObj)} · {dateObj.toLocaleDateString("es-AR", { weekday:"long" })} {esHoy && "— HOY"}
                  </span>
                  <span className="text-[12px] font-semibold text-ink-faint">{vList.length} visita{vList.length !== 1 ? "s" : ""}</span>
                </div>
                <div className="clay overflow-hidden divide-y divide-line">
                  {vList.map(v => {
                    const realizada = v.ronda_id != null;
                    return (
                      <div key={v.id} className="p-3.5 flex items-center justify-between gap-3 fila-toque">
                        <div className="min-w-0 flex-1">
                          <div className="flex items-center gap-2">
                            <span className="text-[13px] font-bold text-ink-mute w-5">#{v.orden}</span>
                            <p className="text-[16px] font-semibold text-ink leading-tight truncate">{v.objetivo_nombre}</p>
                            <Badge tone={realizada ? "good" : "warn"}>{realizada ? "Realizada" : "Pendiente"}</Badge>
                          </div>
                          <p className="text-[13px] text-ink-mute mt-1 ml-7 truncate">
                            Sup: <span className="font-semibold text-ink">{v.supervisor_nombre}</span> · {SUBTIPO_LABEL[v.subtipo] || v.tipo}
                            {v.nota ? ` · Nota: ${v.nota}` : ""}
                          </p>
                        </div>
                        {!realizada && (
                          <button onClick={() => borrarVisita(v.id)} title="Eliminar visita programada"
                            className="w-9 h-9 rounded-full flex items-center justify-center text-bad hover:bg-bad-soft clay-press">
                            <Icon name="trash" size={17} />
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Modal: Generar ruta automática */}
      <Sheet open={modalAuto} onClose={() => setModalAuto(false)} title="Generar ruta automática" sub={`Mes ${mes}`}>
        <div className="flex flex-col gap-3.5">
          <p className="text-sm text-ink-mute leading-relaxed">
            Reparte automáticamente las visitas requeridas (meta mensual) de los objetivos seleccionados entre los días hábiles del mes, evitando superposiciones.
          </p>
          <div>
            <Label className="mb-1">Supervisor asignado</Label>
            <select value={supAuto} onChange={e => setSupAuto(e.target.value)}
              className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink font-semibold">
              {supervisores.map(s => <option key={s.id} value={s.id}>{s.nombre} ({s.username})</option>)}
            </select>
          </div>
          <div>
            <div className="flex items-center justify-between mb-1.5">
              <Label>Objetivos a incluir ({objsAutoSel.length})</Label>
              <button onClick={() => setObjsAutoSel(objsAutoSel.length === objetivos.length ? [] : objetivos.map(o => o.id))}
                className="text-xs font-semibold text-brand-600">
                {objsAutoSel.length === objetivos.length ? "Deseleccionar todos" : "Seleccionar todos"}
              </button>
            </div>
            <div className="clay max-h-56 overflow-y-auto p-2 divide-y divide-line">
              {objetivos.map(o => {
                const sel = objsAutoSel.includes(o.id);
                return (
                  <label key={o.id} className="flex items-center gap-2.5 p-2 cursor-pointer hover:bg-hover rounded-[8px]">
                    <input type="checkbox" checked={sel} onChange={() => {
                      setObjsAutoSel(p => sel ? p.filter(id => id !== o.id) : [...p, o.id]);
                    }} className="rounded text-brand-600 focus:ring-brand-500" />
                    <span className="text-sm font-semibold text-ink flex-1">{o.nombre}</span>
                    <span className="text-xs text-ink-mute">{o.visitas_meta_mes || 0} v/mes</span>
                  </label>
                );
              })}
            </div>
          </div>
          <Btn full size="lg" icon="refresh" loading={creandoAuto} onClick={ejecutarGenerarAuto}>
            Generar visitas del mes
          </Btn>
        </div>
      </Sheet>

      {/* Modal: Nueva visita manual */}
      <Sheet open={modalNueva} onClose={() => setModalNueva(false)} title="Programar visita individual" sub={`Mes ${mes}`}>
        <form onSubmit={guardarNuevaVisita} className="flex flex-col gap-3.5">
          <div>
            <Label className="mb-1">Supervisor</Label>
            <select value={fSup} onChange={e => setFSup(e.target.value)} required
              className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink font-semibold">
              {supervisores.map(s => <option key={s.id} value={s.id}>{s.nombre}</option>)}
            </select>
          </div>
          <div>
            <Label className="mb-1">Objetivo</Label>
            <select value={fObj} onChange={e => setFObj(e.target.value)} required
              className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink font-semibold">
              {objetivos.map(o => <option key={o.id} value={o.id}>{o.nombre} ({SUBTIPO_LABEL[o.subtipo] || o.tipo})</option>)}
            </select>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div>
              <Label className="mb-1">Fecha</Label>
              <input type="date" value={fFecha} onChange={e => setFFecha(e.target.value)} required
                className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink outline-none" />
            </div>
            <div>
              <Label className="mb-1">Orden en el día</Label>
              <input type="number" min="1" max="50" value={fOrden} onChange={e => setFOrden(e.target.value)} required
                className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink outline-none" />
            </div>
          </div>
          <Input label="Nota o instrucción" value={fNota} onChange={e => setFNota(e.target.value)} placeholder="Ej.: Revisar libro de novedades" />
          <Btn full size="lg" icon="check" loading={guardandoManual} type="submit">
            Guardar visita programada
          </Btn>
        </form>
      </Sheet>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   ADMINISTRACIÓN — OBJETIVOS
═══════════════════════════════════════════════════════════ */
function ObjetivosAdmin() {
  const { apiFetch } = useApp();
  const [lista, setLista] = useState([]);
  const [cargando, setCargando] = useState(false);
  const [busqueda, setBusqueda] = useState("");
  const [filtroTipo, setFiltroTipo] = useState("todos");
  const [filtroActivo, setFiltroActivo] = useState("activos");
  const [error, setError] = useState(null);
  const [msgOk, setMsgOk] = useState(null);

  // Edición / Creación
  const [modalForm, setModalForm] = useState(false);
  const [guardando, setGuardando] = useState(false);
  const [editId, setEditId] = useState(null);
  const [fNombre, setFNombre] = useState("");
  const [fSubtipo, setFSubtipo] = useState("barrio_multipuesto");
  const [fDireccion, setFDireccion] = useState("");
  const [fLat, setFLat] = useState(-34.6037);
  const [fLng, setFLng] = useState(-58.3816);
  const [fRadio, setFRadio] = useState(150);
  const [fMeta, setFMeta] = useState(4);
  const [fNotas, setFNotas] = useState("");

  // Búsqueda Nominatim
  const [busqDir, setBusqDir] = useState("");
  const [buscandoDir, setBuscandoDir] = useState(false);
  const [errorDir, setErrorDir] = useState(null);

  const cargar = useCallback(() => {
    setCargando(true);
    apiFetch("/api/admin/objetivos").then(r => r.json()).then(d => {
      if (d.ok) setLista(d.objetivos || []);
    }).catch(() => setError("Error al cargar objetivos.")).finally(() => setCargando(false));
  }, [apiFetch]);

  useEffect(() => { cargar(); }, [cargar]);

  const abrirNuevo = () => {
    setEditId(null);
    setFNombre("");
    setFSubtipo("barrio_multipuesto");
    setFDireccion("");
    setFLat(-34.6037);
    setFLng(-58.3816);
    setFRadio(150);
    setFMeta(4);
    setFNotas("");
    setBusqDir("");
    setErrorDir(null);
    setModalForm(true);
  };

  const abrirEditar = (o) => {
    setEditId(o.id);
    setFNombre(o.nombre);
    setFSubtipo(o.subtipo || "barrio_multipuesto");
    setFDireccion(o.direccion || "");
    setFLat(Number(o.lat) || -34.6037);
    setFLng(Number(o.lng) || -58.3816);
    setFRadio(Number(o.radio_geocerca_m) || 150);
    setFMeta(Number(o.visitas_meta_mes) || 0);
    setFNotas(o.notas || "");
    setBusqDir(o.direccion || "");
    setErrorDir(null);
    setModalForm(true);
  };

  const buscarNominatim = async () => {
    if (!busqDir.trim()) return;
    setBuscandoDir(true);
    setErrorDir(null);
    try {
      const q = encodeURIComponent(busqDir.trim() + ", Argentina");
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&countrycodes=ar&limit=1`, {
        headers: { "Accept-Language": "es" }
      });
      const data = await r.json();
      if (data && data.length > 0) {
        const nLat = Number(parseFloat(data[0].lat).toFixed(6));
        const nLng = Number(parseFloat(data[0].lon).toFixed(6));
        setFLat(nLat);
        setFLng(nLng);
        if (!fDireccion.trim()) setFDireccion(data[0].display_name.split(",").slice(0, 2).join(","));
      } else {
        setErrorDir("No se encontraron resultados para esa dirección.");
      }
    } catch {
      setErrorDir("No se pudo conectar al servicio de direcciones.");
    } finally {
      setBuscandoDir(false);
    }
  };

  const usarMiUbicacion = () => {
    if (!navigator.geolocation) {
      setErrorDir("El navegador no soporta geolocalización.");
      return;
    }
    setBuscandoDir(true);
    navigator.geolocation.getCurrentPosition(
      pos => {
        setFLat(Number(pos.coords.latitude.toFixed(6)));
        setFLng(Number(pos.coords.longitude.toFixed(6)));
        setBuscandoDir(false);
      },
      () => {
        setErrorDir("No se pudo obtener la ubicación actual.");
        setBuscandoDir(false);
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  const guardar = async (e) => {
    e.preventDefault();
    if (!fNombre.trim()) return;
    setGuardando(true);
    setError(null);
    const body = {
      nombre: fNombre.trim(),
      subtipo: fSubtipo,
      direccion: fDireccion.trim() || null,
      lat: Number(fLat),
      lng: Number(fLng),
      radio_geocerca_m: Number(fRadio),
      visitas_meta_mes: Number(fMeta),
      notas: fNotas.trim() || null,
    };
    try {
      const url = editId ? `/api/admin/objetivos/${editId}` : "/api/admin/objetivos";
      const method = editId ? "PATCH" : "POST";
      const res = await apiFetch(url, { method, body: JSON.stringify(body) });
      const data = await res.json();
      if (data.ok) {
        setMsgOk(editId ? "Objetivo actualizado." : "Objetivo creado.");
        setModalForm(false);
        setTimeout(() => setMsgOk(null), 3000);
        cargar();
      } else {
        alert(data.mensaje || "Error al guardar el objetivo.");
      }
    } catch {
      alert("Error al contactar con el servidor.");
    } finally {
      setGuardando(false);
    }
  };

  const toggleBaja = async (o) => {
    const acc = o.activo ? "baja" : "reactivar";
    if (!confirm(`¿Confirmás dar de ${acc} al objetivo "${o.nombre}"?`)) return;
    try {
      const res = await apiFetch(`/api/admin/objetivos/${o.id}/${acc}`, { method: "PATCH" });
      const data = await res.json();
      if (data.ok) {
        setMsgOk(`Objetivo ${acc === "baja" ? "dado de baja" : "reactivado"}.`);
        setTimeout(() => setMsgOk(null), 3000);
        cargar();
      } else {
        alert(data.mensaje || "Error al cambiar el estado.");
      }
    } catch {
      alert("Error de conexión.");
    }
  };

  const filtrados = lista.filter(o => {
    if (filtroActivo === "activos" && !o.activo) return false;
    if (filtroActivo === "bajas" && o.activo) return false;
    if (filtroTipo !== "todos" && o.tipo !== filtroTipo) return false;
    if (busqueda.trim() && !o.nombre.toLowerCase().includes(busqueda.toLowerCase()) &&
        !(o.direccion || "").toLowerCase().includes(busqueda.toLowerCase())) return false;
    return true;
  });

  return (
    <div className="flex flex-col gap-3">
      {msgOk && <div className="p-3 bg-good-soft text-good-ink rounded-clay text-sm font-semibold">{msgOk}</div>}
      {error && <div className="p-3 bg-bad-soft text-bad-ink rounded-clay text-sm font-semibold">{error}</div>}

      <div className="flex flex-wrap items-center justify-between gap-2.5">
        <div className="flex-1 min-w-[200px]">
          <input value={busqueda} onChange={e => setBusqueda(e.target.value)}
            placeholder="Buscar por nombre o dirección…"
            className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink outline-none" />
        </div>
        <div className="flex items-center gap-2">
          <select value={filtroTipo} onChange={e => setFiltroTipo(e.target.value)}
            className="clay-inset rounded-xl px-2.5 py-2 text-xs font-semibold text-ink">
            <option value="todos">Todos los tipos</option>
            <option value="Barrios">Barrios</option>
            <option value="Industrias">Industrias</option>
            <option value="Locales">Locales / Oficinas</option>
          </select>
          <select value={filtroActivo} onChange={e => setFiltroActivo(e.target.value)}
            className="clay-inset rounded-xl px-2.5 py-2 text-xs font-semibold text-ink">
            <option value="activos">Solo activos</option>
            <option value="bajas">Dados de baja</option>
            <option value="todos">Todos</option>
          </select>
          <Btn size="sm" icon="plus" onClick={abrirNuevo}>Nuevo objetivo</Btn>
        </div>
      </div>

      {cargando ? <SkeletonRows count={4} /> : filtrados.length === 0 ? (
        <Empty icon="target" title="Sin objetivos" sub="No se encontraron objetivos con este filtro." />
      ) : (
        <div className="flex flex-col gap-2">
          {filtrados.map(o => (
            <div key={o.id} className={cx("clay p-3.5 flex flex-wrap items-center justify-between gap-3", !o.activo && "opacity-60")}>
              <div className="min-w-0 flex-1">
                <div className="flex items-center gap-2">
                  <p className="text-[17px] font-semibold text-ink leading-tight">{o.nombre}</p>
                  <Badge tone={o.activo ? "good" : "bad"}>{o.activo ? "Activo" : "Baja"}</Badge>
                  <Badge tone="gray">{SUBTIPO_LABEL[o.subtipo] || o.tipo}</Badge>
                </div>
                <p className="text-[14px] text-ink-mute mt-1">
                  {o.direccion ? o.direccion : "Sin dirección"} · Geocerca: {o.radio_geocerca_m}m · Meta: {o.visitas_meta_mes || 0} v/mes
                </p>
                {o.notas && <p className="text-[12px] text-ink-faint mt-0.5 italic">{o.notas}</p>}
              </div>
              <div className="flex items-center gap-2">
                <Btn size="sm" variant="secondary" icon="pen" onClick={() => abrirEditar(o)}>Editar</Btn>
                <Btn size="sm" variant={o.activo ? "white" : "secondary"}
                  onClick={() => toggleBaja(o)}>
                  {o.activo ? "Dar de baja" : "Reactivar"}
                </Btn>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Sheet Editor */}
      <Sheet open={modalForm} onClose={() => setModalForm(false)}
        title={editId ? "Editar objetivo" : "Nuevo objetivo"}
        sub="Ubicación precisa para validación de geocerca en rondas">
        <form onSubmit={guardar} className="flex flex-col gap-3.5">
          <Input label="Nombre del objetivo" value={fNombre} onChange={e => setFNombre(e.target.value)} required placeholder="Ej.: Barrio Los Álamos" />

          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <Label className="mb-1">Subtipo / Categoría</Label>
              <select value={fSubtipo} onChange={e => setFSubtipo(e.target.value)}
                className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink font-semibold">
                <option value="barrio_multipuesto">Barrio · Multipuesto (Barrios)</option>
                <option value="barrio_unipersonal">Barrio · Unipersonal (Barrios)</option>
                <option value="local_comercial">Local comercial (Locales)</option>
                <option value="industria">Industria / Planta (Industrias)</option>
                <option value="empresa_oficinas">Empresa / Oficinas (Locales)</option>
              </select>
            </div>
            <div>
              <Label className="mb-1">Meta mensual de visitas</Label>
              <input type="number" min="0" max="999" value={fMeta} onChange={e => setFMeta(e.target.value)}
                className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink outline-none" />
            </div>
          </div>

          <Input label="Dirección postal" value={fDireccion} onChange={e => setFDireccion(e.target.value)} placeholder="Ej.: Av. San Martín 1234, Tigre" />

          {/* Buscador Nominatim y geolocalización */}
          <div className="clay p-3 flex flex-col gap-2">
            <Label>Localizar en mapa</Label>
            <div className="flex gap-2">
              <input value={busqDir} onChange={e => setBusqDir(e.target.value)}
                placeholder="Ingresá una dirección o lugar a buscar…"
                className="clay-inset flex-1 rounded-xl px-3 py-1.5 text-sm text-ink outline-none" />
              <Btn size="sm" variant="secondary" loading={buscandoDir} onClick={buscarNominatim} type="button">Buscar</Btn>
              <Btn size="sm" variant="white" icon="pin" onClick={usarMiUbicacion} type="button">Mi GPS</Btn>
            </div>
            {errorDir && <p className="text-xs text-bad-ink">{errorDir}</p>}
            <MapPicker lat={fLat} lng={fLng} radio={fRadio} onChange={(nLat, nLng) => { setFLat(nLat); setFLng(nLng); }} />
            <div className="flex items-center justify-between text-xs text-ink-mute px-1">
              <span>Arrastrá el marcador o hacé clic para ubicar el centro.</span>
              <span className="font-mono tnum">GPS: {fLat.toFixed(5)}, {fLng.toFixed(5)}</span>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <Label className="mb-1">Radio de geocerca (metros)</Label>
              <input type="number" min="30" max="5000" value={fRadio} onChange={e => setFRadio(e.target.value)}
                className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink outline-none" />
            </div>
            <div className="flex items-end pb-2">
              <span className="text-xs text-ink-mute leading-snug">Rango permitido: 30 a 5.000 metros.</span>
            </div>
          </div>

          <Textarea label="Notas internas" value={fNotas} onChange={e => setFNotas(e.target.value)} rows={2} placeholder="Información de acceso, contacto o consignas específicas…" />

          <Btn full size="lg" icon="check" loading={guardando} type="submit">
            {editId ? "Guardar cambios" : "Crear objetivo"}
          </Btn>
        </form>
      </Sheet>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   ADMINISTRACIÓN — VIGILADORES
═══════════════════════════════════════════════════════════ */
function VigiladoresAdmin() {
  const { apiFetch } = useApp();
  const [lista, setLista] = useState([]);
  const [objetivos, setObjetivos] = useState([]);
  const [cargando, setCargando] = useState(false);
  const [busqueda, setBusqueda] = useState("");
  const [filtroActivo, setFiltroActivo] = useState("activos");
  const [error, setError] = useState(null);
  const [msgOk, setMsgOk] = useState(null);

  // Formulario de edición/creación
  const [modalForm, setModalForm] = useState(false);
  const [guardando, setGuardando] = useState(false);
  const [editId, setEditId] = useState(null);
  const [fLegajo, setFLegajo] = useState("");
  const [fNombre, setFNombre] = useState("");
  const [fDni, setFDni] = useState("");
  const [fTelefono, setFTelefono] = useState("");
  const [fObjId, setFObjId] = useState("");
  const [fCategoria, setFCategoria] = useState("Vigilador General");
  const [fTurno, setFTurno] = useState("Rotativo");
  const [fFechaIngreso, setFFechaIngreso] = useState("");
  const [fEstadoAfip, setFEstadoAfip] = useState("Activo");
  const [fCursoLey, setFCursoLey] = useState(false);
  const [fVtoCurso, setFVtoCurso] = useState("");
  const [fReincidencia, setFReincidencia] = useState(false);
  const [fVtoReincidencia, setFVtoReincidencia] = useState("");
  const [fPsico, setFPsico] = useState(false);
  const [fVtoPsico, setFVtoPsico] = useState("");
  const [fNotas, setFNotas] = useState("");

  // Detalle (Sanciones e Historial)
  const [selVig, setSelVig] = useState(null);
  const [tabDetalle, setTabDetalle] = useState("datos");
  const [sanciones, setSanciones] = useState([]);
  const [historial, setHistorial] = useState([]);
  const [cargandoDetalle, setCargandoDetalle] = useState(false);

  // Modales secundarios de detalle
  const [modalSancion, setModalSancion] = useState(false);
  const [sTipo, setSTipo] = useState("Apercibimiento");
  const [sFecha, setSFecha] = useState(new Date().toISOString().slice(0, 10));
  const [sDias, setSDias] = useState(0);
  const [sMotivo, setSMotivo] = useState("");
  const [guardandoSancion, setGuardandoSancion] = useState(false);

  const [modalHistorial, setModalHistorial] = useState(false);
  const [hEvento, setHEvento] = useState("Traslado");
  const [hFecha, setHFecha] = useState(new Date().toISOString().slice(0, 10));
  const [hDestino, setHDestino] = useState("");
  const [hMotivo, setHMotivo] = useState("");
  const [guardandoHistorial, setGuardandoHistorial] = useState(false);

  const cargar = useCallback(() => {
    setCargando(true);
    apiFetch("/api/admin/vigiladores").then(r => r.json()).then(d => {
      if (d.ok) setLista(d.vigiladores || []);
    }).catch(() => setError("Error al cargar vigiladores.")).finally(() => setCargando(false));
    apiFetch("/api/admin/objetivos").then(r => r.json()).then(d => {
      if (d.ok) setObjetivos(d.objetivos.filter(o => o.activo));
    }).catch(() => {});
  }, [apiFetch]);

  useEffect(() => { cargar(); }, [cargar]);

  const abrirNuevo = () => {
    setEditId(null);
    setFLegajo("");
    setFNombre("");
    setFDni("");
    setFTelefono("");
    setFObjId("");
    setFCategoria("Vigilador General");
    setFTurno("Rotativo");
    setFFechaIngreso(new Date().toISOString().slice(0, 10));
    setFEstadoAfip("Activo");
    setFCursoLey(true);
    setFVtoCurso("");
    setFReincidencia(true);
    setFVtoReincidencia("");
    setFPsico(true);
    setFVtoPsico("");
    setFNotas("");
    setModalForm(true);
  };

  const abrirEditar = (v) => {
    setEditId(v.id);
    setFLegajo(v.legajo);
    setFNombre(v.nombre);
    setFDni(v.dni || "");
    setFTelefono(v.telefono || "");
    setFObjId(v.objetivo_asignado_id ? String(v.objetivo_asignado_id) : "");
    setFCategoria(v.categoria || "Vigilador General");
    setFTurno(v.turno || "Rotativo");
    setFFechaIngreso(v.fecha_ingreso ? v.fecha_ingreso.slice(0, 10) : "");
    setFEstadoAfip(v.estado_afip || "Activo");
    setFCursoLey(Boolean(v.curso_ley));
    setFVtoCurso(v.vto_curso ? v.vto_curso.slice(0, 10) : "");
    setFReincidencia(Boolean(v.reincidencia));
    setFVtoReincidencia(v.vto_reincidencia ? v.vto_reincidencia.slice(0, 10) : "");
    setFPsico(Boolean(v.psicofisico));
    setFVtoPsico(v.vto_psico ? v.vto_psico.slice(0, 10) : "");
    setFNotas(v.notas || "");
    setModalForm(true);
  };

  const verDetalle = (v) => {
    setSelVig(v);
    setTabDetalle("datos");
    setCargandoDetalle(true);
    Promise.all([
      apiFetch(`/api/admin/vigiladores/${v.id}/sanciones`).then(r => r.json()),
      apiFetch(`/api/admin/vigiladores/${v.id}/historial`).then(r => r.json())
    ]).then(([sData, hData]) => {
      if (sData.ok) setSanciones(sData.sanciones || []);
      if (hData.ok) setHistorial(hData.historial || []);
    }).catch(() => {}).finally(() => setCargandoDetalle(false));
  };

  const guardarVigilador = async (e) => {
    e.preventDefault();
    if (!fLegajo.trim() || !fNombre.trim()) return;
    setGuardando(true);
    const body = {
      legajo: fLegajo.trim(),
      nombre: fNombre.trim(),
      dni: fDni.trim() || null,
      telefono: fTelefono.trim() || null,
      objetivo_asignado_id: fObjId ? Number(fObjId) : null,
      categoria: fCategoria.trim() || null,
      turno: fTurno.trim() || null,
      fecha_ingreso: fFechaIngreso || null,
      estado_afip: fEstadoAfip || null,
      curso_ley: Boolean(fCursoLey),
      vto_curso: fVtoCurso || null,
      reincidencia: Boolean(fReincidencia),
      vto_reincidencia: fVtoReincidencia || null,
      psicofisico: Boolean(fPsico),
      vto_psico: fVtoPsico || null,
      notas: fNotas.trim() || null,
    };
    try {
      const url = editId ? `/api/admin/vigiladores/${editId}` : "/api/admin/vigiladores";
      const method = editId ? "PATCH" : "POST";
      const res = await apiFetch(url, { method, body: JSON.stringify(body) });
      const data = await res.json();
      if (data.ok) {
        setMsgOk(editId ? "Vigilador actualizado." : "Vigilador creado.");
        setModalForm(false);
        setTimeout(() => setMsgOk(null), 3000);
        cargar();
      } else {
        alert(data.mensaje || "Error al guardar el vigilador.");
      }
    } catch {
      alert("Error al contactar con el servidor.");
    } finally {
      setGuardando(false);
    }
  };

  const toggleBaja = async (v) => {
    const acc = v.activo ? "baja" : "reactivar";
    if (!confirm(`¿Confirmás dar de ${acc} al vigilador "${v.nombre}"?`)) return;
    try {
      const res = await apiFetch(`/api/admin/vigiladores/${v.id}/${acc}`, { method: "PATCH" });
      const data = await res.json();
      if (data.ok) {
        setMsgOk(`Vigilador ${acc === "baja" ? "dado de baja" : "reactivado"}.`);
        setTimeout(() => setMsgOk(null), 3000);
        cargar();
        if (selVig?.id === v.id) setSelVig(null);
      } else {
        alert(data.mensaje || "Error al cambiar estado.");
      }
    } catch {
      alert("Error de conexión.");
    }
  };

  const guardarSancion = async (e) => {
    e.preventDefault();
    if (!selVig || !sMotivo.trim()) return;
    setGuardandoSancion(true);
    try {
      const res = await apiFetch(`/api/admin/vigiladores/${selVig.id}/sanciones`, {
        method: "POST",
        body: JSON.stringify({
          tipo: sTipo,
          fecha: sFecha,
          dias_suspension: Number(sDias) || 0,
          motivo: sMotivo.trim(),
        })
      });
      const data = await res.json();
      if (data.ok) {
        setModalSancion(false);
        setSMotivo("");
        const sRes = await apiFetch(`/api/admin/vigiladores/${selVig.id}/sanciones`).then(r => r.json());
        if (sRes.ok) setSanciones(sRes.sanciones || []);
      } else {
        alert(data.mensaje || "Error al registrar la sanción.");
      }
    } catch {
      alert("Error de conexión.");
    } finally {
      setGuardandoSancion(false);
    }
  };

  const bajaSancion = async (id) => {
    if (!confirm("¿Dar de baja esta sanción?")) return;
    try {
      const res = await apiFetch(`/api/admin/sanciones/${id}/baja`, { method: "PATCH" });
      const data = await res.json();
      if (data.ok) {
        const sRes = await apiFetch(`/api/admin/vigiladores/${selVig.id}/sanciones`).then(r => r.json());
        if (sRes.ok) setSanciones(sRes.sanciones || []);
      }
    } catch { alert("Error de conexión."); }
  };

  const guardarHistorial = async (e) => {
    e.preventDefault();
    if (!selVig || !hMotivo.trim()) return;
    setGuardandoHistorial(true);
    try {
      const res = await apiFetch(`/api/admin/vigiladores/${selVig.id}/historial`, {
        method: "POST",
        body: JSON.stringify({
          tipo_evento: hEvento,
          fecha: hFecha,
          objetivo_origen_id: selVig.objetivo_asignado_id || null,
          objetivo_destino_id: hDestino ? Number(hDestino) : null,
          motivo: hMotivo.trim(),
        })
      });
      const data = await res.json();
      if (data.ok) {
        setModalHistorial(false);
        setHMotivo("");
        const hRes = await apiFetch(`/api/admin/vigiladores/${selVig.id}/historial`).then(r => r.json());
        if (hRes.ok) setHistorial(hRes.historial || []);
      } else {
        alert(data.mensaje || "Error al registrar el evento.");
      }
    } catch {
      alert("Error de conexión.");
    } finally {
      setGuardandoHistorial(false);
    }
  };

  const bajaHistorial = async (id) => {
    if (!confirm("¿Dar de baja este registro histórico?")) return;
    try {
      const res = await apiFetch(`/api/admin/historial/${id}/baja`, { method: "PATCH" });
      const data = await res.json();
      if (data.ok) {
        const hRes = await apiFetch(`/api/admin/vigiladores/${selVig.id}/historial`).then(r => r.json());
        if (hRes.ok) setHistorial(hRes.historial || []);
      }
    } catch { alert("Error de conexión."); }
  };

  const filtrados = lista.filter(v => {
    if (filtroActivo === "activos" && !v.activo) return false;
    if (filtroActivo === "bajas" && v.activo) return false;
    if (busqueda.trim() && !v.nombre.toLowerCase().includes(busqueda.toLowerCase()) &&
        !v.legajo.toLowerCase().includes(busqueda.toLowerCase()) &&
        !(v.dni || "").includes(busqueda)) return false;
    return true;
  });

  return (
    <div className="flex flex-col gap-3">
      {msgOk && <div className="p-3 bg-good-soft text-good-ink rounded-clay text-sm font-semibold">{msgOk}</div>}
      {error && <div className="p-3 bg-bad-soft text-bad-ink rounded-clay text-sm font-semibold">{error}</div>}

      <div className="flex flex-wrap items-center justify-between gap-2.5">
        <div className="flex-1 min-w-[200px]">
          <input value={busqueda} onChange={e => setBusqueda(e.target.value)}
            placeholder="Buscar por nombre, legajo o DNI…"
            className="clay-inset w-full rounded-xl px-3 py-2 text-sm text-ink outline-none" />
        </div>
        <div className="flex items-center gap-2">
          <select value={filtroActivo} onChange={e => setFiltroActivo(e.target.value)}
            className="clay-inset rounded-xl px-2.5 py-2 text-xs font-semibold text-ink">
            <option value="activos">Solo activos</option>
            <option value="bajas">Dados de baja</option>
            <option value="todos">Todos</option>
          </select>
          <Btn size="sm" icon="plus" onClick={abrirNuevo}>Nuevo vigilador</Btn>
        </div>
      </div>

      {cargando ? <SkeletonRows count={4} /> : filtrados.length === 0 ? (
        <Empty icon="users" title="Sin vigiladores" sub="No se encontraron vigiladores con este filtro." />
      ) : (
        <div className="flex flex-col gap-2">
          {filtrados.map(v => (
            <div key={v.id} className={cx("clay p-3.5 flex flex-wrap items-center justify-between gap-3", !v.activo && "opacity-60")}>
              <button onClick={() => verDetalle(v)} className="min-w-0 flex-1 text-left">
                <div className="flex items-center gap-2">
                  <span className="font-mono text-xs font-bold text-ink-mute">[{v.legajo}]</span>
                  <p className="text-[17px] font-semibold text-ink leading-tight">{v.nombre}</p>
                  <Badge tone={v.activo ? "good" : "bad"}>{v.activo ? "Activo" : "Baja"}</Badge>
                </div>
                <p className="text-[14px] text-ink-mute mt-1">
                  {v.objetivo_nombre ? `Asignado a: ${v.objetivo_nombre}` : "Sin objetivo asignado"} · {v.categoria || "Vigilador"} {v.turno ? `· ${v.turno}` : ""}
                </p>
              </button>

          </div>
        )}
      </Sheet>

      {/* Modal: Formulario Vigilador */}
      <Sheet open={modalForm} onClose={() => setModalForm(false)}

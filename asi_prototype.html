  <style>
    /* ═══════ SISTEMA "APPLE INSTITUCIONAL" (ver DESIGN.md) ═══════
       Superficies blancas planas sobre fondo gris azulado, separadas por
       líneas de 1px. Un solo color de marca: el azul marino del logo.
       Los nombres de clase .clay* se conservan para no tocar cada panel,
       pero ya no llevan sombras acolchadas. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: "Barlow", system-ui, sans-serif; background: #F4F6FA; color: #16256E; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    /* iOS hace zoom al enfocar campos de menos de 16px: en celular todos van a 16px o más */
    @media (pointer: coarse) { input, textarea, select { font-size: max(16px, 1em) !important; } }
    #root { min-height: 100vh; }
    button { cursor: pointer; border: 0 solid; background: none; font-family: inherit; color: inherit; }
    input, textarea, select { font-family: inherit; }
    input::placeholder, textarea::placeholder { color: #8A93B0; }
    .tnum { font-variant-numeric: tabular-nums; }
    .font-cond { font-family: "Barlow Semi Condensed", "Barlow", sans-serif; }

    /* ── Escala de campo: el supervisor lee caminando, con guantes y luz
       variable. Los tamaños chicos heredados se suben a un mínimo legible
       y los pesos 800/900 se bajan a 600 (Barlow no se usa en negro). ── */
    #root .text-\[9px\]  { font-size: 12px; }
    #root .text-\[10px\] { font-size: 13px; }
    #root .text-\[11px\] { font-size: 14px; }
    #root .text-\[12px\], #root .text-xs { font-size: 14px; line-height: 1.4; }
    #root .text-\[13px\] { font-size: 15px; }
    #root .text-sm { font-size: 16px; line-height: 1.45; }
    #root .font-black, #root .font-extrabold { font-weight: 600; }
    #root .font-bold { font-weight: 600; }
    #root .font-semibold { font-weight: 500; }
    #root .tracking-tight { letter-spacing: -0.005em; }

    /* ── Scrollbar discreta ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D5DAE6; border-radius: 6px; }

    /* ═══════ Superficies ═══════ */
    .clay, .clay-sm {
      background: #FFFFFF;
      border: 1px solid #E2E6EF;
      border-radius: 14px;
    }
    .clay-inset {
      background: #FFFFFF;
      border: 1px solid #E2E6EF;
      border-radius: 12px;
      min-height: 52px;
    }
    .clay-inset:focus-within { outline: 3px solid #2152A1; outline-offset: 2px; }
    .clay-tint { border-radius: 14px; }

    /* ═══════ Botones ═══════ */
    .clay-btn {
      border-radius: 14px;
      transition: transform .1s ease, background-color .15s ease, color .15s ease;
    }
    .clay-btn:active:not(:disabled) { transform: scale(.97); }
    .clay-btn:disabled { cursor: not-allowed; }
    .clay-btn:focus-visible, .focus-ring:focus-visible { outline: 3px solid #2152A1; outline-offset: 2px; }
    .clay-press { transition: transform .1s ease, background-color .15s ease; }
    .clay-press:active { transform: scale(.985); }
    .fila-toque { transition: background-color .15s ease; }
    .fila-toque:active { background-color: #E6EAF5; }

    /* ═══════ Animaciones ═══════ */
    @keyframes fadeIn   { from { opacity:0 } to { opacity:1 } }
    @keyframes slideUp  { from { opacity:0; transform: translateY(12px) } to { opacity:1; transform:none } }
    @keyframes slideDn  { from { opacity:0; transform: translateY(-10px) } to { opacity:1; transform:none } }
    @keyframes sheetUp  { from { transform: translateY(100%) } to { transform: translateY(0) } }
    @keyframes popIn    { 0% { transform: scale(.8); opacity:0 } 100% { transform: scale(1); opacity:1 } }
    @keyframes spin     { to { transform: rotate(360deg) } }
    @keyframes breathe  { 0%,100% { opacity:1 } 50% { opacity:.35 } }
    @keyframes shimmer  { 0% { background-position: -420px 0 } 100% { background-position: 420px 0 } }
    .a-fade  { animation: fadeIn .2s ease-out both }
    .a-up    { animation: slideUp .32s cubic-bezier(.2,.8,.2,1) both }
    .a-dn    { animation: slideDn .28s cubic-bezier(.2,.8,.2,1) both }
    .a-sheet { animation: sheetUp .32s cubic-bezier(.2,.8,.2,1) both }
    .a-pop   { animation: popIn .3s ease-out both }
    .a-spin  { animation: spin .9s linear infinite; display:inline-block }
    .a-pulse { animation: breathe 1.8s ease-in-out infinite }
    .skeleton {
      background: linear-gradient(90deg, #EEF1F6 25%, #F7F8FC 50%, #EEF1F6 75%);
      background-size: 840px 100%;
      animation: shimmer 1.5s infinite linear;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    /* ═══════ Utilidades ═══════ */
    .scroll-y { height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .sig-canvas { cursor: crosshair; display: block; touch-action: none; }
    .no-select { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .stripe-bg {
      background-image: linear-gradient(135deg, rgba(22,37,110,.04) 25%, transparent 25%, transparent 50%, rgba(22,37,110,.04) 50%, rgba(22,37,110,.04) 75%, transparent 75%);
      background-size: 14px 14px;
    }

    /* ═══════ Adaptación desktop/tablet — solo Admin y Dueño ═══════
       PhoneFrame aplica los modificadores "--wide" únicamente cuando el
       panel activo es admin/dueño (ver AppInner). Login y Supervisor
       siguen renderizando .device-wrap/.device-shell sin el modificador,
       así que estas reglas @media nunca los afectan, sin importar el
       ancho del viewport — quedan fijos en el marco de teléfono. */
    .device-wrap { width: 100%; max-width: 392px; }
    @media (min-width: 768px) {
      .device-wrap.device-wrap--wide { max-width: 760px; }
    }
    @media (min-width: 1024px) {
      .device-wrap.device-wrap--wide { max-width: 1200px; }
    }
    .device-shell {
      background: #F4F6FA; border-radius: 44px; overflow: hidden; height: 800px;
      border: 8px solid #16256E; position: relative; display: flex; flex-direction: column;
      box-shadow: 0 24px 60px rgba(22,37,110,.18);
    }
    @media (min-width: 768px) {
      /* En escritorio el bezel no tiene sentido: el panel se vuelve una
         ventana plana con borde de 1px, como el resto del sistema. */
      .device-shell.device-shell--wide {
        border-radius: 14px; border: 1px solid #E2E6EF; height: auto; min-height: calc(100vh - 108px);
        box-shadow: none;
      }
      .device-shell--wide .phone-chrome { display: none; }
      .device-shell--wide .device-body { overflow: visible; }
    }
  </style>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback, useContext, createContext } = React;

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
const cx = (...a) => a.filter(Boolean).join(" ");

const fmtFecha = (d) => new Date(d).toLocaleDateString("es-AR", { day:"2-digit", month:"2-digit", year:"numeric" });
const fmtHora  = (d) => new Date(d).toLocaleTimeString("es-AR", { hour:"2-digit", minute:"2-digit" });
const fmtLargo = (d) => new Date(d).toLocaleDateString("es-AR", { weekday:"long", day:"numeric", month:"long", year:"numeric" });

const diasHasta = (fecha) => fecha ? Math.ceil((new Date(fecha) - new Date()) / 86400000) : null;

const iniciales = (nombre = "") => nombre.trim().split(/\s+/).slice(0, 2).map(w => w[0] || "").join("").toUpperCase();

const cortar = (t = "", n = 24) => t.length > n ? t.slice(0, n - 1) + "…" : t;

/* Distancia Haversine en metros — usada para validar el geocerco contra la posición real del dispositivo */
function distanciaMetros(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/* Hook: posición real del dispositivo vía navigator.geolocation (PRD §2 — validación de geocerco) */
function useDeviceGeolocation() {
  const [coords, setCoords] = useState(null);
  const [error, setError]   = useState(null);
  const [seq, setSeq]       = useState(0); // fuerza reintento

  useEffect(() => {
    if (!navigator.geolocation) { setError("unsupported"); return; }
    setError(null);
    const id = navigator.geolocation.watchPosition(
      (pos) => {
        setCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy });
        setError(null);
      },
      (err) => {
        // Se descarta la última posición conocida: si el GPS falla ahora, esas
        // coordenadas ya no acreditan dónde está el supervisor y no pueden
        // terminar firmando el acta como si fueran actuales.
        setCoords(null);
        setError(err.code === 1 ? "denied" : err.code === 2 ? "unavailable" : "timeout");
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
    );
    return () => navigator.geolocation.clearWatch(id);
  }, [seq]);

  return { coords, error, reintentar: () => setSeq((s) => s + 1) };
}

function Icon({ name, size = 20, className = "", strokeWidth = 2, fill = "none" }) {
  const d = ICON_PATHS[name];
  if (!d) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={cx("shrink-0", className)} aria-hidden="true" focusable="false">
      {d.split("|").filter(Boolean).map((p, i) => <path key={i} d={p} />)}
    </svg>
  );
}

/* ═══════════════════════════════════════════════════════════
   PRIMITIVAS CLAY
═══════════════════════════════════════════════════════════ */
function Clay({ children, className = "", inset = false, tint, as: Tag = "div", ...rest }) {
  // Sistema plano: el "tint" heredado (antes un gradiente) se reduce a su
  // primer color, sin sombra — el tono suave alcanza para comunicar el estado.
  const plano = tint ? (tint.match(/#[0-9a-f]{6}/i) || [tint])[0] : null;
  return (
    <Tag className={cx(inset ? "clay-inset" : tint ? "clay-tint" : "clay", className)}
      style={plano ? { background: plano, ...(rest.style || {}) } : rest.style} {...rest}>
      {children}
    </Tag>
  );
}

const BTN_VARIANTS = {
  primary: "bg-brand-600 text-white",
  aqua:    "bg-white text-ink border border-[#CCD3E3]",
  success: "bg-good text-white",
  danger:  "bg-bad text-white",
  warn:    "bg-warn text-white",
  white:   "bg-white text-ink border border-[#CCD3E3]",
  soft:    "bg-brand-50 text-ink",
  ghost:   "bg-transparent text-brand-500",
};

function Btn({ children, variant = "primary", size = "md", icon, iconRight, full, className = "", disabled, loading, ...rest }) {
  // Alturas pensadas para el pulgar con guantes: 44px mínimo, 56px en la acción principal.
  const sizes = {
    sm: "min-h-[44px] px-4 text-[15px] gap-1.5 rounded-[12px]",
    md: "min-h-[52px] px-5 text-[17px] gap-2 rounded-[14px]",
    lg: "min-h-[56px] px-6 text-[17px] gap-2.5 rounded-[14px]",
    xl: "min-h-[58px] px-6 text-[18px] gap-3 rounded-[14px]",
  };
  const dis = disabled || loading;
  return (
    <button disabled={dis}
      className={cx(
        "clay-btn inline-flex items-center justify-center font-semibold no-select",
        sizes[size], full && "w-full",
        dis && !loading ? "bg-[#D5DAE6] text-ink-mute" : BTN_VARIANTS[variant],
        loading && "opacity-90",
        className
      )} {...rest}>
      {loading ? <Icon name="refresh" size={18} className="a-spin" /> : icon ? <Icon name={icon} size={19} /> : null}
      {children}
      {iconRight && !loading && <Icon name={iconRight} size={19} />}
    </button>
  );
}

// Semáforo honesto: solo bien/regular/mal llevan color. El resto es neutro.
const TONE_CHIP = {
  good:  "bg-good-soft text-good-ink",
  warn:  "bg-warn-soft text-warn-ink",
  bad:   "bg-bad-soft  text-bad-ink",
  brand: "bg-brand-50  text-ink",
  aqua:  "bg-brand-50  text-ink",
  plum:  "bg-brand-50  text-ink",
  tang:  "bg-brand-50  text-ink",
  gray:  "bg-brand-50  text-ink-mute",
};

function Badge({ tone = "gray", children, icon, className = "" }) {
  return (
    <span className={cx("inline-flex items-center gap-1 rounded-full px-2.5 min-h-[26px] text-[13px] font-semibold whitespace-nowrap", TONE_CHIP[tone] || TONE_CHIP.gray, className)}>
      {icon && <Icon name={icon} size={13} strokeWidth={2.4} />}
      {children}
    </span>

}

function Dot({ tone = "good", pulse }) {
  const c = { good:"bg-[#10B981]", warn:"bg-warn", bad:"bg-[#F43F5E]", brand:"bg-brand-500", gray:"bg-brand-300" };
  return <span className={cx("w-2 h-2 rounded-full shrink-0", c[tone], pulse && "a-pulse")} />;
}

/* ── Encabezado de sección: título grande estilo iOS ── */
function SH({ title, sub, right }) {

        <h2 className="text-[28px] font-semibold text-ink leading-[1.1] tracking-[-0.01em]">{title}</h2>

/* ── Etiqueta de grupo: mayúscula condensada con tracking ancho ── */
function Label({ children, className = "" }) {
  return <p className={cx("font-cond text-[13px] font-semibold uppercase tracking-[.18em] text-ink-mute", className)}>{children}</p>;
}

/* ── Campo de texto ── */
function Input({ label, icon, error, className = "", ...rest }) {
  return (
    <label className="block">
      {label && <Label className="mb-2 px-1">{label}</Label>}
      <div className={cx("clay-inset flex items-center gap-2.5 px-3.5", error && "ring-2 ring-bad/40")}>
        {icon && <Icon name={icon} size={20} className="text-ink-faint" />}
        <input className={cx("flex-1 h-[52px] bg-transparent outline-none text-[17px] text-ink placeholder:text-[#8A93B0] min-w-0", className)} {...rest} />
      </div>
      {error && <p className="text-[14px] text-bad-ink font-semibold mt-1.5 flex items-center gap-1"><Icon name="alert" size={14} />{error}</p>}
    </label>
  );
}

function Textarea({ label, hint, className = "", ...rest }) {
  return (
    <label className="block">
      {label && <Label className="mb-2 px-1">{label}</Label>}
      <div className="clay-inset px-3.5 py-3">
        <textarea className={cx("w-full bg-transparent outline-none text-[17px] text-ink placeholder:text-[#8A93B0] resize-none leading-relaxed", className)} {...rest} />
      </div>
      {hint}
    </label>
  );
}

/* ── Anillo de progreso ── */
function Ring({ value, max, color = "#1F327C", size = 116, label }) {
  const r = 43, c = 2 * Math.PI * r;
  const pct = max > 0 ? Math.min(value / max, 1) : 0;
  return (
    <svg width={size} height={size} viewBox="0 0 110 110" className="shrink-0">
      <circle cx="55" cy="55" r={r} fill="none" stroke="#E6EAF2" strokeWidth="9" />
      <circle cx="55" cy="55" r={r} fill="none" stroke={color} strokeWidth="9" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={c - pct * c} transform="rotate(-90 55 55)"
        style={{ transition: "stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)" }} />
      <text x="55" y="53" textAnchor="middle" fill="#16256E" fontSize="24" fontWeight="600" fontFamily="Barlow">{Math.round(pct * 100)}%</text>
      <text x="55" y="70" textAnchor="middle" fill="#4A5578" fontSize="11" fontWeight="500" fontFamily="Barlow">{label || `${value}/${max}`}</text>
    </svg>
  );
}

/* ── Barra de progreso: un solo tono, extremos redondeados ── */
function Bar({ value, max, color = "#1F327C", height = 8 }) {
  const pct = max > 0 ? Math.min((value / max) * 100, 100) : 0;
  return (
    <div className="w-full overflow-hidden bg-[#E6EAF2]" style={{ height, borderRadius: height / 2 }}>
      <div className="h-full transition-[width] duration-700 ease-out"
        style={{ width: `${pct}%`, background: color, borderRadius: height / 2 }} />
    </div>
  );
}

/* ── Avatar: iniciales sobre círculo neutro ── */
function Avatar({ nombre, size = 48, src }) {
  return (
    <div className="rounded-full shrink-0 flex items-center justify-center font-semibold text-ink overflow-hidden bg-[#E6EAF5]"
      style={{ width:size, height:size, fontSize:size*.36 }}>
      {src ? <img src={src} alt="" className="w-full h-full object-cover" /> : iniciales(nombre)}
    </div>
  );
}

/* ── Stepper del wizard: "Paso N de 5" + segmentos ── */
function Stepper({ steps, current }) {
  return (
    <div className="px-5 pt-1 pb-3 shrink-0">
      <div className="flex items-center justify-between mb-2">
        <span className="font-cond text-[13px] font-semibold uppercase tracking-[.18em] text-ink-mute">Paso {current + 1} de {steps.length}</span>
        <span className="text-[15px] font-medium text-ink">{steps[current]}</span>
      </div>
      <div className="grid gap-1" style={{ gridTemplateColumns:`repeat(${steps.length}, minmax(0,1fr))` }}>
        {steps.map((s, i) => (
          <div key={s} className={cx("h-1 rounded-full transition-colors duration-300", i <= current ? "bg-brand-600" : "bg-[#D5DAE6]")} />
        ))}
      </div>
    </div>
  );
}

/* ── Selector segmentado estilo iOS ── */
function Segmented({ options, value, onChange }) {
  return (
    <div className="flex gap-0.5 p-[3px] rounded-[11px] bg-[#E6EAF2]" role="group">
      {options.map(([k, label, count]) => (
        <button key={k} onClick={() => onChange(k)} aria-pressed={value === k}

async function cargarTicketsApi(apiFetch) {
  const todos = [];
  for (let pagina = 1; pagina <= 100; pagina++) {
    const res = await apiFetch(`/api/tickets?limite=200&pagina=${pagina}`);
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.mensaje || "No se pudieron cargar las incidencias.");
    todos.push(...data.tickets);
    if (pagina >= (data.paginacion?.paginas || 1)) break;
  }
  return todos;
}

/* ═══════════════════════════════════════════════════════════
   MARCA DE AGUA SOBRE FOTO (PRD §8 paso 5 · §10)
   Estampa fecha, hora, coordenadas y supervisor en el canvas.
═══════════════════════════════════════════════════════════ */
function estamparFoto(dataUrl, meta) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const maxW  = 1080;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);

      const barH = Math.max(70, Math.round(h * 0.16));
      const g = ctx.createLinearGradient(0, h - barH, 0, h);
      g.addColorStop(0, "rgba(2,6,23,0)");
      g.addColorStop(.4, "rgba(2,6,23,.72)");
      g.addColorStop(1, "rgba(2,6,23,.93)");
      ctx.fillStyle = g;
      ctx.fillRect(0, h - barH, w, barH);

      const pad = Math.round(w * .035);
      const fs  = Math.max(14, Math.round(h * .028));
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "#ffffff";
      ctx.font = `800 ${fs}px Inter, system-ui, sans-serif`;
      ctx.fillText(meta.l1, pad, h - barH + fs * 1.7);
      ctx.fillStyle = "#bae6fd";
      ctx.font = `600 ${Math.round(fs * .84)}px Inter, system-ui, sans-serif`;
      ctx.fillText(meta.l2, pad, h - barH + fs * 3.0);
      ctx.fillText(meta.l3, pad, h - barH + fs * 4.15);

      resolve(cv.toDataURL("image/jpeg", .82));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

/* ═══════════════════════════════════════════════════════════
   PERSISTENCIA DE LA COLA OFFLINE — IndexedDB (PRD §10)
   Sin esto, un refresh o cierre de pestaña mientras hay actas
   encoladas offline las pierde por completo. Se usa IndexedDB
   y no localStorage porque las fotos en base64 pueden pesar
   varios MB y arriesgan QuotaExceededError.
═══════════════════════════════════════════════════════════ */
const QUEUE_DB_NAME = "asi_offline_queue";
const QUEUE_STORE   = "queue";

function abrirQueueDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("IndexedDB no disponible")); return; }
    const req = indexedDB.open(QUEUE_DB_NAME, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(QUEUE_STORE)) {
        req.result.createObjectStore(QUEUE_STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}

async function leerQueuePersistida() {
  try {
    const db = await abrirQueueDB();
    return await new Promise((resolve, reject) => {
      const store = db.transaction(QUEUE_STORE, "readonly").objectStore(QUEUE_STORE);
      const req   = store.getAll();
      req.onsuccess = () => resolve(req.result.map(r => r.item));
      req.onerror   = () => reject(req.error);
    });
  } catch (e) {
    console.warn("[queue] IndexedDB no disponible, cola solo en memoria:", e.message);
    return [];
  }
}

async function guardarQueuePersistida(items) {
  try {
    const db = await abrirQueueDB();
    await new Promise((resolve, reject) => {
      const tx    = db.transaction(QUEUE_STORE, "readwrite");
      const store = tx.objectStore(QUEUE_STORE);
      store.clear();
      items.forEach((item, id) => store.put({ id, item }));
      tx.oncomplete = resolve;
      tx.onerror    = () => reject(tx.error);
    });
  } catch (e) {
    console.warn("[queue] no se pudo persistir la cola:", e.message);
  }
}

/* ═══════════════════════════════════════════════════════════
   CONTEXTO GLOBAL — única fuente de verdad de la app
   Todo sale de la API (PostgreSQL). Sin señal, el supervisor sigue con los
   catálogos de la última sesión y las actas esperan en la cola persistida.
═══════════════════════════════════════════════════════════ */
const AppContext = createContext();

/* Servidor de la API: el de producción viene en <meta name="asi-api-url">.
   Para desarrollo local se puede apuntar a otro con ?api=http://localhost:3000. */
const API_URL = (() => {
  if (typeof document === "undefined") return "";
  const local = new URLSearchParams(window.location.search).get("api");
  return (local || document.querySelector('meta[name="asi-api-url"]')?.content || "").trim().replace(/\/$/, "");
})();

/* Catálogos (objetivos, vigiladores, checklist…) de la última sesión: si el supervisor
   abre la app sin señal, puede hacer la ronda igual y el acta queda en la cola. */
const K_CATALOGOS = "asi_catalogos";
function leerCatalogosGuardados() {
  try { return JSON.parse(localStorage.getItem(K_CATALOGOS)) || null; } catch { return null; }
}

function AppProvider({ children }) {
  /* ── Visitas del mes por objetivo (se suman al registrar cada acta) ── */
  const [visitasPorObj,   setVisitasPorObj]   = useState({});

  /* ── Conectividad real del dispositivo y cola offline (PRD §10) ── */
  const [offline, setOffline] = useState(() => typeof navigator !== "undefined" && navigator.onLine === false);
  useEffect(() => {
    const on  = () => setOffline(false);
    const off = () => setOffline(true);
    window.addEventListener("online", on);
    window.addEventListener("offline", off);
    return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); };
  }, []);
  const [queue,   setQueue]   = useState([]);
  const [syncing, setSyncing] = useState(false);
  const [syncMsg, setSyncMsg] = useState(null);
  const [ticketSeq, setTicketSeq] = useState(42);

  // Hidrata la cola desde IndexedDB al montar (sobrevive a un refresh/cierre de pestaña)
  const [queueHidratada, setQueueHidratada] = useState(false);
  useEffect(() => {
    leerQueuePersistida().then(items => {
      if (items.length) setQueue(items);
      setQueueHidratada(true);
    });
  }, []);

  // Persiste cada cambio — recién después de hidratar, para no pisar lo guardado con [] al montar
  useEffect(() => {
    if (!queueHidratada) return;
    guardarQueuePersistida(queue);
  }, [queue, queueHidratada]);

  /* ── Capa de API ── */
  const apiUrl = API_URL;
  const [apiStatus,   setApiStatus]   = useState("connecting"); // connecting|connected|error
  const [apiError,    setApiError]    = useState(null);
  const [currentUser, setCurrentUser] = useState(null);
  const [apiToken,    setApiToken]    = useState(null);

  /* ── Catálogos (de la API; arrancan con los de la última sesión si los hay) ── */
  const cache = useMemo(leerCatalogosGuardados, []);
  const [objetivos,     setObjetivos]     = useState(cache?.objetivos     || []);
  const [vigiladores,   setVigiladores]   = useState(cache?.vigiladores   || []);
  const [secciones,     setSecciones]     = useState(cache?.secciones     || []);
  const [checklistDefs, setChecklistDefs] = useState(cache?.checklist     || []);
  const [ajustes,       setAjustes]       = useState(cache?.ajustes       || []);
  const [observaciones, setObservaciones] = useState(cache?.observaciones || []);

  const online = apiStatus === "connected" && !offline;

  const apiFetch = useCallback((path, opts = {}) => {
    const base = apiUrl.replace(/\/$/, "");
    return fetch(base + path, {
      ...opts,
      headers: {
        "Content-Type": "application/json",
        "bypass-tunnel-reminder": "true",
        ...(apiToken ? { Authorization: `Bearer ${apiToken}` } : {}),
        ...(opts.headers || {}),
      },
    });
  }, [apiUrl, apiToken]);

  /* ── Comprobar que el servidor responde ── */
  const conectarApi = useCallback(async () => {
    if (!apiUrl) { setApiStatus("error"); setApiError("La app no tiene configurado el servidor."); return false; }
    setApiStatus("connecting"); setApiError(null);
    try {
      const res  = await fetch(apiUrl + "/");
      const data = await res.json();
      if (data.ok) { setApiStatus("connected"); return true; }
      setApiStatus("error"); setApiError("El servidor respondió con un estado inesperado.");
    } catch (e) {
      setApiStatus("error");
      setApiError("No se pudo contactar al servidor.");
    }
    return false;
  }, [apiUrl]);

  useEffect(() => { conectarApi(); }, []);
  // Al volver la señal, se vuelve a comprobar el servidor
  useEffect(() => { if (!offline && apiStatus === "error") conectarApi(); }, [offline]);

  /* ── Cargar catálogos reales tras el login ── */
  const cargarCatalogos = useCallback(async () => {
    try {
      const res  = await apiFetch("/api/inicializar");
      const data = await res.json();
      if (!data.ok) return false;
      setObjetivos(data.objetivos || []);
      setVisitasPorObj(Object.fromEntries((data.objetivos || []).map(o => [o.id, o.visitas_mes || 0])));
      setVigiladores(data.vigiladores || []);
      setSecciones(data.secciones || []);
      setChecklistDefs(data.checklist || []);
      setAjustes(data.ajustes || []);
      setObservaciones(data.observaciones || []);
      try {
        localStorage.setItem(K_CATALOGOS, JSON.stringify({
          objetivos: data.objetivos, vigiladores: data.vigiladores, secciones: data.secciones,
          checklist: data.checklist, ajustes: data.ajustes, observaciones: data.observaciones,
        }));
      } catch {}
      return true;
    } catch (e) { console.warn("[catalogos]", e.message); return false; }
  }, [apiFetch]);

  // Los catálogos requieren token: se cargan recién cuando hay sesión iniciada.
  // Si falla (señal floja, servidor ocupado) se reintenta cada 20 s hasta lograrlo.
  useEffect(() => {
    if (apiStatus !== "connected" || !apiToken || offline) return;
    let vivo = true, t;
    const intentar = async () => { if (!(await cargarCatalogos()) && vivo) t = setTimeout(intentar, 20000); };
    intentar();
    return () => { vivo = false; clearTimeout(t); };
  }, [apiStatus, apiToken, offline]);

  /* ── Commit atómico al estado local ── */
  const _commit = (payloads) => {
    setVisitasPorObj(v => {
      const n = { ...v };
      for (const p of payloads) if (p.objetivoId != null) n[p.objetivoId] = (n[p.objetivoId] || 0) + 1;
      return n;
    });
  };

  /* ── Construir el payload de una ronda terminada ── */
  const construirActa = (rd, supervisorNombre) => {
    const now   = new Date();
    const stamp = fmtFecha(now) + " · " + fmtHora(now);
    const seq   = String(Date.now()).slice(-6);

    // Cada ítem R/M genera un ticket dirigido al área de la observación elegida
    let n = ticketSeq;
    const tickets = Object.entries(rd.respuestas || {})
      .filter(([, r]) => r.estado === "R" || r.estado === "M")
      .map(([itemId, r]) => {
        const def   = checklistDefs.find(d => String(d.id) === String(itemId)) || {};
        const obs   = r.obsPred?.[0] || r.obsLibre || def.titulo_corto || "Observación registrada";
        const catal = observaciones.find(o => o.texto === r.obsPred?.[0]);
        const area  = catal?.area || def.area_responsable || "Operaciones";
        n += 1;
        return {
          id:     `INC-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}-${String(n).padStart(4,"0")}`,
          _itemId: def.id, codigoActa: null, fechaIso: now.toISOString(), obj: rd.objetivo?.nombre || "—", sup: supervisorNombre,
          val: r.estado, area, estado: "Activo", desc: obs, item: def.titulo_corto,
          vig: rd.vigiladores?.[0]?.nombre || "—", fecha: stamp, isNew: true,
        };
      });

    // La negativa a firmar genera su propio ticket a RRHH (PRD §5.2)
    for (const v of rd.vigiladores || []) {
      const f = rd.firmas?.[v.id];
      if (f?.nego) {
        n += 1;
        tickets.push({
          id: `INC-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}-${String(n).padStart(4,"0")}`,
          codigoActa: null, fechaIso: now.toISOString(), obj: rd.objetivo?.nombre || "—", sup: supervisorNombre, val: "M", area: "RRHH", estado: "Activo",
          desc: `Negativa a firmar el acta — ${v.nombre} (legajo ${v.legajo})`,
          item: "Firma del acta", vig: v.nombre, fecha: stamp, isNew: true,
        });
      }
    }
    setTicketSeq(n);

    const codigo = `ACTA-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}-${seq}`;
    const ronda = {
      id: codigo, supervisor: supervisorNombre, objetivo: rd.objetivo?.nombre || "—",
      tipo: rd.tipo || "presencial", gpsStatus: rd.gpsStatus, fecha: now,
      tickets: tickets.map(t => t.id), detalle: rd,
    };
    const partes = supervisorNombre.split(" ");
    const feed = {
      hora: fmtHora(now),
      sup:  (partes[0][0] || "") + ". " + partes[partes.length - 1],
      obj:  cortar(rd.objetivo?.nombre || "Objetivo", 20),
      tipo: rd.tipo === "remota" ? "Remota" : "Presencial",
      ok:   tickets.length === 0, isNew: true,
    };

    tickets.forEach(t => { t.codigoActa = codigo; });
    return { ronda, tickets, feed, codigo, objetivoId: rd.objetivo?.id, generadaEn: now };
  };

  /* ── Enviar el acta al backend real ── */
  const enviarActaApi = useCallback(async (rd, acta) => {
    const objId = rd.objetivo?.id;
    if (!objId) return;
    const body = {
      objetivo_id: objId,
      tipo: rd.tipo || "presencial",
      // El servidor recalcula el geocerco con estos datos; no le mandamos nuestro veredicto
      lat: rd.deviceCoords?.lat ?? null, lng: rd.deviceCoords?.lng ?? null,
      precision_gps_m: rd.deviceCoords?.accuracy ?? null,
      justificacion_fuera: rd.justificacion || null,
      sincronizado_offline: Boolean(rd._offline),
      hora_inicio: rd.horaInicio ? new Date(rd.horaInicio).toISOString() : null,
      hora_fin:    new Date().toISOString(),
      vigiladores: (rd.vigiladores || []).map(v => ({
        id: v.id,
        firma_base64: rd.firmas?.[v.id]?.dataUrl || null,
        nego_firmar:  Boolean(rd.firmas?.[v.id]?.nego),
      })),
      checklist: Object.entries(rd.respuestas || {}).map(([itemId, r]) => {
        const def = checklistDefs.find(d => String(d.id) === String(itemId)) || {};
        return {
          item_id: def.id, pregunta: def.titulo_corto, valoracion: r.estado,
          observacion_pred: (r.obsPred || []).join(" · ") || null,
          observacion_libre: r.obsLibre || null,
        };
      }),
      incidencias: acta.tickets.map(t => ({
        item_id: t._itemId, item_titulo: t.item, valoracion: t.val,
        area_responsable: t.area, categoria: t.area, descripcion: t.desc,
        vigilador_id: (rd.vigiladores || [])[0]?.id,
      })),
      evidencias: (rd.fotos || []).map(f => ({ imagen_base64: f.dataUrl, lat: f.lat, lng: f.lng,
        item_id: f.itemId || null, tomada_en: f.ts || null })),
    };
    const res  = await apiFetch("/api/rondas", { method:"POST", body: JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      const err = new Error(data.mensaje || "El servidor rechazó el acta.");
      // 4xx = el servidor la rechazó por su contenido (ej. fuera del geocerco sin
      // justificación): reintentar no sirve, hay que avisarle al supervisor.
      // 401 (sesión vencida), 408, 429 y 5xx sí se reintentan desde la cola.
      err.rechazo = res.status >= 400 && res.status < 500 && ![401, 408, 429].includes(res.status);
      throw err;
    }
    return data;
  }, [apiFetch, checklistDefs]);

  /* ── Guardar ronda: envío al servidor o cola FIFO si no hay señal ── */
  const guardarRonda = async (rd, supervisorNombre) => {
    const acta = construirActa(rd, supervisorNombre);
    const encolar = () => {
      setQueue(q => [...q, { acta, rd: { ...rd, _offline: true } }]);
      return { estado: "encolada", acta };
    };

    if (offline) return encolar();
    try {
      const r = await enviarActaApi(rd, acta);
      _commit([acta]);
      return { estado: "guardada", acta: { ...acta, codigo: r?.codigo_acta || acta.codigo }, servidor: true };
    } catch (e) {
      if (e.rechazo) return { estado: "rechazada", acta, mensaje: e.message };
      return encolar(); // se cortó la red o el servidor no respondió: queda en la cola
    }
  };

  /* ── Sincronizar la cola pendiente ── */
  const queueRef = useRef(queue);
  useEffect(() => { queueRef.current = queue; }, [queue]);

  const sincronizar = useCallback(async () => {
    const pend = queueRef.current;
    if (!pend.length || syncing) return;
    // Hace falta sesión de supervisor: las actas esperan en la cola (IndexedDB) hasta el login.
    if (offline || !apiToken || currentUser?.rol !== "supervisor") return;
    setSyncing(true); setSyncMsg(null);

    // Trackea el resultado por acta: la que falla por red queda en la cola para el
    // próximo reintento; la que el servidor rechaza sale de la cola y se avisa.
    const exitosas = [], fallidas = [], rechazadas = [];
    for (const p of pend) {
      try { await enviarActaApi(p.rd, p.acta); exitosas.push(p); }
      catch (e) { console.warn("[sync]", e.message); (e.rechazo ? rechazadas : fallidas).push({ ...p, error: e.message }); }
    }

    if (exitosas.length) _commit(exitosas.map(p => p.acta));
    setQueue(fallidas.map(({ error, ...p }) => p));
    setSyncing(false);

    const n = exitosas.length, f = fallidas.length, r = rechazadas.length;
    if (r) {
      setSyncMsg({ tone:"warn", text:`${r} acta${r > 1 ? "s" : ""} rechazada${r > 1 ? "s" : ""} por el servidor: ${rechazadas[0].error}` });
    } else if (f === 0) {
      setSyncMsg({ tone:"good", text:`${n} acta${n > 1 ? "s" : ""} sincronizada${n > 1 ? "s" : ""} con el servidor.` });
    } else {
      setSyncMsg({ tone:"warn", text:`${n} sincronizada${n === 1 ? "" : "s"}, ${f} pendiente${f === 1 ? "" : "s"} — se reintentará.` });
    }
    setTimeout(() => setSyncMsg(null), r ? 9000 : 5200);
  }, [offline, apiToken, currentUser, enviarActaApi, syncing]);

  /* Envío al volver la señal (o al iniciar sesión) y reintento cada 60 s (PRD §10) */
  useEffect(() => {
    if (offline || queue.length === 0 || !apiToken) return;
    const pronto = setTimeout(() => sincronizar(), 1500);
    const t = setInterval(() => { sincronizar(); }, 60000);
    return () => { clearTimeout(pronto); clearInterval(t); };
  }, [offline, queue.length, apiToken, sincronizar]);

  const cerrarSesion = () => { setCurrentUser(null); setApiToken(null); };

  return (
    <AppContext.Provider value={{
      visitasPorObj,
      offline, queue, syncing, syncMsg, online,
      guardarRonda, sincronizar, cerrarSesion,
      apiUrl, apiStatus, apiError, apiFetch, conectarApi, cargarCatalogos,
      currentUser, setCurrentUser, apiToken, setApiToken,
      objetivos, vigiladores, secciones, checklistDefs, ajustes, observaciones,
    }}>
      {children}
    </AppContext.Provider>
  );
}

const fmtFechaHora = (iso) => new Date(iso).toLocaleString("es-AR",
  { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });

/* ── Cambio de la propia contraseña ──
   Supervisor y Administración piden la clave nueva y Dirección la aprueba;
   hasta entonces sigue valiendo la actual. Dirección cambia la suya directo. */
function CambiarClaveSheet({ open, onClose }) {
  const { apiFetch, currentUser } = useApp();
  const [actual, setActual] = useState("");
  const [nueva,  setNueva]  = useState("");
  const [repite, setRepite] = useState("");
  const [err,    setErr]    = useState(null);
  const [load,   setLoad]   = useState(false);
  const [hecho,  setHecho]  = useState(null);       // null | "pendiente" | "aprobada"
  const [previo, setPrevio] = useState(null);       // pedido pendiente anterior (API)
  const esDueno = currentUser?.rol === "dueno";

  useEffect(() => {
    if (!open) return;
    setActual(""); setNueva(""); setRepite(""); setErr(null); setHecho(null); setPrevio(null);
    apiFetch("/api/cuenta/clave").then(r => r.json())
      .then(d => { if (d.ok && d.solicitud?.estado === "pendiente") setPrevio(d.solicitud); }).catch(() => {});
  }, [open]);

  const enviar = async () => {
    setErr(null);
    if (!actual) { setErr("Ingresá tu contraseña actual."); return; }
    if (nueva.length < 8) { setErr("La contraseña nueva debe tener al menos 8 caracteres."); return; }
    if (nueva !== repite) { setErr("Las dos contraseñas nuevas no coinciden."); return; }
    if (nueva === actual) { setErr("La contraseña nueva tiene que ser distinta de la actual."); return; }
    setLoad(true);
    try {
      const res = await apiFetch("/api/cuenta/clave", { method:"POST",
        body: JSON.stringify({ clave_actual: actual, clave_nueva: nueva }) });
      const r = await res.json();
      if (r.ok) setHecho(r.estado); else setErr(r.mensaje || "No se pudo registrar el pedido.");
    } catch { setErr("No se pudo contactar al servidor. Probá de nuevo con señal."); }
    finally { setLoad(false); }
  };

  return (
    <Sheet open={open} onClose={onClose} title="Cambiar contraseña"
      sub={esDueno ? "El cambio rige al instante." : "Dirección tiene que aprobar el cambio."}>
      {hecho ? (
        <div className="flex flex-col items-center text-center pt-4 gap-3">
          <div className={cx("w-14 h-14 rounded-full flex items-center justify-center", hecho === "aprobada" ? "bg-good-soft text-good-ink" : "bg-warn-soft text-warn-ink")}>
            <Icon name={hecho === "aprobada" ? "check" : "clock"} size={26} />
          </div>
          <p className="text-[19px] font-semibold text-ink">
            {hecho === "aprobada" ? "Contraseña actualizada" : "Pedido enviado a Dirección"}
          </p>
          <p className="text-[16px] text-ink-mute leading-snug max-w-[300px]">
            {hecho === "aprobada"
              ? "La próxima vez ingresá con la contraseña nueva."
              : "Hasta que Dirección lo apruebe, seguí ingresando con tu contraseña actual."}
          </p>
          <Btn full size="lg" className="mt-2" onClick={onClose}>Listo</Btn>
        </div>
      ) : (
        <div className="flex flex-col gap-3.5 pt-1">
          {previo && (
            <div className="rounded-[14px] bg-warn-soft text-warn-ink px-4 py-3 text-[15px] font-semibold leading-snug flex gap-2">
              <Icon name="clock" size={18} />
              <span>Ya tenés un pedido esperando aprobación desde el {fmtFechaHora(previo.creada_en)}. Si enviás otro, reemplaza al anterior.</span>
            </div>
          )}
          <Input label="Contraseña actual" icon="lock" type="password" autoComplete="current-password"
            value={actual} onChange={e => setActual(e.target.value)} />
          <Input label="Contraseña nueva" icon="key" type="password" autoComplete="new-password"
            value={nueva} onChange={e => setNueva(e.target.value)} placeholder="Mínimo 8 caracteres" />
          <Input label="Repetir contraseña nueva" icon="key" type="password" autoComplete="new-password"
            value={repite} onChange={e => setRepite(e.target.value)}
            onKeyDown={e => e.key === "Enter" && enviar()} />
          {err && (
            <p className="text-[15px] text-bad-ink font-semibold flex items-center gap-1.5" role="alert">
              <Icon name="alert" size={16} />{err}
            </p>
          )}
          <Btn full size="xl" onClick={enviar} loading={load} className="mt-1">
            {esDueno ? "Cambiar contraseña" : "Enviar pedido"}
          </Btn>
        </div>
      )}
    </Sheet>
  );
}

/* ── Pedidos de cambio de contraseña pendientes (solo Dirección) ── */
function PedidosClave() {
  const { apiFetch } = useApp();
  const [lista, setLista] = useState([]);
  const [ocupado, setOcupado] = useState(null);
  const [err, setErr] = useState(null);

  const cargar = useCallback(() => {
    apiFetch("/api/solicitudes-clave").then(r => r.json())
      .then(d => { if (d.ok) setLista(d.solicitudes); }).catch(() => {});
  }, [apiFetch]);
  useEffect(() => { cargar(); }, [cargar]);

  const pedidos = lista;
  if (!pedidos.length) return null;

  const resolver = async (id, aprobar) => {
    setErr(null);
    setOcupado(id);
    try {
      const d = await apiFetch(`/api/solicitudes-clave/${id}`, { method:"PATCH", body: JSON.stringify({ aprobar }) }).then(r => r.json());
      if (!d.ok) setErr(d.mensaje || "No se pudo resolver el pedido.");
    } catch { setErr("No se pudo contactar al servidor."); }
    setOcupado(null); cargar();
  };
  const ROL = { supervisor:"Supervisor", admin:"Administración", dueno:"Dirección" };

  return (
    <Clay className="p-4 md:p-5">
      <Label className="mb-1">Cambios de contraseña por aprobar</Label>
      <p className="text-[15px] text-ink-mute mb-2 leading-snug">La contraseña nueva recién rige cuando la aprobás. Vos no la ves.</p>
      {pedidos.map((p, i) => (
        <div key={p.id} className={cx("flex flex-wrap items-center gap-3 py-3", i > 0 && "border-t border-line")}>
          <div className="flex-1 min-w-[160px]">
            <p className="text-[17px] font-semibold text-ink leading-tight">{p.nombre}</p>
            <p className="text-[14px] text-ink-mute">{ROL[p.rol] || p.rol} · {p.username} · pedido el {fmtFechaHora(p.creada_en)}</p>
          </div>
          <div className="flex gap-2">
            <Btn size="sm" variant="white" disabled={ocupado === p.id} onClick={() => resolver(p.id, false)}>Rechazar</Btn>
            <Btn size="sm" icon="check" loading={ocupado === p.id} onClick={() => resolver(p.id, true)}>Aprobar</Btn>
          </div>
        </div>
      ))}
      {err && <p className="text-[15px] text-bad-ink font-semibold mt-1" role="alert">{err}</p>}
    </Clay>
  );
}

/* ── Usuarios pendientes de aprobación por Dirección ── */
function UsuariosPendientesAprobacion() {
  const { apiFetch } = useApp();
  const [lista, setLista] = useState([]);
  const [ocupado, setOcupado] = useState(null);
  const [err, setErr] = useState(null);

  const cargar = useCallback(() => {
    apiFetch("/api/admin/usuarios/pendientes").then(r => r.json())
      .then(d => { if (d.ok) setLista(d.pendientes || []); }).catch(() => {});
  }, [apiFetch]);
  useEffect(() => { cargar(); }, [cargar]);

  if (!lista.length) return null;

  const resolver = async (id, aprobar) => {
    setErr(null);
    setOcupado(id);
    try {
      const d = await apiFetch(`/api/admin/usuarios/aprobar/${id}`, {
        method: "PATCH",
        body: JSON.stringify({ aprobar })
      }).then(r => r.json());
      if (!d.ok) setErr(d.mensaje || "No se pudo procesar la solicitud.");
    } catch {
      setErr("No se pudo contactar al servidor.");
    }
    setOcupado(null);
    cargar();
  };

  const ROL = { supervisor: "Supervisor", admin: "Administración", dueno: "Dirección" };

  return (

      <Label className="mb-1">Usuarios nuevos por aprobar</Label>
      <p className="text-[15px] text-ink-mute mb-2 leading-snug">
        Creados por Administración. Requieren tu confirmación antes de que puedan ingresar al sistema.
      </p>
      {lista.map((u, i) => (
        <div key={u.id} className={cx("flex flex-wrap items-center gap-3 py-3", i > 0 && "border-t border-line")}>

            <p className="text-[17px] font-semibold text-ink leading-tight">{u.nombre}</p>
            <p className="text-[14px] text-ink-mute">

            </p>
          </div>
          <div className="flex gap-2">
            <Btn size="sm" variant="white" disabled={ocupado === u.id} onClick={() => resolver(u.id, false)}>Rechazar</Btn>

        </div>
      ))}
      {err && <p className="text-[15px] text-bad-ink font-semibold mt-1" role="alert">{err}</p>}
    </Clay>
  );
}

function SyncToast() {
  const { syncMsg, syncing, offline, queue } = useApp();
  let text = null, tone = "brand", icon = "cloud";

  if (syncing)            { text = `Enviando ${queue.length} acta${queue.length !== 1 ? "s" : ""} en cola…`; tone = "brand"; icon = "refresh"; }
  else if (syncMsg)       { text = syncMsg.text; tone = syncMsg.tone; icon = syncMsg.tone === "warn" ? "alert" : "check-circle"; }
  else if (queue.length) { text = `${queue.length} acta${queue.length > 1 ? "s" : ""} guardada${queue.length > 1 ? "s" : ""} en el celular · se envían solas al volver la señal (reintento cada 60 s)`; tone = "offline"; icon = "cloud-off"; }

  if (!text) return null;
  const bg = { brand:"bg-[#E6EAF5] text-ink", good:"bg-good-soft text-good-ink", warn:"bg-warn-soft text-warn-ink", offline:"bg-brand-600 text-white" }[tone];
  return (
    <div className={cx("mx-5 md:mx-8 mb-2 rounded-[14px] px-4 py-3 flex items-center gap-2.5 a-dn shrink-0", bg)}>
      <Icon name={icon} size={18} className={syncing ? "a-spin" : ""} />
      <span className="text-[15px] font-semibold leading-snug">{text}</span>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   LOGIN — usuario y contraseña (PRD §1)
═══════════════════════════════════════════════════════════ */
function LoginScreen() {
  const { apiStatus, apiError, apiFetch, conectarApi, setCurrentUser, setApiToken } = useApp();
  const [user, setUser]   = useState("");
  const [pass, setPass]   = useState("");
  const [ver,  setVer]    = useState(false);
  const [load, setLoad]   = useState(false);
  const [err,  setErr]    = useState(null);

  const entrar = async () => {
    setErr(null);
    if (!user.trim() || !pass) { setErr("Ingresá usuario y contraseña."); return; }
    setLoad(true);
    try {
      // Si la app abrió sin señal, se reintenta la conexión al momento de ingresar.
      if (apiStatus !== "connected" && !(await conectarApi())) {
        setErr("Sin conexión con el servidor. Probá de nuevo cuando tengas señal.");
        return;
      }
      const res  = await apiFetch("/api/login", { method:"POST", body: JSON.stringify({ username:user.trim(), password:pass }) });
      const data = await res.json();
      if (data.ok) { setApiToken(data.token); setCurrentUser(data.usuario); }
      else setErr(data.mensaje || "Usuario o contraseña incorrectos.");
    } catch { setErr("No se pudo contactar al servidor."); }
    finally { setLoad(false); }
  };

  return (
    <div className="relative flex-1 flex flex-col overflow-hidden bg-page a-fade">
      {/* Marca de agua del emblema — 4.5% de opacidad, solo en el login */}

            <span className="w-5 h-px bg-[#B9C2DA]" />

        </div>

          <h1 className="text-[30px] leading-[1.1] font-semibold tracking-[-0.01em] text-ink">Iniciar sesión</h1>
